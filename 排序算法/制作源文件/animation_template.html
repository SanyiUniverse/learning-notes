:root{color-scheme:light;--paper:#f6f7f4;--ink:#20322c;--muted:#52665d;--line:#d8e2dc;--base:#88b2ce;--active:#f5bf6b;--move:#c9b8ef;--done:#a5d5bf;--button:#255d48;--surface:#fff;--slot:#f1f4f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:960px;margin:auto;padding:24px 24px 40px}button,select,input{font:inherit;color:inherit}button,select{min-height:44px;padding:8px 15px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}button:hover{background:#eef4f0}button:disabled{opacity:.42;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #3476ae;outline-offset:3px}.primary{background:var(--button);color:#fff;border-color:var(--button)}.primary:hover{background:#194c39}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.top a{color:var(--button);font-size:15px}.lang{display:flex;gap:8px}.lang button{padding:6px 12px;min-height:38px}.lang button[aria-pressed=true]{background:var(--button);color:#fff}.eyebrow{margin:24px 0 4px;color:var(--muted);font-size:15px}h1{font-size:30px;line-height:1.3;margin:0 0 12px;font-weight:650}h2{font-size:22px;line-height:1.45;font-weight:650;margin:0 0 8px}p{margin:0 0 12px}.welcome{padding:16px 20px;margin:20px 0;background:#e9f1ec;border-radius:12px}.welcome ol{padding-left:23px;margin:8px 0 0}.welcome li+li{margin-top:3px}.path{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.path button{flex:1;white-space:nowrap;font-size:15px}.path button[aria-pressed=true]{background:var(--button);color:#fff;border-color:var(--button)}.method{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 0 16px}.method label{font-weight:600}.method select{flex:1;min-width:230px}.intro{color:var(--muted);margin:0 0 18px;max-width:760px}.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.story{padding:20px 22px 14px;min-height:145px}.story .step{font-size:14px;color:var(--muted);margin-bottom:6px}.story h2{font-size:21px}.story p{margin:0;line-height:1.65}.scene{position:relative;width:100%;height:285px;overflow:hidden}.lane-label{position:absolute;left:20px;top:3px;z-index:2;font-size:14px;color:var(--muted);background:var(--surface);padding-right:10px}.lane-label.second{top:253px}.baseline{position:absolute;left:20px;right:20px;height:1px;background:var(--line);top:230px}.baseline.second{top:460px}.slot{position:absolute;top:231px;text-align:center;color:var(--muted);font-size:12px;width:40px}.slot.second{top:461px}.empty{position:absolute;background:var(--slot);border-radius:7px;border:1px dashed #c5d2ca;height:90px;top:139px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}.empty.second{top:369px}.record{position:absolute;top:0;left:0;transform-origin:bottom left;transition:transform .65s ease,height .65s ease,background .25s ease;width:60px;background:var(--base);border-radius:8px 8px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#172e27;padding-bottom:8px;z-index:3}.record.active{background:var(--active)}.record.moved{background:var(--move)}.record.done,.record.local{background:var(--done)}.record.active,.record.moved{z-index:4}.value{font-size:25px;font-weight:700;line-height:1.25}.identity{font-size:12px;line-height:1.5}.record-tag{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:12px;line-height:1.35;white-space:nowrap;background:var(--surface);color:var(--ink);padding:2px 4px;border-radius:4px}.range{font-size:14px;color:var(--muted);padding:0 22px 10px}.legend{display:flex;flex-wrap:wrap;gap:9px 18px;font-size:13px;color:var(--muted);padding:0 22px 16px}.dot{display:inline-block;width:12px;height:12px;margin-right:5px;border-radius:3px;background:var(--active)}.dot.move{background:var(--move)}.dot.done{background:var(--done)}.controls{display:flex;flex-wrap:wrap;gap:9px;padding:18px 0 10px}.controls button{flex:1;min-width:116px}.footnote{font-size:14px;color:var(--muted);margin:5px 0 18px}.finish{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:15px 18px;background:#e9f1ec;border-radius:10px;margin:12px 0}.finish p{margin:0;flex:1}.finish[hidden]{display:none}details{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}summary{cursor:pointer;color:var(--button);font-weight:600}details>div{padding-top:15px}details p{max-width:790px}.change-data{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.change-data input{min-width:180px;flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}.error{color:#a52820;font-size:15px}.counter{padding:0 22px 18px}.counter-title{font-size:14px;color:var(--muted);margin-bottom:8px}.tallies{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:7px}.tally{background:var(--slot);text-align:center;border-radius:8px;padding:6px 4px}.tally.active{background:var(--active)}.tally .small{font-size:12px;color:var(--muted)}.tally strong{display:block;font-size:23px;line-height:1.25}.text-list{padding-left:22px;margin:8px 0}.text-list li+li{margin-top:6px}.hidden{display:none!important}footer{font-size:13px;color:var(--muted);padding-top:28px}footer a{color:var(--button)}@media(max-width:600px){body{font-size:16px}main{padding:16px 12px 28px}h1{font-size:25px}.welcome{padding:13px 15px}.path button{flex:1 1 100%;text-align:left}.story{padding:17px 15px 12px;min-height:168px}.story h2{font-size:19px}.legend,.range,.counter{padding-left:15px;padding-right:15px}.controls button{flex:1 1 42%}.value{font-size:23px}.top{gap:8px}.top a{font-size:13px}.method select{min-width:170px}.record-tag{font-size:11px}.tallies{grid-template-columns:repeat(auto-fit,minmax(53px,1fr))}.finish{padding:13px}.footnote{font-size:13px}}@media(prefers-reduced-motion:reduce){.record{transition:none}}

<main>
 <div class="top"><a id="home" href="00_从这里开始.html">← 返回学习手册</a><div class="lang" aria-label="Language"><button id="zh" type="button" aria-pressed="true">中文</button><button id="en" type="button" aria-pressed="false">English</button></div></div>
 <p class="eyebrow" id="eyebrow">先看懂一个动作，再学一种方法</p>
 <h1 id="page-title">排序：看着数字一步步排好</h1>
 <div class="welcome"><strong id="welcome-title">第一次用，先记住这三句话</strong><ol id="instructions"><li>每根长条是一条记录。条越高，数字越大。</li><li>点“下一步”，只看一个动作；先读解释，再看长条。</li><li>没看懂就点“上一动作”；想连续看就点“自动慢播放”，随时可暂停。</li></ol></div>
 <nav class="path" aria-label="学习路径"><button id="lesson1" type="button" aria-pressed="true">1 认识长条</button><button id="lesson2" type="button" aria-pressed="false">2 比较和交换</button><button id="lesson3" type="button" aria-pressed="false">3 看一种方法</button></nav>
 <div class="method" id="method-area"><label for="method" id="method-label">这次看哪一种</label><select id="method"><option value="bubble">冒泡：每次比较相邻两根</option><option value="selection">选择：先找出最小的一根</option><option value="insertion">插入：给手里的数找位置</option><option value="merge">归并：把两小排合成一排</option><option value="quick">快速：用一个数划分两边</option><option value="counting">计数：先数每个值有几条</option></select></div>
 <p class="intro" id="intro"></p>
 <div class="controls"><button type="button" id="prev">上一动作</button><button type="button" id="next" class="primary">下一步</button><button type="button" id="play">自动慢播放</button><button type="button" id="restart">重看</button></div>
 <section class="board" aria-label="一步一步的排序过程">
  <div class="story" aria-live="polite" aria-atomic="true"><div class="step" id="progress"></div><h2 id="action-title"></h2><p id="reason"></p></div>
  <div class="scene" id="scene" role="img" aria-label="四条数字记录"></div>
  <div class="range" id="range"></div>
  <div class="counter" id="counter" hidden><div class="counter-title" id="counter-title"></div><div class="tallies" id="tallies"></div></div>
  <div class="legend" id="legend"></div>
 </section>
 <p class="footnote" id="footnote">没有自动开始。你可以按自己的速度看。键盘左右方向键也能前后走一步。</p>
 <div class="finish" id="finish" hidden><p id="finish-text"></p><button id="continue" type="button" class="primary"></button></div>
 <details><summary id="more-title">看完以后再读：这个方法为什么能完成</summary><div><p id="more-text"></p><p id="identity-note"></p><label id="data-label" for="data">想再试一组？填 1 到 8 个数字，每个在 1 到 9 之间，用逗号隔开。</label><div class="change-data"><input id="data" type="text" inputmode="numeric" value="4,1,3,2" aria-describedby="data-error"><button id="apply-data" type="button">使用这组数</button></div><p id="data-error" role="alert" class="error"></p></div></details>
 <noscript><p>这个文件需要浏览器允许 JavaScript 才能播放。Please enable JavaScript in your browser to run this offline lesson.</p></noscript>
 <footer id="footer">本文件可以离线使用。六种方法对应学习手册中的冒泡、选择、插入、归并、Lomuto 快速排序和稳定计数排序。</footer>

<script>
"use strict";
/* MODEL START */
const pair=(zh,en)=>({zh,en});
const clone=x=>JSON.parse(JSON.stringify(x));
const methods={
 bubble:{name:pair('冒泡：每次比较相邻两根','Bubble: compare neighboring bars'),intro:pair('先让最大的数走到最右边。每次只比较相邻两根，左边较大就交换。再处理剩下的一段。','Send the largest value to the right. Compare two neighboring bars at a time; exchange them if the left value is larger. Then work on the remaining part.'),more:pair('一轮从左向右比较时，遇到的较大数会一路往右。到这轮末尾，未完成部分的最大数一定已到最右边。下一轮不用再碰它。若一整轮没有交换，所有相邻关系都正确，可以提前结束。','During a left-to-right round, the larger value keeps moving right. By the end, the largest unfinished value has reached the right edge. Later rounds leave it alone. A round with no exchanges means all remaining neighboring pairs are ordered.')},
 selection:{name:pair('选择：先找出最小的一根','Selection: find the smallest bar'),intro:pair('先记住一个“目前最小”的候选。看完剩余每根后，才把真正最小的放到前面。','Remember a candidate for the smallest value. Inspect every remaining bar before moving the true minimum to the front.'),more:pair('候选只是一条记号，不是搬动。扫描时每见到更小的值，就把记号交给它。看完所有未完成记录后，候选一定是其中最小的，所以可以把它放到最前面的空缺位置。下一轮从后面继续。','A candidate is only a marker. Whenever scanning finds a smaller value, move the marker to it. After all unfinished records have been inspected, the candidate is their minimum. Place it at the front of that region and continue behind it.')},
 insertion:{name:pair('插入：给手里的数找位置','Insertion: find a place for the held value'),intro:pair('左边先有一小段内部有序。取出它右边的一根暂存在手里，把比它大的数向右挪，再把它放进空位。','Keep a small ordered beginning. Hold the next record, move larger records one slot right, and place the held record in the gap.'),more:pair('左边内部有序，所以只要从右往左查看。较大的记录必须让位，较小或相等的记录不用动。一旦遇到不大的记录，空位就在它右边；把手里那根放下，整段仍有序。绿色表示这段内部有序，后来仍可能被移动，不是最终位置已确定。','Because the beginning is ordered, inspect it from right to left. Larger records must move aside; smaller or equal records stay. At the first such record, the gap is immediately to its right. Inserting there keeps the enlarged beginning ordered. Green marks a locally ordered region, not permanent positions.')},
 merge:{name:pair('归并：把两小排合成一排','Merge: combine two short ordered rows'),intro:pair('把大段分小，先排好小段。合并时，只比较左右小段各自最前面的那根，把较小的搬到下方暂放区。','Break a large region into smaller ones. Order the small regions first. To combine them, compare their first remaining records and move the smaller one to the tray below.'),more:pair('一条小排已经有序时，它最前面的剩余记录就是这排剩余的最小值。因此左右两排的下一根只需要从两个开头选。选出的记录移到暂放区，原位置标为空位；等选完再一根根搬回。这是为了展示记录身份，没有把同一根画成两份。','The first remaining record of an ordered row is its smallest remaining value. Therefore the next merged record is the smaller of the two heads. Move it into the tray and mark its old slot empty; after merging, move the records back one at a time. This display follows each record once rather than showing two copies.')},
 quick:{name:pair('快速：用一个数划分两边','Quick: divide around one chosen value'),intro:pair('把这段最后一根当作“标尺”。逐根看，把不大于标尺的放到左区；最后让标尺落在左右两区之间，再处理两边。','Use the last record as a guide. Inspect each other record and collect values no greater than it on the left. Place the guide between the two groups, then handle both sides.'),more:pair('这里使用 Lomuto 规则：一个边界记住左区的下一格，查看指针逐格前进。看到不大于标尺的值，就与边界位置交换，左区扩大一格。较大的留在右区。最后把标尺与边界交换，左边都不大于它，右边都大于它；它的位置就确定了。两边仍各自需要处理。','This is the Lomuto rule. A boundary marks the next left-group slot, while an inspection pointer moves across the region. A value no greater than the guide exchanges with the boundary slot, expanding the left group. Greater values stay in the right group. Finally exchanging the guide into the boundary fixes its position. Both groups still need their own work.')},
 counting:{name:pair('计数：先数每个值有几条','Counting: count records for each value'),intro:pair('先看每条记录的数值，写下每种值出现几次。把次数累加成位置表，再把原记录逐条搬到结果区。','Read every record and count how often each value appears. Add the counts into a position table, then move the original records into their result slots.'),more:pair('累加表中的数表示“这一数值最后一条应该在第几格”。从输入右端往左拿记录，把它放进对应的最后空格，然后让表中位置减一。右边的等值记录先占较右位置，左边的等值记录后来占较左位置，因此保留原顺序。表中的数字只是次数或位置，不是新增记录。','Each accumulated entry tells us the final slot for the last record of that value. Read original records from right to left, put each into its indicated last free slot, then reduce that entry by one. The rightmost equal record takes the rightmost equal-value slot first, preserving original order. Table numbers are counts or positions, not new records.')}
};
function makeTrace(algo,values,lesson=3){
 const records=values.map((value,i)=>({id:'r'+i,value,label:String.fromCharCode(65+i)}));
 const val=id=>records[Number(id.slice(1))].value;
 const ids=records.map(r=>r.id),n=ids.length;
 const S={slots:ids.slice(),tray:Array(n).fill(null),hand:null,active:[],moved:[],fixed:[],local:[],tags:{},range:null,extra:false,lane:pair('正在整理的一排','The row being arranged'),trayLabel:pair('暂放区','Temporary tray'),tally:null,tallyActive:null};
 const frames=[];
 function step(zh,en,whyZh,whyEn,options={}){S.active=[];S.moved=[];S.tags={};S.tallyActive=null;Object.assign(S,options);frames.push(clone({...S,title:pair(zh,en),why:pair(whyZh,whyEn)}));}
 function swap(i,j){[S.slots[i],S.slots[j]]=[S.slots[j],S.slots[i]];}
 const valuesText=()=>S.slots.map(id=>id===null?'□':val(id)).join(', ');
 const tag=(id,zh,en)=>({[id]:pair(zh,en)});
 if(lesson===1){
  step('先看这一排，先不要动它。','Look at the row without moving anything.','每根长条对应一条记录，里面的大数字是它的值。A、B、C……是身份，搬动后身份不变。','Each bar is one record. Its large number is its value. A, B, C… name its identity, which stays with it when it moves.');
  const min=ids.reduce((a,b)=>val(a)<=val(b)?a:b);let max=ids.reduce((a,b)=>val(a)>=val(b)?a:b);if(val(max)===val(min))max=ids.at(-1);
  step('这根的数字是 '+val(min)+'。','This bar’s value is '+val(min)+'.','条的高度表达数值大小；看数字就能知道它代表几，不必猜颜色。','Height shows numeric size. Read the number to know its value; color is not the value.',{active:[min],tags:tag(min,'看它的数','Read its value')});
  step(val(max)>val(min)?'这根写着 '+val(max)+'，它较高。':n>1?'这一根的值也是 '+val(max)+'，所以一样高。':'只有这一根，数值是 '+val(max)+'。',val(max)>val(min)?'This bar says '+val(max)+' and is taller.':n>1?'This record also has value '+val(max)+', so it has the same height.':'This single record has value '+val(max)+'.','数值大，条就高。数值相同的两根一样高，但身份字母仍不同。','Larger values have taller bars. Equal values have equal heights, but their identity letters still differ.',{active:[max],tags:tag(max,'看它的数','Read its value')});
  step('目标：从左到右，数字不变小。','Goal: values never decrease from left to right.','例如 1、2、3、4 已有序。相同值可以挨着。下一小课只学怎么比较和交换两根。','For example, 1,2,3,4 is ordered. Equal values may sit together. The next short lesson shows how to compare and exchange two records.');
 }else if(lesson===2){
  step('我们只练一个小动作。','Practice one small action.','先看最左边两根；其他记录暂时不动。修好这一对，不表示整排已经完成。','Look at the first two records and leave the rest alone. Ordering this pair does not necessarily finish the whole row.');
  if(n>=2){const a=S.slots[0],b=S.slots[1];
   step('比较 '+val(a)+' 和 '+val(b)+'。','Compare '+val(a)+' with '+val(b)+'.',val(a)>val(b)?'左边比右边大。为了从小到大，这一对要换位置；下一步才真的换。':'左边不大于右边。这一对已经符合从小到大，可以留在原处。',val(a)>val(b)?'The left value is larger. To order this pair, exchange them. The next step makes the move.':'The left value is no greater than the right. This pair can stay.',{active:[a,b]});
   if(val(a)>val(b)){swap(0,1);step('现在把两根交换。','Now exchange the two records.','整张记录一起搬：数字和身份字母都跟着走。两根都还在，没有复制，也没有丢失。','Move each complete record, including its number and identity. Both remain present; neither is copied or lost.',{moved:[a,b]});}
   else step('不交换，保留这一对。','Keep this pair in place.','比较得到的信息告诉我们不用搬动。一次比较和一次交换是两种不同动作。','The comparison told us no movement is needed. Comparing and exchanging are different actions.',{active:[a,b]});
  }
  step('小动作学会了，接下来按规则反复做。','Now repeat small actions according to a method.','排序方法告诉我们下一次看哪两根、什么时候搬、哪一部分已经完成。下一小课从冒泡开始。','A sorting method chooses what to inspect next, when to move records, and which part is finished. Start with Bubble in the next lesson.');
 }else{
  step('这是输入。先读数字，再点下一步。','This is the input. Read the values, then press Next.',methods[algo].intro.zh,methods[algo].intro.en);
  if(algo==='bubble'){
   for(let end=n-1;end>0;end--){let changed=false;S.range=[0,end];
    step('这一轮，从左边开始看相邻两根。','Begin this round with neighboring bars on the left.','这轮只看第 1 到第 '+(end+1)+' 格，右边已确定的位置不再动。','Work only in slots 1 through '+(end+1)+'. Leave any finished slots to their right alone.');
    for(let j=0;j<end;j++){const a=S.slots[j],b=S.slots[j+1],large=val(a)>val(b);
     step('比较 '+val(a)+' 和 '+val(b)+'。','Compare '+val(a)+' with '+val(b)+'.',large?'左边更大，挡住了小数；下一步交换，让较大数向右。':'左边不大于右边，这一对不需要交换，下一步继续往右看。',large?'The left value is larger. Exchange next so the larger value moves right.':'The left value is no greater. Keep this pair and continue right.',{active:[a,b]});
     if(large){swap(j,j+1);changed=true;step('交换，得到 ['+valuesText()+']。','Exchange: ['+valuesText()+'].','只有这两根换位置。较大数向右走了一格，其他记录保持原位。','Only these two records exchange. The larger moves one slot right; other records stay.',{moved:[a,b]});}
    }
    if(!changed){S.fixed=ids.slice();step('整轮都没有交换，可以结束。','No exchange occurred in the round. Finish.','剩余相邻对全部正确，右边又早已确定，所以整排有序。','All remaining neighboring pairs are ordered, and the right side is already finished.');break;}
    S.fixed.push(S.slots[end]);step('这一轮的最大数 '+val(S.slots[end])+' 已到最右边。','The round’s largest value '+val(S.slots[end])+' has reached the right edge.','它的位置确定了。下一轮的未完成范围少一格。','Its position is fixed. The next round uses one fewer unfinished slot.',{tags:tag(S.slots[end],'位置确定','Fixed position')});
   }
  }else if(algo==='selection'){
   for(let start=0;start<n-1;start++){let min=start;S.range=[start,n-1];
