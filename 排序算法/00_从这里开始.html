ple":["Use [1,8,2,0,3,4,5,6]. Scanning nondecreasing runs gives R1=[1,8], R2=[2], R3=[0,3,4,5,6], with lengths 2,1,5 and starts 0,2,3. Since n=8, their relative midpoints are 1/8, 2.5/8, 5.5/8.","R1 and R2 share the left half, but their quarter-cell numbers are 0 and 1. Their boundary power is 2. R2 is in the left half and R3 in the right half, so their boundary power is 1. The test uses positions, not a comparison between values 8 and 2.","Initially C=R1. On finding R2, push (R1,2) and set C=R2. On finding R3, its new power 1 is smaller than the saved 2. Pop and merge [1,8] with [2], selecting 1,2,8. Push ([1,2,8],1) and make R3 the current run.","Input has ended. Pop the last left run and merge it with [0,3,4,5,6]. Select 0, then 1,2, then 3,4,5,6, and finally 8. Output is [0,1,2,3,4,5,6,8]. The merge lengths total 3+8=11. Merging the last two original runs first would total 6+8=14."],"cost":"Finding runs reads n records. The major remaining cost is the sum of all merge lengths, since each merge visits its participants. Powersort keeps that cost close to the best adjacent-run schedule. Typical and worst time are O(n log n); one run gives best Θ(n). More precisely, the bound is O(n(1+H)), with H=Σ(Lᵢ/n)log₂(n/Lᵢ), where Lᵢ is run i's length and r is the run count. H measures a length-based merge-level scale: it is zero for one run, log₂r for r equal-length runs, and never exceeds log₂r. Conventional extra space is O(n) for merging and O(log n) for scheduling. Stable. Near optimality permits an additive O(n) difference rather than claiming the perfect schedule for every input.","why":"Small neighboring regions combine before large ones. Run length affects position on the ruler, so the schedule avoids repeatedly dragging a long run into merges merely because it happened to be encountered first.","use":"An advanced continuation after ordinary merging, especially for uneven run lengths. It can be combined with TimSort's extension and galloping operations. Beginners can return here after understanding natural mergesort.","details":"The example deliberately recognizes nondecreasing runs only. An implementation that also reverses strict descents could recognize [2,0] as a run, changing the boundaries and powers. Equal records must not be reversed. Multiway Powersort uses a multi-cell hierarchy and multiway merging rather than this binary schedule."},"sources":[{"title":"Munro and Wild: Nearly-optimal mergesorts","url":"https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.ESA.2018.63"},{"title":"Authors' Powersort implementations","url":"https://github.com/sebawild/powersort"},{"title":"Gelling, Nebel, Smith, Wild: Multiway Powersort","url":"https://arxiv.org/abs/2209.06909"}],"group":"B","seq":15,"refnos":[27,28,29]},{"id":18,"zh_title":"Peeksort","en_title":"Peeksort","kind":"variant","zh_alias":"探看中点附近自然段的归并排序","en_alias":"Midpoint-peeking natural mergesort","zh":{"foundation":["递归就是把同一个任务交给更小的一块，等小块处理完再组合结果。必须说明何时不用再拆，否则会无休止调用自己。","有序前缀是当前区域最左端已知有序的一段，有序后缀是最右端已知有序的一段。这里只记录它们的边界，避免下次重复扫描已经确认的记录。","一次稳定合并使用两个当前位置，反复输出较小值，相等时先取左边；只需合并相邻区域，不能跨过中间未参与的记录。"],"idea":"普通自顶向下归并总在中间切一刀，可能把本来很长的有序段切碎。Peeksort 先向中间看一眼，沿两边找出中间所在的完整有序段，再把刀移到它较近的一侧边界。已经排好的一段就保留下来。它从整个问题往小问题拆；Powersort 则从左往右收集段并用栈决定合并，两者是不同的安排办法。","steps":["处理一个区域 [l,r]，编号包括两端。若空、只有一个数，或已经知道一条有序段覆盖整个区域，直接返回。调用时同时携带左边已知有序前缀的末尾 e、右边已知有序后缀的开头 s；初始可只认最左和最右的单元素段。","取中间编号 m=floor((l+r)/2)。若 m 已落在已知前缀里，不必重新找它的段：保留 [l,e]，只递归处理 [e+1,r]，再合并。若 m 落在已知后缀里，则只处理 [l,s−1]，再与 [s,r] 合并。边界保证这次切分没有拆开已知的整段。","否则 m 在中间尚未知的部分。向左检查邻居，只要左值≤右值就扩展；到已知前缀边上时，只比较它的末项与新段首项：若能接上，就把新段起点直接改成 l，无需再走过整个前缀。向右同理，到已知后缀边上只检查接缝，能接上就直接把终点改成 r。遇到下降则停止。这样找到包含 m 的完整不下降段 [i,j]，也跳过了已经确认的内部记录。","比较 m−i 与 j−m。若左边距离较短，即 m−i<j−m，就在 i 前切，得到 [l,i−1] 和 [i,r]；否则在 j 后切，得到 [l,j] 和 [j+1,r]。若这一段接触区域外端，只用另一侧的内部边界；若覆盖整个区域，直接返回。不得切出同样大的问题再次调用。","递归处理左右两块。把新发现的整段边界交给拥有它的那一块：切在 i 前时，它成为右块的已知前缀；切在 j 后时，它成为左块的已知后缀。其余已知边界随各自子区域传下去。于是后续调用可以跳过重复扫描。","两块分别排好后，用稳定合并将它们写回原区域。到最外层合并结束时，整个数组有序。实现可设一个共用缓冲区，递归只改变处理边界，不必每层复制完整输入。"],"example":["输入 [1,8,2,0,3,4,5,6]，区域编号 0 到 7，只识别不下降段。中间 m=3，值为 0。向左遇到 2>0，立即停；向右 0≤3≤4≤5≤6 一直延伸，找到 [i,j]=[3,7]，内容 [0,3,4,5,6]。","中间到左端距离为 0，到右端为 4，所以在第 3 格前切。左块 [1,8,2] 尚需排序；右块完整地是一条已知段，不必再拆。把右块的已知前缀末尾设为 7，下次调用立刻返回。","左块区域 0 到 2，中间编号为 1，值为 8。它的完整不下降段是 [1,8]，编号 0 到 1，接触左端，因此在第 1 格后切。左块 [1,8] 已知有序，右块 [2] 是单元素。合并时取 1、2、8，得到 [1,2,8]。","返回最外层，将 [1,2,8] 与 [0,3,4,5,6] 合并：先 0，再 1、2，再 3、4、5、6，最后 8。得到 [0,1,2,3,4,5,6,8]。长度为五的右段只参加必要的大合并，没有被拆成五个单元素问题。"],"cost":"寻找段要检查邻居，合并要走过参与记录。携带已知前缀和后缀避免反复扫描，靠近中间的段边界控制合并层数。一个现成段最好 Θ(n)，典型无结构输入和最坏 O(n log n)。更细的界是 O(n(1+H))，n 为记录数，Lᵢ 为初始段长度，H=Σ(Lᵢ/n)log₂(n/Lᵢ)。一段时 H=0，r 段等长时 H=log₂r，H≤log₂r。相邻段合并成本接近最佳，允许额外 O(n)。普通数组合并缓冲区 O(n)，标准调度需 O(log n) 递归记录。稳定。","why":"它把切口移到已有顺序的边缘，避免先破坏长段再花钱恢复。已知边界还防止找段时一遍遍走过同一条长段。","use":"适合在普通自顶向下归并之后学习如何利用现成段。若还不熟悉递归，可先看自然归并的两两合并，再回到此条的切块规则。","details":"本条和例子固定只扫描最大不下降段。支持反转严格下降段的实现会将 [2,0] 识别为另一段，例子边界也随之变化，不能混用。中间位置用来找段，不一定成为实际切口。所有子区域必须比原区域小；完整段、空区域、单元素是停止条件。"},"en":{"foundation":["Recursion asks the same procedure to solve a smaller region, then combines the answers. It needs stopping cases so it does not keep calling itself forever.","A known ordered prefix touches the region's left end; a known ordered suffix touches its right end. Remembering their boundaries avoids checking the same confirmed run again.","A stable merge compares the unused fronts of neighboring ordered regions, chooses the smaller, and chooses the left record on equality."],"idea":"Ordinary top-down mergesort cuts at the middle even if that cut splits a long run that was already ordered. Peeksort first looks around the middle to discover the run containing it. It moves the cut to the nearer run boundary, preserves the run, sorts the remaining regions, and merges them. This is a way to plan from the whole problem downward. Powersort plans in the other direction, collecting runs from left to right.","steps":["Work on inclusive positions [l,r]. Return for an empty region, one item, or a known ordered run covering the whole region. Carry e, the end of a known left prefix, and s, the start of a known right suffix. Initially the outer single items can serve as these known runs.","Choose m=floor((l+r)/2). If m lies in the known prefix, keep [l,e] untouched, recursively sort [e+1,r], and merge. If m lies in the known suffix, sort [l,s−1] and merge it with [s,r]. Do not scan the already known run again.","Otherwise expand from m through nondecreasing neighbors. Going left is allowed while the left value is no greater than the right. On reaching the known prefix, compare only the joining pair: if the prefix's last value can precede the discovered run's first, extend the start directly to l without walking the prefix again. Do the symmetric join test at the known suffix and extend directly to r when it fits. Stop at a drop. This finds the complete midpoint run [i,j] while skipping confirmed interiors.","Compare m−i with j−m. If m−i<j−m, cut before i, giving [l,i−1] and [i,r]. Otherwise cut after j, giving [l,j] and [j+1,r]. If the run touches an outer end, use its internal boundary instead. A run covering the whole region is already a stopping case.","Recursively sort the two regions. Pass the discovered run to the region containing it: a cut before i makes it that region's known prefix; a cut after j makes it the other region's known suffix. Retain any other boundary information that belongs to each child region. This is how later calls avoid rescanning long runs.","Stably merge the two returned regions back into the original interval. A shared buffer is sufficient; recursive calls can change position boundaries rather than copy the entire input. The last outer merge completes the sort."],"example":["For [1,8,2,0,3,4,5,6], the outer region is 0 through 7 and m=3, holding 0. To the left, 2>0 stops expansion. To the right, 0≤3≤4≤5≤6 continues to the end. The midpoint run is [0,3,4,5,6] at positions [3,7]. Only nondecreasing runs are recognized here.","The distances from m to the run ends are 0 and 4, so cut before position 3. The left problem is [1,8,2]. The right problem is a known complete run; passing its prefix end as 7 lets that call return immediately.","In the left region 0 through 2, midpoint 1 holds 8. Its run is [1,8] at positions [0,1]. Since it touches the left boundary, cut after position 1. Keep [1,8], return immediately on singleton [2], then merge by selecting 1,2,8.","The outer merge combines [1,2,8] with [0,3,4,5,6]. Select 0, then 1,2, then 3,4,5,6, then 8. Final output is [0,1,2,3,4,5,6,8]. The five-item right run was never broken into five singleton sorting tasks."],"cost":"Run discovery checks neighboring records, and merging visits every participating record. Remembered prefix and suffix boundaries avoid repeated discovery scans. Cuts near the middle control the merge levels. Best time is Θ(n) for one run; unstructured typical and worst time are O(n log n). The finer bound is O(n(1+H)), where n is the record count, Lᵢ is run i's length, and H=Σ(Lᵢ/n)log₂(n/Lᵢ). H is zero for one run, log₂r for r equal-length runs, and at most log₂r. Merge cost is near the best adjacent-run plan, allowing additive O(n). Conventional buffer space is O(n), with O(log n) recursion information for standard scheduling. Stable.","why":"Moving the cut to a run's edge preserves useful order instead of breaking and rebuilding it. Remembering discovered boundaries prevents a long run from being walked repeatedly merely to confirm the same fact.","use":"An advanced step after top-down merging. If recursion is unfamiliar, learn natural mergesort's pairwise rounds first, then return to these region and boundary rules.","details":"This description and example recognize maximal nondecreasing runs only. A version that reverses strict descents could discover [2,0] as a run and would need different example boundaries. The midpoint starts the search; it need not be the cut. Every recursive child must be smaller, and complete runs, empty regions, and singletons stop recursion."},"sources":[{"title":"Munro and Wild: Nearly-optimal mergesorts, Peeksort algorithm","url":"https://drops.dagstuhl.de/opus/volltexte/2018/9526/pdf/LIPIcs-ESA-2018-63.pdf"},{"title":"Authors' implementation repository","url":"https://github.com/sebawild/powersort"}],"group":"B","seq":16,"refnos":[30,28]},{"id":11,"zh_title":"插入排序","en_title":"Insertion sort","kind":"algorithm","zh_alias":"直接插入排序；线性插入排序","en_alias":"Straight insertion sort; linear insertion sort","zh":{"foundation":["把数组想成一排有编号的小格子。本章格号从 0 开始：第 0 格是从左数第一格，第 1 格是从左数第二格，依次类推。格号是位置，不是里面的数值。移动一个数，是把它写入另一格；交换两个数，必须先暂存其中一个，否则第一次写入就会盖掉原值。","这里的已排部分只是内部顺序正确。后来出现的小数仍可能挤到它前面，因此它还不是最终位置。"],"idea":"你已经把手中的几张牌从小到大摆好了，又拿到一张新牌。最直接的办法是找出它该站的位置，把挡路的牌往右挪一格，再把新牌放进去。插入排序就重复这个动作：左边始终保持有序，右边每次交出一个数。它不需要先知道全体数据的范围，也不需要额外建一整排格子。","steps":["只有一个数时，它自己就是有序的，所以先把第一格当作已排部分。从第二格开始处理；把当前数 x 暂存在手里。它原来的格子现在可视为一个空位，虽然实际数组里可能还留着旧数。","看空位左边的数。如果它比 x 大，它站在 x 左边就错了，便把它复制到空位，空位向左走一格。继续做同样的比较。必须从右往左移动，才能先保住尚未搬走的数。","遇到一个不大于 x 的数，就不再往左走：它和左边那些数都可以留在 x 前面。如果已经走到数组开头，也停止。把手里的 x 写进当前空位。","现在左边又多了一个数，而且仍然有序。转向右边下一个数，重复取出、让位、放入。处理完最后一格，已排部分就覆盖了整个数组。为了保留相同值的原来顺序，只移动严格大于 x 的数，不能把等于 x 的也挤过去。"],"example":["输入 [4,2,3,1]。先认定 [4] 有序，取出 2。4 比 2 大，于是把 4 从第 0 格搬到第 1 格，形成 [空位,4,3,1]。空位已到开头，把 2 放进去，得到 [2,4,3,1]。","接着取出第 2 格的 3。4 比 3 大，右移为 [2,空位,4,1]。空位左边是 2，它不大于 3，停止移动，填入 3： [2,3,4,1]。这里不是交换一次就结束，而是在为新数腾出位置。","最后取出 1。依次把 4、3、2 往右搬，空位经过第 2、1、0 格。填入 1，得到 [1,2,3,4]。每次完成一次插入，已排部分恰好多一个数。","若输入中有 2A 和 2B，A 原来在前。插入 2B 时遇到 2A 就停止，因为两者相等；2B 放在 2A 后面，所以不会打乱相同值的先后。"],"cost":"主要花费来自向左比较和向右搬动。已经有序时，每个新数只看一次左邻居，几乎不搬，最好 Θ(n)。反序时，第 2 个数搬 1 个、第 3 个搬 2 个，直到搬 n−1 个，总量约为 n²/2，所以最坏 Θ(n²)；随机排列通常也要搬动平方数量级的数。更准确地说是 Θ(n+I)：n 是记录数，I 是逆序对数，即原来排在前面却比后面大的两条记录组成的对数，每搬一次恰好消除一对。额外空间 Θ(1)，只需暂存值和几个位置编号。上述严格大于才移动的版本稳定。","why":"它快不快，取决于每张新牌要挤过多少张旧牌。接近有序时，很多新数已经在合适位置，比较一下就能继续；反序时，每个新数都得走到最左边，前面的数一遍遍搬家。","use":"适合数量不多、基本有序，或者边收到记录边维持顺序的场景。很多大型排序会让它收拾短小片段，因为简单的循环在这种规模下很省事。","details":"空数组和单元素数组直接结束。可以把是否已排的边界记成一个编号，不必复制左半边。数组中插入意味着实际搬动；即使提前找到位置，这些搬动也不会凭空消失。链表可通过改连接来插入，但寻找位置仍要花时间。"},"en":{"foundation":["An array is a row of numbered slots. Indices here start at zero: index 0 is the first slot from the left, index 1 the second, and so on. An index is a position, not its stored value. Moving a value means writing it into another slot. Keep a temporary copy before overwriting the slot that holds the value you are inserting.","An ordered prefix is the left part of the row in the correct internal order. Its items may still move when a smaller item arrives later."],"idea":"Imagine holding some cards in order, then picking up one more card. You slide the larger cards to the right and place the new card in the opening. Insertion sort uses that same small operation throughout an array. It starts with one ordered item, adds the next item, and keeps growing the ordered part until nothing remains outside it.","steps":["Treat the first item as ordered: a single item cannot be out of order with itself. Starting at the second slot, save the next value x in a temporary variable. Think of its old position as a hole, even if the old bits are still there.","Compare x with the item immediately left of the hole. If that item is greater, copy it one slot right into the hole. The hole has moved left. Repeat. Working backward preserves every value before its slot is overwritten.","Stop when the left neighbor is no greater than x, or when the hole reaches the start. Everything farther left is also small enough, because that part was already ordered. Write x into the hole.","The ordered prefix now contains one additional item. Take the next item and do the same thing. After the last insertion, the prefix is the whole array. Move strictly greater items only; leaving equal items in place preserves their arrival order."],"example":["Start with [4,2,3,1]. The first prefix is [4]. Hold 2. Since 4 is greater, copy 4 right: [hole,4,3,1]. There is no item left of the hole, so write 2 there: [2,4,3,1].","Now hold 3. Move 4 right to make [2,hole,4,1]. The next comparison is with 2. It is smaller, so leave it alone and fill the hole with 3: [2,3,4,1].","Hold the final 1. Move 4, then 3, then 2 one slot right. Only after those moves do you write 1 in the first slot. The array becomes [1,2,3,4]. Each completed insertion adds exactly one record to the ordered prefix.","With labeled duplicates 2A and 2B, an arriving 2B does not push an existing 2A aside. Equality stops the search, so A stays before B."],"cost":"Count the comparisons and the items shifted. Ordered input needs about one comparison per arriving item and no shifts: best Θ(n). On reversed input, the shifts add up to 1+2+…+(n−1), making the worst Θ(n²). Random input usually has quadratic movement too. A more precise bound is Θ(n+I), where n is the number of records and I is the number of inversions: an earlier record greater than a later one. Each shift removes one such pair. Extra space is Θ(1) for a saved record and position counters. The strict-greater shifting rule is stable.","why":"A nearly ordered row gives each new item only a short journey. In a reversed row, every new item travels all the way to the beginning and moves every earlier item again. That repeated movement, rather than a complicated operation, explains the difference.","use":"Good for small arrays, nearly ordered data, and short pieces inside a larger sorting method. It can also maintain an ordered collection as new items arrive, provided the collection is not too large.","details":"Empty and one-item inputs finish immediately. Track the prefix with a boundary index; there is no need to copy it. A linked list avoids moving whole array sections, but it still needs to find the insertion position. Finding a position quickly and physically making room are separate costs."},"sources":[{"title":"Princeton: Elementary sorts","url":"https://algs4.cs.princeton.edu/21elementary/"},{"title":"Princeton Insertion implementation","url":"https://algs4.cs.princeton.edu/21elementary/Insertion.java.html"}],"visual":{"rows":[{"zh":"取出 2，和前面的 4 比较","en":"Hold 2 and compare with 4","values":[4,2,3,1],"active":[0,1],"fixed":[],"moved":[]},{"zh":"2 插入后，前两项内部有序","en":"Insert 2: first two internally ordered","values":[2,4,3,1],"active":[],"fixed":[],"moved":[0,1]},{"zh":"3 插入：4 右移一格","en":"Insert 3: shift 4 right","values":[2,3,4,1],"active":[1,2],"fixed":[],"moved":[1,2]},{"zh":"1 插入到开头，全体才最终有序","en":"Insert 1 at the start: fully sorted","values":[1,2,3,4],"active":[],"fixed":[0,1,2,3],"moved":[]}]},"group":"B","seq":17,"refnos":[31,32]},{"id":12,"zh_title":"二分插入排序","en_title":"Binary insertion sort","kind":"variant","zh_alias":"折半插入排序；用二分查找选插入位置","en_alias":"Insertion sort with binary position search","zh":{"foundation":["二分查找不是逐格寻找，而是利用已经有序这一点：看中间的数，一次排除肯定不可能的半边。只有待查部分有序时，这个推理才成立。","下文用从 0 开始的编号。区间 [lo,hi) 包含 lo，不包含 hi；当两个边界相等，区间里没有待检查的格子。"],"idea":"插入排序搬东西很容易理解，但找位置时可能一格一格向左看很久。既然左半边已经有序，就可以先问中间的数：新数应该在它左边还是右边？不断把寻找范围缩成一半，就是二分插入排序。它改进的是找位置的比较次数；为了插入，新数后面的记录仍要搬开。","steps":["按普通插入排序的办法，把左边保持有序，暂存下一个数 x。如果左边有 i 个数，就设 lo=0、hi=i，搜索的只是这 i 个数，不包含 x 的旧位置。","取 mid=floor((lo+hi)/2)，也就是两个边界的平均值向下取整。若 x 小于第 mid 格的值，插入点不能在它后面，将 hi 改成 mid。若 x 大于或等于它，则将 lo 改成 mid+1。把相等情况送到右边，才能把新来的相同值放在旧值后面。","只要 lo<hi，就继续检查新的中间位置。每轮至少去掉一个格子；最终 lo=hi，这个编号就是插入位置。它可能是 0，也可能是左半边末尾的后一格。","从左半边最右格开始，倒着把插入位置及其右边的数各搬一格。再把 x 写到插入位置，扩大已排边界，处理下一个数。可以先比较 x 和左半边最后的值：若 x 已经不小于它，直接留在末尾，省掉搜索。"],"example":["完整输入 [1,3,5,7,4]。前四个数依次加入时都可以直接接在末尾。处理最后的 4 时，左边是 [1,3,5,7]，设 lo=0、hi=4。","第一轮中间编号为 2，那里是 5。4 应在 5 前面，于是 hi=2，剩余范围 [0,2)。第二轮中间编号为 1，那里是 3；4 应在它后面，于是 lo=2。现在 lo 和 hi 都是 2，搜索结束。","找到第 2 格不等于已经插进去了。先把 7 搬到第 4 格，再把 5 搬到第 3 格，形成 [1,3,空位,5,7]，最后把 4 写入空位，得到 [1,3,4,5,7]。","若待插入的是另一个 3，遇到已有的 3 时继续搜右半边，最后插在所有旧 3 之后。不同记录不会因为值相同而丢失。"],"cost":"每次搜索把范围减半，长度 i 的左半边只需约 log₂ i 次比较；n 次插入通常共 Θ(n log n) 次比较。但每次可能还要搬 i 个记录，典型和最坏总搬动量 Θ(n²)，因此整个数组算法的典型与最坏时间仍为 Θ(n²)。若不先检查末尾，即使原来有序也做 Θ(n log n) 次比较；加上末尾检查，最好可为 Θ(n)。n 为记录数。额外空间 Θ(1)。按相等向右的规则稳定。","why":"比较昂贵时，少问很多次很有价值，例如比较长字符串。但数组里的空位必须靠搬动腾出来。二分不能让夹在中间的 4 穿过 5 和 7，所以它没有消除平方级移动。","use":"适合短片段、比较比搬动更贵的记录，以及需要稳定插入的混合排序。TimSort 常用它扩展较短的有序段。","details":"始终用同一种边界约定，尤其不要把 hi 当成包含在内的格子。向后搬动可以避免覆盖尚未保存的记录。若使用普通有序数组，不应仅凭比较次数把总时间写成 O(n log n)。"},"en":{"foundation":["Binary search uses an ordered row to rule out half the possibilities at a time. Looking at the middle tells you which side could contain the insertion point.","Positions begin at zero here. The interval [lo,hi) includes lo and excludes hi. When lo equals hi, there are no unchecked slots left."],"idea":"Ordinary insertion sort may inspect many old items just to discover where the next one belongs. Binary insertion sort asks a better sequence of questions. It checks the middle of the ordered part, keeps the relevant half, and repeats. The new record still needs an opening in the array, so this method saves comparisons rather than eliminating movement.","steps":["Keep the left prefix ordered, as in insertion sort, and save the next record x. If the prefix has i items, start with lo=0 and hi=i. Only this ordered prefix is searched.","Compute mid as the average of lo and hi rounded down. If x is smaller than the value at mid, set hi=mid: x must be inserted at that position or earlier. Otherwise set lo=mid+1. Taking the right branch on equality puts a new equal record after older equal records.","Repeat while lo<hi. Every comparison shrinks the interval, so it must eventually become empty. Its remaining boundary lo is the insertion position, which can be the start or the position just after the prefix.","Move the prefix items at and after that position one slot right, starting at the right end. Write x into the opening. Then extend the prefix and process the next record. An optional check against the prefix's last record can skip the search when x already belongs at the end."],"example":["Use the full input [1,3,5,7,4]. The first four values can each join the ordered prefix at its end. When 4 arrives, search [1,3,5,7] with [lo,hi)=[0,4).","The middle position is 2, holding 5. Since 4<5, change the interval to [0,2). Its middle is now position 1, holding 3. Since 4≥3, move lo to 2. The interval [2,2) is empty, so the opening belongs at position 2.","The search did not create that opening. Copy 7 to position 4, then 5 to position 3. Now [1,3,hole,5,7] has room for the saved 4, giving [1,3,4,5,7].","If another 3 arrived instead, the equality branch would continue to the right of the existing 3. That choice preserves duplicate records and their original order."],"cost":"A search through i ordered items takes about log₂ i comparisons because the remaining range halves each time. Across n insertions, typical and worst comparison counts are Θ(n log n). However, an insertion can still shift i items. Typical and worst movement is Θ(n²), so total array time is still Θ(n²). Without an end check, ordered input also needs Θ(n log n) comparisons. With the end check, best time becomes Θ(n). Here n is the record count. Extra space is Θ(1), and inserting after equal records makes this version stable.","why":"It helps when comparing two records is expensive, such as comparing long text. It helps much less when moving records dominates the work. Quickly locating the place between 3 and 5 does not remove the need to move 5 and 7.","use":"Useful for short ordered prefixes, expensive comparisons, and stable insertion inside hybrid methods. TimSort uses this operation to extend short runs.","details":"Keep the same half-open interval convention throughout. Move items backward when opening a slot to avoid overwriting them. Do not report O(n log n) total time merely because the search uses that many comparisons."},"sources":[{"title":"NIST DADS: Binary insertion sort","url":"https://xlinux.nist.gov/dads/HTML/binaryinsort.html"},{"title":"CPython: List sorting design notes","url":"https://github.com/python/cpython/blob/main/Objects/listsort.txt"}],"group":"B","seq":18,"refnos":[33,24]},{"id":13,"zh_title":"图书馆排序","en_title":"Library sort","kind":"variant","zh_alias":"留空插入排序；gapped insertion sort","en_alias":"Gapped insertion sort","zh":{"foundation":["空位不代表某个特别大的数或小的数，而是格子附带的空/非空标记。读取时只看非空格，按它们从左到右的顺序判断是否有序。","随机打乱到达顺序是把记录以随机次序逐个插入；它不改变最终应按什么值排序。概率保证是在这种随机到达和固定预留比例等条件下成立。","支撑位置是一次重新铺开时已有记录所占的格子编号。在下一轮里，这些编号一直有记录，虽然该处的记录可能因搬动而改变。"],"idea":"一排书挤得满满的，插一本书常常要搬半个书架。若在书与书之间留些空格，新书通常只需把附近几本推到一个空格。图书馆排序把这种办法用于数组：非空记录始终从小到大，定期把它们重新分散，让空位回到各处。不过，留下空位本身并不保证快；原论文还让记录随机到达，并按安排好的轮次重铺。","steps":["先知道最终记录数 n，选择一个固定备用比例 ε>0，预留约 (1+ε)n 个格子。随机排列到达次序。按轮次工作：已有 m 个记录时，本轮最多再插 m 个，人数大致翻倍；最后一轮可提前在 n 个处结束。","每轮开始，把已有 m 个记录按顺序均匀铺在能容纳本轮目标数量的活动区域里。记下这些已有记录的格子编号，称为支撑位置。二分查找这些位置上的当前值，找到新记录 x 夹在哪两个支撑值之间；再在两位置之间从左到右检查非空记录，找出准确的前驱和后继。两端没有支撑值时，使用活动区域的边界。","若前驱和后继之间有空格，把 x 放进去即可。否则搜索附近的空格。空格在右边时，从它左边开始向右搬连续记录，直到在后继原位置腾出格子，再写 x；空格在左边时，向左搬挡路的连续记录，最后把 x 写在前驱后面。每次都保留所有非空记录的顺序。","这些搬动不会使原来占用的支撑位置变空，因此本轮还能继续二分查它们的当前值。达到本轮的目标数量后，扩大活动范围并均匀重铺，重新记录支撑位置。扩大的只是预先保留数组的使用范围，不是让定长数组无条件长大。","全部插入后，从左到右把非空记录抄到连续位置，得到普通有序数组。若要稳定输出，比较键必须同时包含原来的编号；否则最初的随机打乱会改变相同值的顺序。"],"example":["让记录按 [4,1,7,3,2] 到达。4 先进入空架。插 1 时找到 4 左边的位置，让出一格后得到有序记录 [1,4]；7 放在它们右边，记录顺序变成 [1,4,7]。书架上的空格不是记录。","为了看清插入动作，画出这三个记录的一次均匀铺开状态 [1,空,4,空,7,空]，支撑编号为 0、2、4。此图展示机制，不声称正式轮次恰在插完三个时重铺。3 位于支撑值 1 和 4 之间，第 1 格为空，直接放入： [1,3,4,空,7,空]。","接着插 2。支撑编号上的当前值仍是 1、4、7，所以二分把范围缩在 1 和 4 之间；顺序检查发现它应该在 1 与 3 之间。这里没有空格，右侧第 3 格有空位。先把第 2 格的 4 搬到第 3 格，再把第 1 格的 3 搬到第 2 格，最后写入 2： [1,2,3,4,7,空]。","若下一次安排重铺，可以变成 [1,空,2,空,3,空,4,空,7,空]；最后去掉空位就是 [1,2,3,4,7]。为五个记录保留十格可示意 ε=1。实际轮次按数量近似翻倍结束，所需容量从开始就预留好。"],"cost":"查找支撑值要约 log n 次比较，重铺时每个记录只搬一次。关键问题是两次重铺之间要找多远的空位、搬多长的连续段。在随机到达、固定 ε 和论文轮次规则下，这些局部拥挤受到概率控制，期望总时间 O(n log n)，并且以高概率也是 O(n log n)；高概率指失败机会随规模增长而变小，不表示绝不失败。逆着这些条件安排到达次序，或遇到罕见的坏随机结果，仍可有 Θ(n²) 工作。普通每次二分的版本最好一般也用 O(n log n) 工作，额外空间 Θ(n)。n 为记录数。基本随机版不稳定；加入原编号作为相等值的第二比较键可稳定。","why":"它把整排大搬迁改成了走到附近空位的小搬迁。随机到达有助于避免总向同一小段挤书；定期重铺把已经被吃掉的空隙重新分散。二分搜索仍保留对数成本。","use":"适合研究带空隙的有序数组和概率型数据结构。当随机化、备用空间、重铺和空位管理的复杂度值得承担时可以考虑；普通小数组往往用插入排序更简单。","details":"不能把空位作为普通值参与二分，也不能只写有空就插而省略定位方法。支撑位置二分之后仍需检查局部区间。备用比例必须固定且大于零；所有数组范围和最后不足一轮的情况都要受预留容量约束。变体的额外索引、轮次或空间策略需要自己的分析，不能自动继承论文结论。"},"en":{"foundation":["A gap is an empty-slot flag, not a special numerical value. Read occupied slots from left to right to obtain the current ordered sequence.","Random arrival means shuffling the records before insertion. The final ordering rule stays the same; randomness spreads the pressure from insertions.","At a redistribution, record the positions of the existing items. These support positions stay occupied for the next round, even though shifting may change which records occupy them."],"idea":"Picture a crowded bookshelf. Adding a book near the beginning requires moving many books. If there are gaps along the shelf, you can often move a short section into a nearby gap instead. Library sort maintains an ordered sequence in a partly empty array and occasionally spreads the records out again. Its speed guarantee comes from a particular randomized procedure, not from gaps alone.","steps":["Determine the final count n and reserve about (1+ε)n slots, for a fixed positive spare fraction ε. Shuffle the arrival order. Work in rounds: a round starting with m records inserts up to m more, roughly doubling the population. Stop the final round early when all n records have arrived.","At the start of a round, spread the m existing records evenly over the active area sized for that round's target population. Save their slot numbers as support positions. Binary-search the current values at these occupied positions to bracket a new x. Within the bracket, inspect occupied slots in order to find the exact predecessor and successor. At the outer edges, use the active area's boundaries.","If a gap already lies between that predecessor and successor, put x there. Otherwise look for a nearby gap. For a gap on the right, shift the intervening consecutive records right, beginning next to the gap. For a gap on the left, shift them left, beginning next to that gap. Place x in the resulting opening between its ordered neighbors.","A shift followed by insertion never leaves an originally occupied support position empty. Their current values therefore remain safe to search during the round. At the scheduled population limit, redistribute over a larger active area and record fresh support positions. This activates more of the array reserved initially; a fixed array does not grow by itself.","After the last insertion, collect occupied slots from left to right into a packed output. To preserve original order among equal keys despite shuffling, compare the original position after comparing the key."],"example":["Let the arrival order be [4,1,7,3,2]. Four starts the shelf. Make room to its left for 1, giving occupied records [1,4]. Seven follows them, so the record sequence is [1,4,7]. Empty slots do not enter this sequence.","To isolate the local insertion mechanism, show those three records spread as [1,gap,4,gap,7,gap], with support positions 0,2,4. This is an illustrative spread, not a claim that a formal round ends after three insertions. Three belongs between 1 and 4 and can use the gap directly: [1,3,4,gap,7,gap].","For 2, searching the support values 1,4,7 identifies the interval between 1 and 4. Inspecting that interval locates the exact position between 1 and 3. There is no gap there, but position 3 is empty. Copy 4 from position 2 to 3, then 3 from 1 to 2. Write 2 at position 1: [1,2,3,4,7,gap].","A later scheduled spread could look like [1,gap,2,gap,3,gap,4,gap,7,gap]. Collecting the records produces [1,2,3,4,7]. Ten reserved slots for five records illustrate ε=1. The actual rounds follow their doubling schedule and stay within the reserved capacity."],"cost":"Searching support values costs about log n comparisons per insertion. Redistribution moves each existing record once. The uncertain part is how far an insertion must search for a gap and how many records it shifts. With randomized arrivals, fixed spare fraction, and the paper's rounds, congestion is controlled: expected total time is O(n log n), and the same bound holds with high probability. This means a shrinking probability of failure as size grows, not certainty. Adverse arrivals or rare unlucky outcomes can still require Θ(n²) work. A standard version that always binary-searches generally has O(n log n) best work too. Extra space is Θ(n). The shuffled basic method is unstable; key-plus-original-position comparisons restore stability.","why":"Nearby empty space turns a large move into a small one. Random arrivals help avoid repeatedly crowding the same region. Redistribution replenishes gaps where earlier insertions consumed them. Position searches still carry a logarithmic cost.","use":"Useful for studying ordered arrays with spare space and randomized performance guarantees. In practice, the extra storage and gap management must justify their complexity; ordinary insertion sort is simpler for small inputs.","details":"Do not binary-search gaps as though they were keys. Search occupied support positions, then inspect the bounded local region. Keep a fixed positive spare fraction, respect active boundaries, and handle a partial final round. Different indexing or redistribution schemes need their own analysis rather than borrowing the original theorem."},"sources":[{"title":"Bender, Farach-Colton, Mosteiro: Insertion sort is O(n log n)","url":"https://arxiv.org/abs/cs/0407003"}],"group":"B","seq":19,"refnos":[34]},{"id":19,"zh_title":"耐心排序","en_title":"Patience sort","kind":"algorithm","zh_alias":"纸牌堆排序；与最长上升子序列算法有关","en_alias":"Patience sorting; card-pile sorting","zh":{"foundation":["一摞牌只能从顶上取。我们会保证每摞从顶到底不下降，所以摞顶就是这摞尚未输出的最小值。","优先队列是一组候选记录，支持放入和取出最小项，不要求里面从左到右全部有序。二叉最小堆是一种实现：每个父位置的值不大于两个子位置，因而堆顶一定最小。","二分找摞不是在摞内找，而是在已经从左到右排好的摞顶列表里找第一个不小于新值的摞顶。"],"idea":"像发牌一样把数放到几摞中。新数只要不大于某摞顶部，就能盖在上面；优先选最左边能放的摞，否则在右边开一摞。这样每摞自上而下有序，摞顶从左到右也有序。但这还没有排完：接下来必须在所有摞顶中不断选最小值，取走后露出同摞的下一张，直到所有牌都输出。","steps":["开始没有摞。读入 x，在摞顶列表中二分寻找第一个顶值≥x 的位置：看中间，若顶值≥x 就保留含它的左半边，否则只保留右半边，直到确定第一个位置。找到便把 x 压在该摞顶上；找不到就在最右边新建一摞。记录整摞的所有牌，不只留顶部。","为什么摞顶仍有序？被选摞左边的顶值都小于 x，否则会更早被选；被选摞右边的顶值不小于该摞原顶，更不小于 x。因此换上 x 后，左右关系仍正确。该摞原顶≥x，所以摞内从顶到底也仍不下降。","发完牌，将每摞顶部作为一个候选项放入最小优先队列，每项还记着属于哪一摞。下面可用二叉堆数组：第 i 格的父编号为 floor((i−1)/2)，两个孩子为 2i+1、2i+2，编号均从 0 开始。不存在的孩子不参与比较。","往堆里放候选项时，先加到末尾；若它小于父项，就交换并继续向上，直到父项更小或已到第 0 格。取最小时，拿走第 0 格，将最后一项搬到第 0 格；反复与较小孩子比较，若孩子更小就交换向下，直到关系恢复。这样无需每次重新排列整队候选。","每次从队列取出最小摞顶，把那张牌加入最终输出，并从它原来的摞取走。若该摞还有牌，将新露出的摞顶入队；否则不再给这摞放候选。队列为空时全部结束。"],"example":["输入 [4,2,3,1]。4 建第一摞。2 找到摞顶 4，把自己盖在它上面，摞一从顶到底 [2,4]。3 比目前唯一摞顶 2 大，没有可放摞，于是在右边建摞二 [3]。1 找到最左的摞顶 2，盖上。最终摞一 [1,2,4]，摞二 [3]，顶值列表 [1,3]。","候选队列开始只有 (1,摞一)、(3,摞二)。取 1，输出 [1]；摞一露出 2，入队。现在候选为 2、3，取 2，输出 [1,2]；同摞露出 4，入队。","现在队列最小是 3，不是刚露出的 4。取 3，输出 [1,2,3]，摞二已空。最后取 4，输出 [1,2,3,4]，队列也空。若先整摞倒完摞一，再倒摞二，会得到错误的 [1,2,4,3]。","相等值若按基本 ≥ 规则盖在同一摞，会以新牌先出的顺序倒置。需要稳定时改用第一个顶值>x 的摞，并在队列相等时优先原来编号较小的记录。"],"cost":"每个记录先做一次摞顶二分，之后一次出队，可能还引出下一项入队。最多 p 个摞顶时，二分和堆操作各需约 log(p+1) 层，总上界 O(n log(p+1))。n 为记录数，p 为摞数。严格反序只有一摞，最好 Θ(n)；随机互异值通常以及最坏为 Θ(n log n)。严格上升会形成 n 摞。所有摞、候选和输出通常需 Θ(n) 额外空间。基本 ≥ 版不稳定；上述严格大于加原编号的变体可稳定。","why":"每摞把一些记录藏在已经更小的顶牌下面，暂时不必参与全体比较。摞少，候选就少，每次选择更省。若几乎每条记录都自己成一摞，就没有这方面的省力。","use":"适合学习把多条有序序列合并、优先队列和输入顺序结构。摞的数量也与最长严格上升子序列有关，但求该长度和输出完整排序是两项不同任务。","details":"不能只保存摞顶，否则下面的记录会丢失。摞顶列表有序不等于全体数据已排。空输入直接输出空列；每项必须保留摞编号，才能知道取走它以后该露出哪张牌。"},"en":{"foundation":["A pile lets you remove its top item first. Here each pile is nondecreasing from top to bottom, so its top is its smallest remaining item.","A priority queue holds candidates and can remove the smallest without keeping every candidate in a fully sorted row. A binary min-heap makes each parent no greater than its children, placing the minimum at the root.","Binary search is applied to the ordered list of pile tops, not to the records inside a pile."],"idea":"Deal the values into piles. Put a new value on the leftmost pile whose top is at least as large; if none qualifies, start a new pile on the right. The piles each become ordered from top downward, and their top values stay ordered from left to right. This dealing stage is only preparation. To finish sorting, repeatedly take the smallest available pile top and reveal the next item below it.","steps":["Read x and binary-search the top-value list for its first value≥x. At a middle position, keep the left half including that position if its value qualifies; otherwise keep the right half. Put x on the selected pile, or create a new rightmost pile if the search finds none. Keep every item in the piles.","The top list stays ordered because every earlier top is smaller than x; otherwise that earlier pile would have been selected. Every later top was at least the selected old top and therefore at least x. Within the selected pile, x is no greater than the item it covers.","After dealing, place one candidate from each nonempty pile into a minimum priority queue. Store its pile identity too. A binary heap can use an array: zero-based position i has parent floor((i−1)/2) and children 2i+1,2i+2, if those positions exist.","To insert a candidate, append it and exchange it upward with a larger parent until the parent relation holds or it reaches the root. To remove the minimum, save the root, move the last entry to the root, then exchange it downward with the smaller child while that child is smaller. This repairs a path rather than sorting the whole queue.","Emit the removed candidate and take it off its pile. If that pile still has records, insert its newly exposed top into the queue. Otherwise it supplies no further candidate. An empty queue means every record has been emitted."],"example":["Deal [4,2,3,1]. Four starts pile one. Two covers it, making top-to-bottom [2,4]. Three is greater than the only top 2, so it starts pile two [3]. One covers pile one's top. The piles are [1,2,4] and [3]; their top list is [1,3].","The queue begins with (1,pile one) and (3,pile two). Remove 1, output [1], and insert the newly exposed 2. Remove 2 next, output [1,2], and insert the exposed 4.","Candidates are now 3 and 4. Choose 3, output [1,2,3], and leave its empty pile out of the queue. Choose the final 4. Output is [1,2,3,4], and the queue is empty. Emptying the first pile completely before the second would incorrectly produce [1,2,4,3].","Under the basic ≥ rule, a new equal value covers an old equal value and comes out first. For stable sorting, use the first top>x instead, and resolve equal queue candidates by their original positions."],"cost":"Each record is dealt using a binary search, then emitted with a queue removal; exposing it may also cause an insertion. With p piles, those searches and heap repairs travel about log(p+1) levels, giving O(n log(p+1)) total work. Here n is the record count. Strictly decreasing input gives one pile and best Θ(n). Random distinct input typically, and the worst case, give Θ(n log n). Strictly increasing input makes n piles. Full piles, candidates, and output need Θ(n) extra space. The basic ≥ version is unstable; the stated strict-greater and position-tie variant is stable.","why":"Records under a smaller pile top can wait without joining the current comparison. Fewer piles mean fewer candidates and shorter searches. If nearly every record starts its own pile, that advantage disappears.","use":"Good for learning multi-sequence merging, priority queues, and how input order affects work. Pile count is also connected to longest increasing subsequences, but computing a subsequence length is not the same as producing sorted output.","details":"Keeping only pile tops would discard records. Ordered tops do not mean the entire input is sorted. Each queue entry needs a pile identity so removal can expose the correct next item. Empty input immediately yields empty output."},"sources":[{"title":"Aldous and Diaconis: Longest increasing subsequences, from patience sorting","url":"https://escholarship.org/uc/item/09j2v8d0"},{"title":"Aldous and Diaconis: Patience sorting paper","url":"https://www.stat.berkeley.edu/users/aldous/Research/OP/patience.pdf"},{"title":"Stanford Aldous and Diaconis research report","url":"https://statistics.stanford.edu/technical-reports/longest-increasing-subsequences-patience-sorting-baik-deift-johansson-theorem"}],"group":"B","seq":20,"refnos":[35,36,37]},{"id":20,"zh_title":"平滑排序","en_title":"Smoothsort","kind":"variant","zh_alias":"Dijkstra 的自适应原地堆排序","en_alias":"Dijkstra's adaptive in-place heapsort","zh":{"foundation":["树可以想成有上下级的记录：一个父节点连向孩子。最大堆只要求父值不小于孩子；因此根最大，但同层或整排还未完全排好。","森林表示并排放着几棵树。这里每棵树实际上占数组里的一个连续块，根放在块的最后一格，不另造一套记录副本。","Leonardo 数定义这些块的大小：L(0)=L(1)=1，L(k)=L(k−1)+L(k−2)+1，依次为 1、1、3、5、9、15……。一个大块等于左子块、右子块，再加一格根，公式正是这样来的；两个大小为 1 的阶数仍分别记为 0 和 1。"],"idea":"普通堆排序把当前最大值送到右端，逐个确定最后的位置。Smoothsort 也这样做，但它不用固定的一棵堆，而是把未完成的左边分成几棵特殊大小的堆。每棵堆根最大，再让这些根从左到右不下降，于是最右根就是整个未完成区域的最大值，可以直接留在右端。已接近这种关系的数据不需要许多交换，这就是它能利用已有顺序的关键。下面给出每一步都完整修复的清楚版本；标准优化版会省掉部分注定被后续合并替代的修复。","steps":["从左到右把记录加入未完成前缀，记每块的阶数。第一条是阶 1 的单格堆。若最后两堆的阶数为 k、k−1，就把它们与新记录合成阶 k+1 的堆，新记录在新块末尾当根。否则追加单格堆：前一末堆是阶 1 时，新单格记阶 0；其余情况记阶 1。这些规则能表示任意前缀长度，不需要大小为 2 的堆。","先学堆内修复 sift。阶 k≥2 的块，由左阶 k−1、右阶 k−2、末格根组成。根编号为 t 时，右子根是 t−1，左子根是 t−1−L(k−2)。比较两个孩子，选较大者；若它比根大，就交换，并在那个子堆重复。若根已经不小于孩子，或走到单格堆，就停。每次向下走到更小的块。","还要修复堆与堆之间的根顺序，这个动作叫 trinkle。当前根编号 t、当前堆阶数 k 时，前一堆根就在 t−L(k)，不必扫描森林寻找。仅当这个前根大于当前根，而且也大于当前根的两个孩子（若有）时，交换两个根，将当前位置转到前一堆，继续向左检查。大根被移到右堆时仍不小于那里的孩子，因此右堆保持堆关系。","若前根没有同时满足以上比较，就不再向左交换，在当前堆执行 sift；没有前堆时也执行 sift。这修好刚被换小的根所在的内部关系。每加入一个记录，对新出现的最右堆做完整 trinkle，便保住所有堆内关系和从左到右的根顺序。","建完前缀后，最右根即全体最大，留在原格并把这一格划入完成后缀。若末堆只有一格，删除它的形状记录。若阶数 k≥2，拿走根后，原块自然分成阶 k−1 的左堆和阶 k−2 的右堆；它们的内部关系已有，只是新露出的根可能与前堆顺序不对。先对左子堆做 trinkle，再对右子堆做 trinkle。","重复取出最右根、删除或拆堆、修复。每次未完成区域少一格，完成后缀多一格。交换和比较只能在未完成前缀中进行，不再动右边已确定的位置。空前缀时结束。"],"example":["输入 [3,4,1,5,2]。先加 3、4，得到阶数 [1,0] 的两个单格堆，根 3≤4，无需交换。加入 1 时，末尾两阶可与它合成阶 2、大小 3 的堆 [3,4,1]。根 1 比孩子 4 小，交换，数组变成 [3,1,4,5,2]，前三格的根为 4。","加入 5 为单格堆，阶数 [2,1]，根 4≤5。加入 2 后合成阶 3、大小 5 的堆，孩子根是 4 和 5，根为 2。与更大的孩子 5 交换，得到 [3,1,4,2,5]。现在 5 在最右根，确认它最终排第五。","拿走根 5 的形状后，留下大小 3 的 [3,1,4] 和单格 [2]。左根 4 比右根 2 大，于是 trinkle 交换这两个根，先成为 [3,1,2,4,5]；被换小的左根 2 又小于自己的孩子 3，sift 把 3 提上来，得到 [2,1,3,4,5]。右端 4 现在也可以确定。","删除单格 4，再确定大小 3 堆的根 3。它拆成单格 2、1，两个根顺序相反，交换为 [1,2,3,4,5]。继续确认 2、1 即结束。过程中的 [3,1,4] 是堆，不是已排序段；不能直接把它作为最终输出。"],"cost":"加入或拆堆时，修复沿树向下或沿森林根向左走，最长约 log n 层，因此无明显结构的典型及最坏总时间 O(n log n)。已上升的输入满足所需关系，很多修复立即停止，加上形状更新的摊销成本，最好 Θ(n)。n 为记录数。标准实现用能表示 n 的常数个机器字和位编码保存森林形状，额外空间 O(1)；本条若显式存阶数列表，则需 O(log n) 空间。通常不稳定：非相邻交换可改变相同值的先后。","why":"它保留已经符合堆内和根间关系的部分，不必每次无条件重新找最大值。但数据杂乱时仍要上下、左右修复，回到对数层级的成本。这里的适应性不是声称所有接近有序的衡量方式都带来线性时间。","use":"适合进阶理解利用已有顺序的原地堆排序。需要先掌握父子关系、普通堆内下沉，再看森林根之间的 trinkle；第一次学排序可暂时跳过这一条。","details":"完整修复版用于讲清不变关系，优化实现可能推迟一些建堆交换。Leonardo 的两个单格阶必须区分，不能随意合成大小 2。不要每次扫描所有堆根找最大，否则会失去线性最好情形。子根位置由连续布局计算，不能套普通二叉堆数组的 2i+1 公式。"},"en":{"foundation":["A tree connects a parent record to children. In a max-heap, every parent is at least its children, so the root is largest. This does not put every record in sorted order.","A forest is several trees side by side. Here each tree occupies a consecutive array block, with its root in that block's last slot.","Leonardo sizes are L(0)=L(1)=1 and L(k)=L(k−1)+L(k−2)+1: 1,1,3,5,9,15,… . A larger block consists of a left child block, a right child block, and one root. Orders 0 and 1 remain distinct despite both having size one."],"idea":"Like heapsort, Smoothsort settles the largest remaining record at the right end. Instead of one fixed-shape heap, it organizes the unfinished prefix into a forest of special-sized heaps. Each heap root is largest within its block, and the roots are kept nondecreasing from left to right. The rightmost root is therefore the largest record in the whole unfinished prefix. If the data already fits these relations, little repair is needed. The following clear version fully repairs every step; optimized implementations can postpone repairs that later joins make unnecessary.","steps":["Build the prefix left to right and track each block's order. The first singleton has order 1. If the last two heap orders are k,k−1, combine them and the new record into order k+1, putting the new record at the block's end as root. Otherwise append a singleton: use order 0 when the previous last order is 1, and order 1 otherwise. No size-two Leonardo heap is required.","First learn the internal repair, sift. An order-k block for k≥2 contains an order-(k−1) left block, an order-(k−2) right block, then the root. If the root is at t, the right child root is t−1 and the left is t−1−L(k−2). Choose the larger child. If it exceeds the root, exchange them and continue inside that child heap. Stop when the root dominates its children or the block is a singleton.","The forest also needs root-order repair, called trinkle. For current root position t and heap order k, the preceding heap's root is at t−L(k); do not scan to find it. Exchange the roots only if that preceding root exceeds the current root and both current children, when children exist. Then move the repair position to the preceding heap and continue leftward. The large root moved right still dominates that right heap's children.","If the preceding root does not pass all those tests, stop moving left and sift inside the current heap. If there is no preceding heap, sift there as well. This repairs the internal heap whose root was reduced. After every addition, fully trinkle the newly formed rightmost heap to restore both heap relations and ordered roots.","Once construction finishes, leave the rightmost root in place as the final maximum and shorten the unfinished prefix by one. Delete a singleton heap description. For order k≥2, removing the root exposes its order-(k−1) left heap and order-(k−2) right heap. Their internal heaps remain valid, but the exposed roots may violate forest order. Trinkle the left exposed heap first, then the right.","Repeat maximum removal, deletion or splitting, and root repair. The final suffix grows by one slot per removal. Never exchange a record in that settled suffix. An empty unfinished prefix ends the algorithm."],"example":["Build [3,4,1,5,2]. Values 3 and 4 form singleton orders [1,0], with roots already ordered. Adding 1 joins them into an order-2 heap of size three, [3,4,1]. Root 1 is smaller than child 4, so exchange them: [3,1,4,5,2]. The first heap's root is now 4.","Add singleton 5, making orders [2,1] and roots 4≤5. Adding 2 joins them into an order-3 heap of size five. Its child roots are 4 and 5. Exchange root 2 with larger child 5: [3,1,4,2,5]. The final 5 is now settled.","Removing 5's root description exposes [3,1,4] and singleton [2]. Root 4 exceeds the following root 2. Trinkle exchanges them, giving [3,1,2,4,5]. The decreased left root 2 is below its child 3, so sift yields [2,1,3,4,5]. The next rightmost maximum 4 is settled.","Delete singleton 4 and settle root 3. Its heap splits into singletons 2 and 1. Repair their reversed root order to obtain [1,2,3,4,5], then settle 2 and 1. A block such as [3,1,4] is a heap, not an already sorted run."],"cost":"Repair can walk downward through heap levels or leftward through forest roots, with O(log n) work for a difficult operation. Unstructured typical and worst total time are O(n log n). On increasing input, the required relations already hold, so repairs usually stop immediately; amortized shape updates give best Θ(n). Here n is the record count. Standard implementations encode the shape in a constant number of machine words large enough to represent n, using O(1) extra space. An explicit educational list of heap orders uses O(log n) instead. Normally unstable: distant exchanges can reorder equal records.","why":"Already suitable heap and root relationships are retained rather than rebuilt blindly. Disordered data still requires movement through logarithmic levels. This adaptation does not mean every possible measure of near-sortedness guarantees linear time.","use":"An advanced study of adaptive in-place heap sorting. Learn ordinary parent-child sifting before forest-root trinkling. This entry can wait until simpler sorting methods are familiar.","details":"The fully repaired version exposes the required relations; optimized code may perform fewer construction exchanges. Distinguish the two singleton orders and never invent a size-two Leonardo heap. Scanning every root for every maximum loses the linear best case. These child positions come from consecutive Leonardo blocks, not the ordinary binary-heap formula 2i+1."},"sources":[{"title":"Dijkstra: Smoothsort, an alternative for sorting in situ, EWD796a","url":"https://www.cs.utexas.edu/~EWD/transcriptions/EWD07xx/EWD796a.html"},{"title":"musl libc qsort: Smoothsort implementation","url":"https://git.musl-libc.org/cgit/musl/tree/src/stdlib/qsort.c"}],"group":"B","seq":21,"refnos":[38,39]},{"id":14,"zh_title":"线股排序","en_title":"Strand sort","kind":"algorithm","zh_alias":"抽取有序子序列再归并；不是连续自然段归并","en_alias":"Repeated monotone-subsequence extraction and merging","zh":{"foundation":["子序列是按原先顺序挑出的若干记录，中间允许跳过一些。例如 [4,1,3,2,5] 中挑 4、5 可以组成子序列，它们不必相邻。","合并两个有序队列时，只需比较各自最前面的数，拿走较小的那个。因为同一队列后面的数都不更小，没必要现在逐个看它们。"],"idea":"从乱序记录里挑出一条能从小到大接下去的链，把暂时接不上的数留着，下一轮再处理。挑出的链已经有序，可以和前面做好的结果合并。这就是链式排序。它找的是可以跳过记录的有序子序列；自然归并排序找的是连续相邻的有序段，两者不要混为一谈。","steps":["准备一个空的有序结果。只要还有未处理记录，就取走其中最前面的一条，作为本轮链的开头。取走意味着以后不能再重复处理它。","从左到右查看余下记录。如果当前值不小于链尾，把它取走并接到链尾；否则把它留在余下队列中。跳过的记录仍保持原有相对顺序。每次接入都保证链尾没有下降，所以整条链有序。","将这条链与现有结果合并。各用一个位置指向尚未使用的最前记录，比较两个当前值，输出较小者，然后只推进它的指针。一边用完，把另一边剩余记录依次接上。相等时优先选择较早建立的结果，保留旧记录先于本轮新记录的顺序。","把本轮剩下的队列作为下一轮输入，直到它为空。使用数组时，可以在扫描中另建一个余下队列，不要每取走一个值就移动整条数组尾巴；链表则可改动连接而不搬动后续记录。"],"example":["输入 [4,1,3,2,5]，结果为空。取 4 开头。1、3、2 都比链尾 4 小，先留下；5 能接在 4 后面。本轮得到链 [4,5] 和余下 [1,3,2]，结果先变成 [4,5]。","第二轮从 1 开始。3 不小于 1，接上；2 小于当前链尾 3，留下。新链 [1,3] 与旧结果 [4,5] 合并：1 和 4 比选 1，3 和 4 比选 3，然后旧结果还有 4、5，依次接上。结果 [1,3,4,5]，余下 [2]。","最后一条链只有 [2]。合并时先比较 1 和 2，取 1；再比较 3 和 2，取 2；新链耗尽，接上 3、4、5。最终 [1,2,3,4,5]。","这里允许相等值接到链尾，因此重复值不会被漏掉。较早一轮有相同值时，合并先取旧结果；再配合每轮不打乱跳过项的顺序，这个版本稳定。"],"cost":"每轮要扫描余下记录，还要把本轮链与越来越长的结果合并。若一轮就能选走所有记录，只扫描和输出一次，最好 Θ(n)。反序时每轮只选走一个，余下扫描长度为 n−1、n−2……，合并结果也反复经过旧记录，最坏 Θ(n²)。典型成本取决于输入能形成怎样的链，这里不假设一个通用平均界。n 为记录数。通常需 Θ(n) 输出或余下存储；链表可重用节点。上述保持顺序且旧结果优先的版本稳定。","why":"一条长链一次就处理很多记录，轮数少；很多短链让同一批记录反复被看、旧结果反复被合并，所以慢。它不保证每轮把问题减半。","use":"适合讲解从已有顺序提取子序列和合并的思想，也可用于本来含有少数长链的链表数据。一般通用数组排序更多选用有明确 O(n log n) 最坏界的方法。","details":"传统描述有时只允许严格更大的值接入，也能排序，但重复值会分散到更多轮。明确本书用不小于规则。空输入无需抽链。比较失败的记录必须留下，而不是丢弃；合并时必须推进刚输出的那一边。"},"en":{"foundation":["A subsequence keeps the original order of selected items but may skip items between them. Selecting 4 and 5 from [4,1,3,2,5] is allowed even though they are not neighbors.","To merge two ordered sequences, compare their first unused items. The smaller one is the smallest remaining item overall, because neither sequence hides a smaller item behind its front."],"idea":"Walk through the input and collect a chain that keeps going upward. Leave any item that cannot follow the chain for a later walk. Each collected chain is already ordered, so merge it into the ordered result. Strand sort uses these possibly separated subsequences; natural mergesort instead discovers consecutive stretches.","steps":["Begin with an empty result. If unprocessed items remain, remove their first item and use it to start a new strand. A selected item must leave the remainder so it cannot be selected again.","Scan the other remaining items from left to right. If an item is at least the strand's last value, remove it and append it. Otherwise retain it in the remainder. Keep retained items in their original order.","Merge the strand into the old result. Keep one pointer at each sequence's first unused record. Output the smaller front and advance only that pointer. When one sequence ends, copy the other tail. On equal values, choose the old result first.","Repeat with the remainder until it is empty. For an array, build the next remainder during the scan rather than deleting each selected element with a separate tail shift. A linked list can detach and reconnect nodes instead."],"example":["Start with [4,1,3,2,5]. Four begins the first strand. Values 1,3,2 are too small to follow 4, so retain them. Five fits. Strand [4,5] becomes the first result, and [1,3,2] remains.","The next strand starts with 1. Append 3, but retain 2 because it is smaller than the current last value 3. Merge [1,3] with [4,5]: select 1 against 4, then 3 against 4, then copy 4 and 5. The result is [1,3,4,5], with remainder [2].","The last strand is [2]. During its merge, select 1 against 2, then select 2 against 3. The strand ends, so copy 3,4,5. Final output: [1,2,3,4,5].","Allowing equality within a strand keeps duplicate records. Choosing older result records first on a merge tie, together with order-preserving extraction, preserves their original order."],"cost":"Each round scans the remainder and merges with the growing result. If the first strand takes everything, only one scan and output are needed: best Θ(n). A reversed input gives one-item strands. The repeated scans have lengths n−1,n−2,…, and merging repeatedly revisits the old result, giving worst Θ(n²). Typical work depends on the available subsequences; no universal average bound is assumed. Here n is the record count. Conventional output and remainder storage use Θ(n) extra space; lists can reuse nodes. The stated extraction and tie rules make this version stable.","why":"Long strands remove many records per round. Short strands force repeated visits to nearly the same records and repeated merges of an already large result. There is no rule ensuring that every round halves the remaining work.","use":"Helpful for learning subsequence extraction and merging, or for lists that naturally contain a few long increasing strands. General array sorting usually benefits from a method with a guaranteed O(n log n) worst case.","details":"Some original descriptions require a strictly greater value before appending. That also sorts correctly but puts equal values into more strands. This entry uses at-least instead. Empty input needs no strand, and every skipped record must remain available. During merging, advance the side you actually selected."},"sources":[{"title":"NIST DADS: Strand sort","url":"https://xlinux.nist.gov/dads/HTML/strandSort.html"}],"group":"B","seq":22,"refnos":[40]},{"id":21,"zh_title":"笛卡尔树排序","en_title":"Cartesian tree sort","kind":"algorithm","zh_alias":"基于笛卡尔树的自适应堆排序；Levcopoulos–Petersson 方法","en_alias":"Cartesian-tree priority-queue sort; Levcopoulos–Petersson adaptive heapsort","zh":{"foundation":["节点是装一条记录的小盒子，另有左、右连接指向其他盒子；没有孩子时连接为空。整棵树最上面的节点叫根。","中序访问依次走左边所有节点、当前节点、右边所有节点。这里它要保留输入顺序，不是排序输出。另一个要求是每个父值≤孩子，称为最小堆关系。","栈从最后放入的项开始取出。优先队列则每次取最小值。建树使用栈，输出使用优先队列，两个结构用途不同。"],"idea":"能否先把输入搭成一棵树，让某个子树里最小的值总在顶部？笛卡尔树同时保持两件事：按左、自己、右访问仍能读出原输入；父节点不大于孩子，所以每棵子树的根都是那一块的最小值。树搭好后还不能按左右顺序输出，因为那样只是得到原输入。真正排序时，先输出根，再把它的孩子当作下一批候选，始终从候选中选最小。","steps":["为每条输入记录建立独立节点，左右连接先为空。维护一个值从栈底到顶不下降的栈，它记录当前树最右边的路径。处理新节点 x 时，先把 last 设为空；只要栈顶值比 x 大，弹出栈顶，并用 last 记住这次弹出的节点。最后一次弹出的节点会成为被移走整块的根。","将 x 的左孩子设为 last。若栈还有顶节点，就把顶节点的右孩子改为 x；若栈已空，x 就是新的整树根。再把 x 压入栈。注意被替换的右边整块并未丢失：它已经接到 x 的左边。新记录在输入末尾，左边放那些原来已经出现的记录，仍可保持中序访问等于原输入。","为何不必逐个重建旧子树？弹出的节点之间本来就有连接，保留它们，最后弹出的节点带着其整个子树接到 x 下方即可。每节点只压栈一次、最多弹一次。读完输入后，保存的根就是笛卡尔树的根，左右连接给出了完整树。","开始排序输出，优先队列只放根。队列中的候选是父节点已输出而自己未输出的节点；每个候选都代表一个尚未输出的子树，其中没有记录比它更小。候选之外的记录都被某个这样的根挡在下面，因此全体剩余最小值一定在候选中。","从队列取最小候选，将其记录写入结果；再把它存在的左、右孩子加入队列。队列可以用另一个二叉最小堆数组：新项加在末尾，比父项小就交换向上；取根时以末项补根，再与较小孩子交换向下直到父值不大于孩子。此堆用于候选，并不是刚搭好的笛卡尔树。","重复取最小、加入孩子，直到队列为空。每节点只输出一次。为了相同值按原顺序输出，从建树到队列都比较 (数值,原始编号)：值相等时编号小的更小，不只在某一步临时加规则。"],"example":["输入 [3,1,4,2]。读 3：没有旧节点，3 成为根，栈 [3]。读 1：弹出 3，last=3；设 1 的左孩子为 3。栈空，根改为 1，栈 [1]。","读 4：栈顶 1 不大于它，不弹；将 1 的右孩子设为 4，栈 [1,4]。读 2：弹出 4，last=4；接为 2 的左孩子。留下的栈顶是 1，将 1 的右孩子改为 2，栈 [1,2]。4 没消失，它现在在 2 下方。","最终根 1，左孩子 3，右孩子 2，2 的左孩子 4。按中序访问，左边先读 3，读根 1，再在右边读 4、2，得到原输入 [3,1,4,2]；这说明中序不是排序步骤。","候选开始 [1]。取 1，输出 [1]，加入 3、2。取候选中较小的 2，输出 [1,2]，加入孩子 4，候选现在 3、4。再取 3、4，最终 [1,2,3,4]。左右孩子必须一起进入候选，不能未经比较就先遍历整棵左子树。"],"cost":"建树时每节点压栈和弹栈至多一次，合计 Θ(n)。输出时每节点进、出候选队列各一次，每次最多走 log(q+1) 层，总上界 O(n log(qmax+1))，qmax 是同时出现的最多候选数，n 为记录数。单链树的候选始终只有一个，最好 Θ(n)；一般典型和最坏 O(n log n)，不能把线性建树误写成线性排序。节点、栈、队列和输出总额外空间 Θ(n)。全程以数值和原编号比较可稳定；任意处理相等值则不保证稳定。","why":"它一次建立了每个连续输入区域谁先有资格输出的关系，之后只比较已经露面的候选。若树是单链，几乎没有选择成本；若很多分支同时露面，队列仍要进行对数层比较。","use":"适合学习输入顺序与堆关系可以同时存在，以及用树中已知的局部最小值组织排序。它也是区间最小值结构的相关基础；初学者先懂节点、栈和优先队列再读此条。","details":"它不是二叉搜索树：左孩子不要求值更小。每个重复记录都要有独立节点。反复扫描区间找最小值再递归建树，最坏会 Θ(n²)，本条使用栈避免此问题。树可能很不平衡，但候选二叉堆是另一种结构，不依赖这棵树的高度。"},"en":{"foundation":["A node is a record with left and right links to other nodes. A missing child has an empty link. The top node is the root.","Inorder visits the left subtree, the node, then the right subtree. Here it preserves the original input order. Separately, min-heap order requires a parent value to be no greater than its children.","A stack removes the most recently added entry. A priority queue removes the smallest entry. Tree construction uses the former; sorted extraction uses the latter."],"idea":"Could we build a tree that puts the smallest record of every subtree at that subtree's top? A Cartesian tree does this while also preserving the input: walking left, node, right reproduces the original sequence. These two rules coexist, but neither means that the tree can simply be traversed to obtain sorted output. For sorting, output the root, expose its children as candidates, and repeatedly choose the smallest exposed candidate.","steps":["Create a separate node for each input record, initially with empty child links. Keep a stack whose values are nondecreasing from bottom to top; it represents the current tree's rightmost path. For a new node x, start last as empty. While the top value exceeds x, pop it and assign that popped node to last. The final popped node is the root of the whole portion moved aside.","Set x's left child to last. If a stack top remains, replace its right link with x. If the stack is empty, make x the overall root. Push x. The previous right portion has not been lost: it now hangs from x's left link. Since x is the new final input record, that placement preserves inorder input order.","Keep the old links within popped nodes. They already connect the moved subtree, so attaching its root is enough; do not rebuild every node individually. Each node is pushed once and popped at most once. After the input ends, the saved root and child links describe the entire Cartesian tree.","For sorted extraction, initialize a minimum priority queue with the root only. Candidates are unprinted nodes whose parents have been printed. Each is the minimum of its still-unprinted subtree. All hidden records lie under such a candidate, so the smallest remaining record must be among the candidates.","Remove the smallest candidate, append its record to output, and insert its existing children. A separate binary min-heap can implement the queue: append a new entry and exchange upward past larger parents; on removal, replace the root with the last entry and exchange downward with the smaller child until heap order returns. This candidate heap is not the Cartesian tree.","Continue until the queue is empty. Every node is emitted once. For stable duplicates, consistently compare (key,original position) during both construction and extraction. A smaller original position wins when keys tie."],"example":["Build [3,1,4,2]. Reading 3 makes it the root and gives stack [3]. Reading 1 pops 3, sets 1.left=3, and makes 1 the new root because the stack is empty. Stack: [1].","Reading 4 pops nothing because 1≤4. Set 1.right=4 and push 4, giving [1,4]. Reading 2 pops 4. Set 2.left=4, then replace the remaining top node's right link: 1.right=2. Stack: [1,2]. The old node 4 survives beneath 2.","The final tree has root 1, left child 3, right child 2, and 2's left child 4. Inorder visits 3, then 1, then 4, then 2: [3,1,4,2]. It reconstructs the input, demonstrating why inorder is not the sorting step.","Start candidates [1]. Emit 1 and expose 3 and 2. Choose 2, output [1,2], and expose 4. Candidates are now 3 and 4. Emit 3, then 4, to finish [1,2,3,4]. Both children join the candidate queue; traversing the entire left subtree first would be unjustified."],"cost":"Construction pushes and pops each node at most once, taking Θ(n). Extraction inserts and removes each candidate once, with a heap path of about log(q+1) levels. Its upper bound is O(n log(qmax+1)), where qmax is the largest candidate count and n is the record count. A chain keeps one candidate and gives best Θ(n). General typical and worst sorting time are O(n log n); linear tree construction does not imply linear sorting. Nodes, stack, queue, and output use Θ(n) extra space. Consistent key-plus-original-position comparisons make it stable; arbitrary equal-key handling does not.","why":"The tree establishes which local minima may become eligible first. Only exposed candidates need comparison. A chain leaves almost no choice; many exposed branches still require logarithmic queue work.","use":"An advanced example of preserving input order while organizing local minima. It is related to range-minimum structures as well. Learn nodes, stacks, and priority queues before using this entry as an implementation guide.","details":"This is not a binary search tree: a left child need not have a smaller value. Keep a separate node for each duplicate. Repeatedly scanning intervals for their minimum can make construction Θ(n²); the stack avoids that. The Cartesian tree may be very unbalanced, but the candidate binary heap is a different structure and does not inherit that height."},"sources":[{"title":"Levcopoulos and Petersson: Adaptive heapsort","url":"https://www.sciencedirect.com/science/article/abs/pii/S0196677483710217"},{"title":"Goodrich: Cartesian-tree priority-queue sort lecture","url":"https://ics.uci.edu/~goodrich/teach/cs263/notes/09-Maxima.pdf"}],"group":"B","seq":23,"refnos":[41,42]},{"id":22,"group":"C","zh_title":"自顶向下归并排序","en_title":"Top-down merge sort","kind":"algorithm","zh_alias":"递归归并排序；Merge sort 的经典实现","en_alias":"Recursive merge sort; a standard merge-sort implementation","zh":{"foundation":["数组就是一排有编号的格子；本节说“前半、后半”，只是限定看哪些格子，并不丢掉其他数。","已经有序的两排数，各自最左边就是这一排剩下的最小数。只比较这两个头，便能决定下一项该拿谁。","“递归”是对较小的一排重复同样任务。只有一个数时不用做任何事；这就是停止规则。"],"idea":"先把大问题拆成小问题：一排分成两半，每半再分两半，直到一项一排。然后反着往回走，每次把两个已排好的小排接成一个更大的有序排。接法不是直接拼起来，而是不断比较两排还没取走的第一个数。","steps":["指定当前范围。若里面只有零项或一项，立即结束，这个范围已经有序。否则从中间分开，先排左半，再排右半；每半都照这几步做。","两半都完成后，给它们各放一个指针。指针只是记住“下一项在哪”的编号。准备能装下整个范围的临时格子，输出位置从第一个空格开始。","比较左右指针所指的数，把较小的完整记录复制到输出格，那个指针向前一格，输出位置也向前一格。遇到相等，先取左半的记录，原来的先后关系就不会颠倒。","只要两边都有剩余项就继续比较。一边取完后，另一边本来已经有序，按原次序全部复制过去，不必再两两比较。","把临时结果复制回原范围。回到上一层时，这一整排已经有序，可以和另一半用相同方法接起来。"],"example":["从 [4,1,3,2] 开始，分成 [4,1] 与 [3,2]；每半再分成单项 [4]、[1]、[3]、[2]。单项直接返回。","接 [4] 和 [1]：比较 4 与 1，先写 1；右边空了，再写左边的 4，得到 [1,4]。接 [3] 与 [2] 同理先写 2，再写 3，得到 [2,3]。原数组现在是 [1,4 | 2,3]。","接最后两排：头是 1、2，取 1，临时输出 [1]；左头变成 4，右头仍是 2。比较 4、2，取 2，输出 [1,2]。","右头前进成 3，比较 4、3，取 3，输出 [1,2,3]。右边已经空了，把左边的 4 接上，成为 [1,2,3,4]，再写回原数组。"],"cost":"设 n 为记录数。每次接两排，要逐项读写，约做与这一排长度成正比的工作。同一拆分层的排合计仍是 n 项；长度反复减半约有 log₂n 层，所以基础版最好、一般、最坏都为 Θ(n log n)。Θ 表示同一增长量级。临时数组要 O(n) 格，等待返回的调用记录要 O(log n)；相等时先取左边则稳定。增加“两半边界已经顺序正确就不接”的检查后，已经有序输入可接近 Θ(n)。","why":"两排各自有序后，不需要把左边每个数和右边所有数比较。每次只看两个头，读过的项就不回头，因此每层只是扫一遍。代价是需要临时存放和复制记录。","use":"需要可预测的最坏速度和稳定性时很合适；稳定表示相等记录仍按输入先后出现。大记录的反复复制和临时数组需要计入实际成本。","details":"两排内部有序不等于全数组有序，[1,4 | 2,3] 就是反例。只复制记录的键而丢掉附带信息不算正确排序。真正的实现通常只分配一个大临时数组，再反复使用其中相应范围。"},"en":{"foundation":["An array is a row of numbered slots. A range means that we work on only a consecutive part of that row.","In an ordered row, the first remaining item is the smallest remaining item. Two ordered rows therefore need only their two front items compared.","Recursion means asking the same procedure to handle a smaller range. An empty range or one item stops immediately."],"idea":"Break a row in half, then break each half again until every piece has one item. Work back upward, joining two ordered pieces into a larger ordered piece. Joining is a sequence of small choices: compare the two available fronts and take the smaller.","steps":["For the current range, stop at zero or one item. Otherwise split near its middle. Finish sorting the left range, then the right range, by these same instructions.","Once both ranges are ordered, remember a next-item position for each. Such a remembered position is called a pointer here; it need not be a computer memory address. Prepare temporary output slots for their combined length.","Compare the two next items. Copy the smaller complete record into the next output slot. Advance only the pointer that supplied it, then advance the output position. On equality, take the left record first.","Keep comparing while both ranges have items. If one is exhausted, copy the remaining items from the other in their existing order. Their order is already known.","Copy the temporary result back into the original range. Return to the larger task, which can now treat this whole range as an ordered input."],"example":["Start with [4,1,3,2]. Split into [4,1] and [3,2], then into [4], [1], [3], [2]. Singletons require no action.","Join [4] with [1]: 1 is smaller, so write 1, then the remaining 4. This gives [1,4]. Joining [3] with [2] similarly gives [2,3]. The row is now [1,4 | 2,3].","For the final join, compare 1 with 2 and write 1. The left front becomes 4. Compare 4 with 2 and write 2: output [1,2].","Compare 4 with the new right front 3 and write 3. The right side is empty, so append 4. Copy [1,2,3,4] back into the row."],"cost":"Let n count records. Joining reads and writes each item in the current range. All ranges at one splitting level contain n items in total. Repeated halving creates about log₂n levels. The basic version therefore takes Θ(n log n) time in best, typical, and worst cases; Θ means a matching growth rate. Temporary records need O(n) slots, and suspended calls need O(log n) stack space. It is stable when the left side wins ties. A boundary check that skips already ordered joins can make ordered input take Θ(n).","why":"An item passes through each level once. We never compare every item in one side with every item in the other. Copying records and allocating the temporary area are the main additional costs.","use":"A dependable stable sort for general records when a temporary array is affordable.","details":"An ordered piece is not necessarily in final positions: [1,4 | 2,3] still needs work. Move whole records, including associated information. A practical version allocates one reusable temporary array rather than a new large array at every call."},"sources":[{"title":"Sedgewick & Wayne: Mergesort","url":"https://algs4.cs.princeton.edu/22mergesort/"},{"title":"Merge.java","url":"https://algs4.cs.princeton.edu/22mergesort/Merge.java.html"}],"visual":{"rows":[{"zh":"两个已排序段：左 | 右","en":"Sorted halves: left | right","values":[2,5,7,"|",1,3,4],"active":[0,4],"fixed":[],"moved":[]},{"zh":"输出 1 | 左余项 | 右余项","en":"Output 1 | unread left | unread right","values":[1,"|",2,5,7,"|",3,4],"active":[2,6],"fixed":[0],"moved":[0]},{"zh":"输出 1,2 | 左余项 | 右余项","en":"Output 1,2 | unread left | unread right","values":[1,2,"|",5,7,"|",3,4],"active":[3,6],"fixed":[0,1],"moved":[1]},{"zh":"输出 1,2,3,4 | 左余项","en":"Output 1,2,3,4 | unread left","values":[1,2,3,4,"|",5,7],"active":[],"fixed":[0,1,2,3],"moved":[2,3]},{"zh":"右段耗尽，追加 5,7","en":"Right exhausted; append 5,7","values":[1,2,3,4,5,7],"active":[],"fixed":[0,1,2,3,4,5],"moved":[4,5]}]},"seq":24,"refnos":[23,43]},{"id":23,"group":"C","zh_title":"自底向上归并排序","en_title":"Bottom-up merge sort","kind":"variant","zh_alias":"迭代归并排序；归并排序变体","en_alias":"Iterative merge sort; merge-sort variant","zh":{"foundation":["一项本身就有序；把长度一的两排接起来能得到长度二的有序排，再把长度二的两排接成长度四。","接两排时，两个指针分别记录两排尚未取走的头，另一个位置记录输出写到哪里。","这里用循环，意思是完成一轮后改一下排的长度，再做下一轮，不需要层层调用自己。"],"idea":"不从大排向下拆，而从单项向上组装。先两项一组，再四项一组，再八项一组。每次只接已经有序的邻接两排；只要排长覆盖全数组，就完成了。","steps":["令当前排长 w=1。沿数组从左到右，拿最多 w 项作左排，再拿接下来的最多 w 项作右排。末尾可能不足规定长度；没有右排就保持左排。","接这两排：分别看下一项，较小的复制到临时输出，移动供给这一项的指针。相等时先取左排。某排取空后，把另一排剩余记录顺序复制过去。","把接好的范围复制回去，再向右走到下一个尚未处理的两排。一次完整扫描结束后，每个长度约 2w 的范围已经有序。","把 w 变成 2w，重新从左到右扫描。只在 w<n 时开下一轮，n 是数组项数；n 为零或一时根本不用扫描。"],"example":["[4,1,3,2,5] 的第一轮 w=1：[4] 与 [1] 比较先写 1 再写 4；[3] 与 [2] 先写 2 再写 3；末尾 [5] 没有配对排，留下。得到 [1,4 | 2,3 | 5]。","第二轮 w=2，接 [1,4] 与 [2,3]。比较 1/2 取 1，4/2 取 2，4/3 取 3，再取 4，得到 [1,2,3,4 | 5]。末尾 5 继续保留。","第三轮 w=4，左排 [1,2,3,4]、右排 [5]：依次比较 1/5、2/5、3/5、4/5，取左边四项，最后取 5。得到 [1,2,3,4,5]。w 再翻倍后超过 n，停止。"],"cost":"设 n 为项数。每轮把每项读写一次，排长每轮翻倍，需要约 log₂n 轮；基础版最好、一般、最坏 Θ(n log n)。Θ 表示同一增长量级。复用临时输出需 O(n) 格，循环编号只需 O(1) 控制空间，无递归栈。相等时左排先输出则稳定；增加跳过已接顺序的边界检查可改善有序输入。","why":"与自顶向下归并做的主要接排工作相同，只是通过排长控制顺序。它免去调用栈，但仍要读写临时记录，不会因此自动比所有归并实现快。","use":"适合希望使用明确循环、避免调用自己，或者顺序处理连续数据的实现。","details":"不能假设长度是二的整数次幂。读写范围都必须截到数组末尾；示例中的第五项正是边界情况。两排完成后才允许把它们当作下一轮的有序输入。"},"en":{"foundation":["One item is already ordered. Joining two one-item pieces creates an ordered pair; joining pairs creates ordered groups of four.","A merge pointer remembers the next unused item of a piece. The output position remembers the next empty temporary slot.","A loop repeats a round after changing its piece size. This version needs no recursive calls."],"idea":"Build upward from single items. Join neighboring pieces of size one, then two, then four, doubling the size after each complete sweep. Each sweep uses the order established by the previous sweep.","steps":["Start with piece size w=1. Moving left to right, select up to w items for a left piece and up to w following items for a right piece. A short final piece is allowed. If no right piece exists, leave the left piece alone.","Join the two pieces by comparing their next unused items. Copy the smaller into temporary output and advance its source pointer. Take the left record first on a tie. When one piece ends, copy the remaining items of the other.","Copy the joined result back, then advance to the next pair of pieces. After the whole sweep, groups of up to 2w items are ordered.","Double w and repeat while w<n, where n is the number of input items. Empty and single-item arrays require no sweep."],"example":["Use [4,1,3,2,5]. With w=1, join [4] and [1] into [1,4], then [3] and [2] into [2,3]. The last [5] has no partner. Result: [1,4 | 2,3 | 5].","With w=2, compare the fronts of [1,4] and [2,3]. Take 1, then 2, then 3, then remaining 4. Now the row is [1,2,3,4 | 5].","With w=4, join [1,2,3,4] and [5]. The left front is smaller on four successive comparisons, so write 1,2,3,4, then the remaining 5. The whole row is [1,2,3,4,5]. The next doubled size exceeds n, so stop."],"cost":"Let n be the item count. A sweep reads and writes each participating item, and doubling needs about log₂n sweeps. Basic best, typical, and worst time are Θ(n log n), a matching growth rate. A reusable temporary array needs O(n) slots. Loop counters need O(1) space, with no recursive stack. The method is stable if left records win ties. Checks that skip already ordered boundaries can improve favorable inputs.","why":"The same small front comparisons used by recursive merging appear here. Loop control saves recursive-call overhead, but temporary-record traffic remains.","use":"Useful when iterative control or straightforward sequential sweeps are preferred.","details":"Do not assume the array length is a power of two. Clip every piece boundary at the array end. The fifth item in this example shows why. A piece becomes an input for the next round only after its entire join has finished."},"sources":[{"title":"Sedgewick & Wayne: MergeBU implementation","url":"https://algs4.cs.princeton.edu/22mergesort/MergeBU.java.html"},{"title":"MergeBU API and complexity","url":"https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/MergeBU.html"}],"seq":25,"refnos":[44,45]},{"id":33,"group":"C","zh_title":"堆排序","en_title":"Heapsort","kind":"algorithm","zh_alias":"二叉堆排序；堆式选择排序","en_alias":"Binary heapsort; heap-based selection sorting","zh":{"foundation":["把一排数按层看成树：第一个是根，下层两个是它的孩子，再下层是孩子的孩子。不必创建新树，位置关系就存在数组编号里。","位置从 0 开始时，位置 i 的孩子在 2i+1、2i+2，超过当前项数就不存在。根在位置 0。","最大堆只要求父项不小于孩子。顺着父子关系往下，数不会变大，因此根最大；兄弟或相邻格子却不一定有序。","“下沉”是把过小的父项和较大的孩子交换，再在它新到达的地方重复，而不是重排整个树。","floor 表示向下取整，例如 floor(5/2)=2。查找最后父项时，半个位置不能使用，要取这个整数。"],"idea":"先让数组符合最大堆的父子规则。最大的数就能立即从第一个格子取出，把它放到末尾固定。将堆缩小一项，令换到根的新数沿一条向下路径寻找合适位置，再取下一个最大值。固定的尾部从右往左增长，最终全排升序。","steps":["先学一次下沉。当前堆有 m 项，某父位置 i 有至少一个孩子时，读它存在的孩子；两个都有就先比孩子，挑较大者 c。若父值≥孩子 c，停止：父值也≥另一个孩子。否则交换父与 c，把 i 改成 c，继续往下。没有孩子也停止。","建堆从最后一个父位置 floor(n/2)−1 开始，依次处理更小父编号，直到 0。底层没有孩子，本来符合规则；从下往上做时，孩子下面的分支已经符合规则，所以上述一次下沉足以整理当前分支。","建好后，交换位置 0 与 m−1。根是剩余最大值，所以它到了全局应在的最右位置，之后不再碰它。令 m 减一，尾部不属于堆。","若 m>1，从根执行下沉。这次只有换入根的数可能破坏父子规则，其他分支内部仍然符合；用一条路径处理就够。","反复取根、缩小、下沉。最后一项自然最小，结束。空输入和单项不用建堆。所有孩子编号检查都使用 m，不要把已经固定的尾部当孩子。"],"example":["[4,1,3,2]，n=4，最后父编号 floor(4/2)−1=1。位置 1 的值 1 只有孩子位置 3 的 2，交换成 [4,2,3,1]。新位置 3 没孩子，停止。","处理根 4：孩子是位置 1 的 2、位置 2 的 3，先挑 3；4≥3，不换。现在是堆，但 [4,2,3,1] 显然不是升序。","交换根 4 与末项 1，成 [1,2,3 | 4]，m=3。比较孩子 2、3，选 3；1<3，交换为 [3,2,1 | 4]。新位置 2 无孩子。","根 3 与当前末项 1 交换，成 [1,2 | 3,4]，m=2。根唯一孩子是 2，交换为 [2,1 | 3,4]。","最后交换根 2 与 1，得 [1 | 2,3,4]，m=1，停止。竖线右边每一项都是移过去时就固定的；从未丢掉一个原数。"],"cost":"设 n 为项数。建堆从下到上：很多父项离叶子很近，只需一两次比较，少数靠上项才走较长路径，合计 Θ(n)，不是每项都走到底。取最大值后下沉最多走约 log₂n 层，取出约 n 次，所以通常、最坏 Θ(n log n)；不同键时最好也 Θ(n log n)。本下沉遇相等会停，全等可能 Θ(n)。迭代只用少量编号和交换临时值，额外 O(1) 空间。不稳定，因为根与尾的远距离交换可改变等值记录先后。","why":"选择下一最大值时只看一条树路径，不用重新扫描全部剩余数。但父孩子格子不都相邻，跳跃访问可能比连续归并更不利于缓存。","use":"需要最坏速度保证又不愿分配大数组时很好；也适合给快排混合算法作坏情况后备。","details":"“自底向上建堆”别与“bottom-up heapsort”变体混淆：后者可先让大孩子逐层上移到空位，再把拿住的旧根插回路径，以省比较。多叉堆让每父有更多孩子，树更矮却要多比较孩子。"},"en":{"foundation":["Read the array as a tree filled level by level. Its first item is the root, followed by its children, then their children. No separate tree objects are needed.","With zero-based positions, i has children 2i+1 and 2i+2 if those positions exist. Root position is 0.","A maximum heap requires each parent to be at least its children. Following a downward path cannot increase the value, so the root is largest. Siblings and neighboring array slots need not be ordered.","Sinking means exchanging an undersized parent with its larger child and continuing from that new position.","Floor rounds down to a whole number: floor(5/2)=2. Array positions must be whole numbers."],"idea":"Arrange the row into a maximum heap, exchange its largest root with the last active item, and exclude that last slot. Sink the new root within the smaller heap, then repeat. Finished largest values accumulate at the right, leaving an ascending result.","steps":["First define sinking in a heap of m items. At position i, find existing children. If there are two, compare them and select the larger, c. Stop if the parent is at least c: it is also at least the other child. Otherwise exchange parent and c, set i=c, and repeat. A childless position stops.","Build the heap by sinking parents from floor(n/2)−1 down to 0. Childless bottom items already satisfy the rule. Processing upward ensures each parent’s child branches already satisfy it, so its own single downward path is enough.","After construction, exchange root 0 with m−1. The largest active item has reached its final rightmost place. Reduce m by one and leave that completed suffix outside the heap.","If m>1, sink the replacement root. Other branches remained ordered internally; only the moved root can violate the rule.","Keep exchanging, shrinking, and sinking until one item remains. Empty and singleton inputs need no construction. Child tests must use the active size m rather than the original length."],"example":["For [4,1,3,2], the last parent is position 1. Its value 1 has just child position 3 containing 2. Exchange them: [4,2,3,1]. The new position 3 has no children.","Root 4 has children 2 and 3. Select larger child 3; since 4≥3, stop. The heap is ready, but [4,2,3,1] is not an ascending row.","Exchange root 4 with final 1: [1,2,3 | 4], active size 3. Select child 3 over 2 and exchange it with root 1: [3,2,1 | 4]. That path ends.","Exchange root 3 with active last 1: [1,2 | 3,4], size 2. Its only child 2 rises by exchange: [2,1 | 3,4].","Exchange 2 with 1: [1 | 2,3,4], size 1. Stop. Every item right of the bar was final when placed there; all original records remain."],"cost":"Let n count items. Bottom-up construction costs Θ(n): many parents need very short paths, while only a few need long ones. Each later extraction sinks along at most about log₂n levels. About n extractions give typical and worst Θ(n log n), also best Θ(n log n) for distinct keys. The stated early-stop rule can give Θ(n) on all-equal input. Iterative control and one exchange temporary use O(1) extra space. The sort is unstable because root-to-end exchanges can change equal-record order.","why":"The next maximum comes from one path rather than a complete rescan. Widely separated parent and child positions can reduce cache locality.","use":"Useful when worst-case protection and little extra storage matter; also a fallback inside quicksort hybrids.","details":"Bottom-up construction differs from the bottom-up heapsort variant, which first promotes larger children along a path and then reinserts the saved root to reduce comparisons. More-child heaps are shorter but inspect more children per level."},"sources":[{"title":"Sedgewick & Wayne: heaps and heapsort","url":"https://algs4.cs.princeton.edu/24pq/"},{"title":"Princeton: Heap implementation","url":"https://algs4.cs.princeton.edu/24pq/Heap.java.html"}],"visual":{"rows":[{"zh":"建最大堆：交换 1 与孩子 2","en":"Build max heap: exchange 1 and child 2","values":[4,2,3,1],"active":[1,3],"fixed":[],"moved":[1,3]},{"zh":"4 放末端；3 上升修复根","en":"Fix 4 at end; promote 3 to repair root","values":[3,2,1,4],"active":[0,2],"fixed":[3],"moved":[0,2,3]},{"zh":"3 放末端；2 上升修复根","en":"Fix 3 at end; promote 2","values":[2,1,3,4],"active":[0,1],"fixed":[2,3],"moved":[0,1,2]},{"zh":"2 与 1 交换，完成","en":"Exchange 2 and 1; done","values":[1,2,3,4],"active":[],"fixed":[0,1,2,3],"moved":[0,1]}]},"seq":26,"refnos":[46,47]},{"id":34,"group":"C","zh_title":"弱堆排序","en_title":"Weak heapsort","kind":"algorithm","zh_alias":"Weak-heap sort；经典 n 个反向位实现","en_alias":"Weak-heap sort; classic implementation with n reverse bits","zh":{"foundation":["这里的树编号和普通二叉堆不同：根 0 只有孩子 1；位置 i≥1 的两个物理孩子在 2i、2i+1。物理父编号是把 j 除以 2 向下取整。","每位置多存一个反向位 r[i]，只有 0、1 两种值。位为 0 时，2i 叫逻辑左孩子、2i+1 叫逻辑右孩子；位为 1 则两种名字交换。树格子没搬，改变的是孩子角色。根 r[0] 永远为 0，根没有左孩子，不能把公式的 2×0 当孩子。","子树是从某孩子继续往下能到达的所有位置。最大弱堆要求某节点不小于其逻辑右子树全部值，却不要求大于左子树全部值。根的唯一右子树包含其余全部位置，所以根仍最大。","这里的 join 是一项特定操作：比较两个指定位置，必要时换值并翻一个位。它不是把任意两数比较后就能建立整个弱堆。","a 是这排数的名字，a[i] 就是编号 i 的格子里那项；方括号是在指定位置，不是做乘法。"],"idea":"普通堆每层通常先挑较大孩子，再与父比较。弱堆通过每位置一个位放松规则，把一些比较得到的信息存下来。建堆、取最大值时，按规定找对比较的两个位置；一次 join 只作一次键比较。省比较的代价是多了一套寻找祖先和读写位的规则。","steps":["先解释特殊祖先。对位置 j，若它是父的逻辑左孩子，向父爬一次；继续爬，直到当前位置是父的逻辑右孩子，此时那个父就是特殊祖先。判断左孩子的方法是：j 的奇偶数（除以 2 的余数）等于父位置的 r 位。匹配就把 j 改成 floor(j/2)；不匹配就返回 floor(j/2)。必须保留原 j 给后面的比较用。","join(i,j)：若 a[j]>a[i]，交换两个值，同时把位置 j 的位从 0 变 1 或从 1 变 0；否则什么也不动。位属于位置，不跟着值搬。翻 j 的孩子角色是这套弱堆规则成立的一部分，不能只交换值而省位。","建堆：所有位设 0，从 j=n−1 逐项倒着走到 1。每次找到原位置 j 的特殊祖先 i，再 join(i,j)。由底往上已经建立的小弱堆逐步接入，最后根拥有最大值。空输入不做这些操作。","排序时，把根与当前最后一项交换，让最大值固定在尾部，当前大小 m 减一。若 m≤1，立即停止这次重建，不准去读位置 1。","若 m>1，从位置 1 向逻辑左孩子下降。当前 j 的该孩子是 2j+r[j]；只要它小于 m 就继续到那里。没有该孩子时达到路径末端。","从末端向上，每次 join(0,j)，然后 j=floor(j/2)，直到 j=0。这里向上走物理父，不是重复找特殊祖先。这条顺序把路径代表的候选值与根逐个比较，重新使根最大。再取出根、缩小、重复。"],"example":["[4,1,3,2] 的位全 0。先 j=3：3 是父 1 的逻辑右孩子，特殊祖先 i=1。比较 a[1]=1 与 a[3]=2，换成 [4,2,3,1]，翻 r[3] 为 1。","再 j=2：2 为父 1 的逻辑左孩子，爬到 1；1 是根的右孩子，特殊祖先为 0。比较 3 与根 4，不换。j=1 与根比 2、4，也不换。建堆结束。","交换根与尾，得 [1,2,3 | 4]，m=3。从 1 沿逻辑左孩子到 2。join(0,2) 比较 1、3，交换得 [3,2,1 | 4]，翻 r[2]。再向物理父 1，join(0,1) 比较 3、2，不换；再到 0 停。","取出根 3，得 [1,2 | 3,4]，m=2。从 1 没有存在的左孩子；join(0,1) 交换 1、2，得 [2,1 | 3,4]，翻 r[1]。","最后交换根与另一项，得 [1,2,3,4]，m=1，直接停。绝不能还从位置 1 出发，因为它已不属于当前堆。"],"cost":"设 n 为记录数。建堆每个非根位置做一次键比较，非空输入恰为 n−1 次，连同找祖先总工作 Θ(n)。经典取出过程反复走约 log₂n 的路径，总最好、一般、最坏 Θ(n log n)。这不意味着全部输入都需要相同交换数。额外必须有 n 个位和 O(1) 控制变量；若每位单独用一个字节，实际要 n 字节。不能写成严格 O(1) 辅助空间。不稳定。","why":"每次 join 不用先比较两个孩子，可能减少昂贵键比较。但奇偶判断、找祖先、翻位、跳跃访存也花时间，因此比较少并不保证机器上最快。","use":"比较很昂贵的专门排序、弱堆优先队列研究，以及理解如何用少量附加信息省比较。","details":"资料可能把逻辑左右镜像命名。必须一起采用本节的孩子公式、特殊祖先条件和取出路径，不能各摘一个公式拼起来。位翻转是改子树角色，不是倒序数组。"},"en":{"foundation":["This tree uses different positions from an ordinary binary heap. Root 0 has only child 1. Every position i≥1 has physical children 2i and 2i+1; physical parent j is floor(j/2).","Each position owns a reverse bit r[i], either zero or one. At zero, 2i is its logical left child and 2i+1 its right; at one, the names exchange. Slots do not move. Root r[0] remains zero, and root has no left child.","A subtree includes a child and every position reachable below it. A maximum weak heap bounds a node’s logical right subtree, not its left subtree. Root’s sole right subtree contains everything else, so root remains largest.","The operation join compares two prescribed positions and may exchange values and flip a bit. It does not turn any arbitrary pair into a complete weak heap.","Notation a[i] means the item in slot i of the row named a. Brackets select a position; they do not mean multiplication."],"idea":"Weak heaps save some key comparisons by relaxing ordinary heap rules and recording child roles in bits. Construction and extraction must select the right positions for each comparison. One join compares just two values; ancestor searches and bit handling do the additional bookkeeping.","steps":["Find the distinguished ancestor of original position j. Climb while the current position is its parent’s logical left child; stop at the first right-child edge and return that edge’s parent. Numerically, a left edge means (j mod 2)=r[floor(j/2)], where mod 2 is the remainder after division by two. On a left edge replace j by its parent; otherwise return the parent. Preserve the original j for the later join.","join(i,j) compares a[i] and a[j]. If a[j]>a[i], exchange their values and flip r[j] between zero and one. Otherwise do nothing. Bits belong to slots and do not travel with values. Flipping the roles below j is part of correctness.","Initialize all bits to zero. For original j from n−1 down to 1, find its distinguished ancestor i and perform join(i,j). Already built smaller weak heaps are progressively connected until root holds the maximum. Empty input stops directly.","Exchange root with the active last item and decrease active size m. If m≤1, stop restoration immediately; position 1 is no longer an active candidate.","Otherwise descend from position 1 along existing logical left children. At j that child is 2j+r[j]. Descend only when the child position is below m.","From the bottom, perform join(0,j), then move to physical parent floor(j/2), repeatedly until j=0. This upward sequence compares path candidates with root and restores its maximum. Extract again. Do not substitute repeated distinguished-ancestor searches for this physical-parent walk."],"example":["For [4,1,3,2], bits begin at zero. Position 3 is parent 1’s logical right child, so its distinguished ancestor is 1. Join values 1 and 2: [4,2,3,1], and set r[3]=1.","Position 2 is parent 1’s logical left child. Climb to 1, then follow its right-child edge to root 0. Value 3 does not exceed root 4. Joining position 1’s value 2 with root also changes nothing.","Extract 4: [1,2,3 | 4], size 3. Descend from 1 to left child 2. join(0,2) exchanges 1 and 3 and flips r[2]: [3,2,1 | 4]. Move to physical parent 1; join(0,1) compares 3 and 2 without exchange.","Extract 3: [1,2 | 3,4], size 2. Position 1 has no active left child. join(0,1) gives [2,1 | 3,4] and flips r[1].","The final exchange gives [1,2,3,4], size 1. Stop without visiting position 1 again."],"cost":"Let n count records. For nonempty input, construction uses exactly n−1 key comparisons; ancestor bookkeeping also gives Θ(n) total construction work. Classic extraction repeatedly follows logarithmic-length paths, giving best, typical, and worst Θ(n log n) time, although exchange counts vary. Extra storage is n bits plus O(1) controls; separate byte storage costs n bytes. This is not strict constant-space sorting. It is unstable.","why":"A join avoids comparing two children before comparing with their parent. Ancestor searches, bit flips, and scattered access can offset the saved key comparisons.","use":"A specialized option for expensive comparisons, weak-heap priority queues, and comparison-count research.","details":"Sources may mirror logical left and right. Child formulas,
