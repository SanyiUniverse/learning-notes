ck-four task handles [6,7,3,2]. Swapping its endpoints gives [2,7,3,6]. Its front-three task produces [2,3,7,6]; its back-three task produces [2,3,6,7]; its repeated front-three task leaves that order unchanged. The whole array is now [1,5,2,3,6,7].","The back is ordered, but 5 still precedes smaller 2. The final front-four task turns [1,5,2,3] into [1,2,3,5], giving [1,2,3,5,6,7]. Omitting that third task would leave this input unordered."],"cost":"Every large task produces three tasks still about two thirds as long. Those tasks each produce three more. With n items, best, typical and worst time are Θ(n^log₍₃⁄₂₎3), approximately Θ(n^2.71). The exponent describes length shrinking by 2/3 while task count triples. It grows faster than quadratic work. About log n levels of paused tasks need O(log n) extra stack space. Distant endpoint swaps mean stability is not guaranteed.","why":"The individual comparison is simple. The expensive part is sorting large overlapping regions again and again. Efficient divide-and-conquer methods split work into smaller pieces with less repetition; these three pieces remain relatively large.","use":"Use it to study the actual order of recursive execution, overlap and growth. Small teaching inputs are enough; there is no practical reason to wait for a large run.","details":"Some descriptions use the symmetric back-front-back schedule. This entry consistently uses front-back-front. The method does sort correctly. Correctness and efficiency are separate properties: an enormous amount of repeated work can still eventually produce the right answer."},"sources":[{"title":"NIST DADS: stooge sort","url":"https://xlinux.nist.gov/dads/HTML/stoogesort.html"}],"seq":72,"refnos":[110]},{"id":53,"group":"D","zh_title":"慢排序","en_title":"Slowsort","kind":"joke","zh_alias":"Slowsort；勿与 Bogosort 的模糊别名混用","en_alias":"Slowsort; not a synonym for Bogosort in this text","zh":{"foundation":["左右两半排好后，每半最后一格是这一半最大值。全段最大值一定是这两个之一，因为其他数都不超过它们。","递归调用表示暂停当前任务，完整执行同一方法处理更短区间，再返回继续。只有空段或单格任务可以直接结束。","“去掉最后一格”只是把它划出后续任务，不是删除它；这个数仍在数组里，已经最终定位。"],"idea":"慢排序先花力气排好两半，用两个末端值找到全段最大值，再把最大值留在最右。接着，它对其余几乎整段重新使用慢排序。这个最后动作浪费了刚才排好两半的大量成果，却确实会继续固定下一个最大值，直到全部完成。","steps":["任务只有一格或没有元素时，直接返回。否则从中间分成左半和右半；奇数长度时左半多一格。","先完整执行左半任务，再完整执行右半任务。每个较短任务仍用本方法；最终两格任务变成分别看单格，再比较它们并必要时交换。","两半都完成后，比较左半最后一格与右半最后一格。如果左半更大，交换两者；否则保留。右半最后一格也是全段最后一格，此时一定持有全段最大值。","把全段最后一格留在原地，给前面剩下的整个区间安排新任务。它跨越原来的两半，不是只看一小块；其内部还可能有逆序。","这个新任务也先处理自己的两半、固定自己的最大值、再处理去掉末端的区间。所有较短任务返回后，外层任务才完成。即使某段碰巧有序，也仍按这套调用顺序执行。"],"example":["输入 [4,1,3,2]，分成 [4,1] 与 [3,2]。先处理左半：两个单格直接返回，比较 4、1，交换，整列成为 [1,4,3,2]；再处理它的第一格 1，返回。","处理右半：单格 3、2 各返回，比较并交换，成为 [1,4,2,3]；它的首格 2 返回。两半现在分别是 [1,4]、[2,3]。","两个半段最大值是 4、3。交换它们，成为 [1,3,2,4]。4 最终定位，但前面的 3、2 仍逆序，所以排好两半并不等于整列有序。","处理前三格 [1,3,2]：先处理左半 [1,3]，比较 1≤3 不换，按规则再处理单格 1；右半单格 2 直接返回。","再比较左半末值 3 与段末值 2，交换成 [1,2,3,4]。前三格的 3 已定位，但仍按规则处理前两格 [1,2]：两个单格返回，比较不换，再处理单格 1。","所有暂停的任务都已结束，回到最外层，得到 [1,2,3,4]。这些“返回”不改变数；它们表示小任务完成，执行次序回到原来暂停的位置。"],"cost":"基本过程不因为数据已经有序而少调用任务，所以最好、通常、最坏调用数量同类。n 是长度，T(n) 表示处理长度 n 的工作：T(n)=T(⌊n/2⌋)+T(⌈n/2⌉)+T(n−1)+Θ(1)。前两项是排两半，第三项是重排几乎整段，最后是一次比较等固定工作。总增长 n^{Θ(log n)}，比任何固定幂 n²、n³ 等最终都快增长，但比通常 c^n 慢。普通实现最多留住约 n 层暂停任务，空间 O(n)，通常不稳定。","why":"只为了固定一个最大值，它先排两半，然后又处理长度仅少一格的区域。这种反复付费正是它故意慢的原因，不能把“分成两半”就自动当成高效。","use":"适合把递归执行展开、比较不同递推结构的成本，作为效率反例；不用于真实排序。它没有随机猜测，步骤确定。","details":"log n 可以理解为反复将长度减半所需的次数；n^{Θ(log n)} 的指数本身随规模增长，不是一个固定次数。本条给增长类别与递推式，不伪造一个精确常数指数。普通调用栈含 n−1 的长链；若实现专门消除尾调用，空间行为可变化。Slowsort 不应与随机洗牌的 Bogosort 混称。"},"en":{"foundation":["When a half is ordered, its last value is that half’s maximum. The whole segment’s maximum must be one of the two half-maxima.","A recursive call pauses the current task, completes the same procedure on a shorter segment, then returns to the paused instruction.","Excluding the last slot means protecting a finished value from later work. It does not delete that value."],"idea":"Slowsort spends work ordering both halves, compares their maxima, and leaves the whole segment’s maximum at the right end. Then it applies Slowsort again to almost the entire remaining region. This repeats much of the work just completed, but it eventually fixes the next maximum and continues until every value is placed.","steps":["Return for an empty or single-item segment. Otherwise split near the middle, giving the left half the extra item for an odd length.","Complete the left-half task, then the right-half task. Each uses these same instructions. At length two, the halves are singletons: they return, their two maxima are compared and possibly exchanged, and the remaining singleton returns.","After both halves finish, compare their last values. If the left maximum is larger, swap those two slots. The right half’s last slot is also the whole segment’s last slot, and now contains the overall maximum.","Protect that final slot and launch a new Slowsort task on the complete prefix before it. This region crosses the old half boundary and can still contain inversions.","That new task again sorts its halves, fixes its maximum, and sorts its shortened prefix. The outer task finishes only after these smaller tasks return. Ordered input follows the same calling schedule."],"example":["Begin with [4,1,3,2], split into [4,1] and [3,2]. In the left task, singletons 4 and 1 return; comparing their maxima swaps them: [1,4,3,2]. Its remaining singleton 1 then returns.","In the right task, singletons 3 and 2 return. Swap them: [1,4,2,3], then finish its remaining singleton 2. The ordered halves are [1,4] and [2,3].","Their maxima are 4 and 3. Swap them: [1,3,2,4]. The final 4 is protected, but the earlier 3,2 remain inverted. Ordering both halves did not finish the whole array.","Launch the prefix-three task on [1,3,2]. Its left task [1,3] completes without a swap and still visits its remaining singleton 1. The right singleton 2 returns.","Compare this task’s half-maxima 3 and 2, then swap: [1,2,3,4]. Its final 3 is finished, but the prescribed prefix-two task still runs: singletons 1 and 2 return, their comparison needs no change, then singleton 1 returns.","All paused tasks now complete. The outer task returns [1,2,3,4]. Returning does not move a value; it resumes the larger instruction after a smaller task finishes."],"cost":"Input order does not remove these calls, so best, typical and worst cases have the same kind of work growth. Let n be the length and T(n) its work. The recurrence is T(n)=T(⌊n/2⌋)+T(⌈n/2⌉)+T(n−1)+Θ(1). The first two terms order halves, the third reorders almost everything, and the last is fixed comparison work. The resulting class n^{Θ(log n)} grows faster than any fixed polynomial power, but slower than ordinary c^n growth. Basic retained call frames require O(n) extra space. It is normally unstable.","why":"It pays to sort two halves just to finish one value, then pays again for nearly the same region. Splitting a task in half does not by itself make an algorithm efficient.","use":"Use it to unfold recursive execution and compare work recurrences. It is a deterministic counterexample to efficient design, not a practical sorting choice.","details":"Here log n describes repeated halving, and the exponent itself grows with input size rather than staying at two or three. The recurrence and growth class avoid claiming an unsupported exact exponent. Ordinary calls retain a long n−1 chain; deliberate tail-call elimination can change space usage. Slowsort is distinct from random-shuffling Bogosort."},"sources":[{"title":"Broder and Stolfi: Pessimal Algorithms and Simplexity Analysis","url":"https://ic.unicamp.br/~stolfi/EXPORT/papers/by-tag/papers/math/pessimal-algorithms/download.pdf"}],"seq":73,"refnos":[111]},{"id":68,"group":"F","zh_title":"珠排序（重力排序）","en_title":"Bead / gravity sort","kind":"physical","zh_alias":"算盘排序；Bead sort","en_alias":"Abacus sort; gravity sort","zh":{"foundation":["这里一个数表示珠子的数量，3 就放三颗珠子。只能直接处理零或正整数。","一行横着摆，一列竖着摆。珠子只能在自己的竖列内下落，不能跑到隔壁列。空格没有珠子，计数为零。"],"idea":"把每个数画成一排从左边开始摆的珠子。随后让各列的珠子沉到底部。上面的行得到较少珠子，下面的行得到较多珠子。最后逐行数珠子，就读出了从小到大的数。这里并没有让某个完整的原始记录一路移动：珠子重新组成了数。","steps":["找出最大的数，记为 M，准备 M 列；有几个输入数就准备几行。数值 x 对应的那一行，从第一格开始放 x 颗珠子。","处理第一列：数这列共有几颗珠子。清空这一列，再从最底格往上放同样数量的珠子。这样模拟了下落，珠子总数没有变。","第二列、第三列也这样处理，直到所有列都处理完。每列都独立下落。","从顶行开始数：这一行有几颗珠子，就写下几。依次读到底行，得到升序结果。"],"example":["输入 [3,1,4,2]。最大值是 4，所以每行四格。用 1 表示珠子、0 表示空格，初始四行依次是 1110、1000、1111、1100。","第一列有四颗，四行全填；第二列有三颗，最上格空着，下面三格填珠子。此时前两列从上到下是 10、11、11、11。","第三列有两颗，只填最下面两格；第四列有一颗，只填最底格。最终四行是 1000、1100、1110、1111。","逐行数得 [1,2,3,4]。为什么不会出现上行比下行珠子多？每列的珠子都挤在底部：上行某格有珠子，同列更低的格就一定也有。","输入若含 0，就有一整行空格。它下落后仍对应一个空行，读为 0。"],"cost":"计算机若真的准备整个格子表，每格都检查或填一次，工作量同时取决于数的个数和最大数值。n 表示输入个数，M 表示最大值：时间 Θ(nM+n)，格子空间 Θ(nM)，另有 O(n) 结果空间。Θ 表示增长量同一数量级，O 表示上界。固定 n、M 后，这种实现的最好、通常、最坏情况没有数量级差别。若逐颗操作，还要计入所有数之和所代表的珠子总量。","why":"让很多珠子一起落，可以在物理上同时做许多动作。但很大的数需要很宽的架子、很多珠子，或很多模拟格子。把这些资源藏起来，才会显得时间与数字大小无关。","use":"适合很小的非负整数和理解物理计算。普通程序处理整数，计数排序或基数排序通常更合适。","details":"负数、小数要另外编码。相同数值的原始记录身份没有自然保留下来，所以不能直接说这种方法稳定。原论文讨论不同的物理和数字实现，不能把其中某个模型的时间结论套到全部版本。图中 1110 是一整行四格，不是数字一千一百一十。"},"en":{"foundation":["A value is a number of beads: 3 means three beads. This representation directly supports nonnegative whole numbers.","Rows go across; columns go down. A bead can fall down its own column, but cannot move into another column. An empty cell contributes zero."],"idea":"Write each value as a left-aligned row of beads. Let the beads in every column settle at the bottom. Upper rows now have fewer beads and lower rows have more. Counting each row from top to bottom gives ascending values. The beads rebuild the values; a complete original record does not travel intact through the process.","steps":["Find the largest value, called M. Make M columns and one row per input value. In the row for x, fill its first x cells with beads.","For the first column, count its beads. Clear that column, then fill that many cells upward from the bottom. This simulates falling without changing the column total.","Do the same for every remaining column. Each column settles independently.","Count the beads in the top row and write that count. Continue down to the bottom row. An empty row gives zero."],"example":["Start with [3,1,4,2]. Four is largest, so each row has four cells. Write 1 for a bead and 0 for an empty cell: the rows are 1110, 1000, 1111, 1100.","Column one has four beads, so all four cells stay filled. Column two has three, so its top cell becomes empty and its bottom three cells are filled. The first two columns now read 10, 11, 11, 11 down the rows.","Column three has two beads and fills only its bottom two cells. Column four has one and fills only its bottom cell. The complete rows are now 1000, 1100, 1110, 1111.","Their counts give [1,2,3,4]. If an upper row has a bead in a column, every cell below it in that column also has a bead. Therefore the row counts cannot decrease as we move downward."],"cost":"A full-grid simulation visits or fills the cells, so large values increase work even when there are few inputs. Let n be the item count and M the largest value. Time is Θ(nM+n), grid space Θ(nM), and output space O(n). Θ means the same growth order; O gives an upper bound. Best, usual, and worst inputs have the same order for fixed n and M. A bead-by-bead model must also count the total number of beads.","why":"Physical falling can happen in parallel because the apparatus supplies many working units. Large values still need more beads, width, or simulation work.","use":"Use tiny whole-number examples to study physical computation. Counting or radix methods are normally more useful in software.","details":"Negative and fractional values need extra encoding. Original record identities and stable equal-record order are not naturally preserved. The paper describes several models with different costs. A row such as 1110 is a picture of four cells, not the number eleven hundred and ten."},"sources":[{"title":"Arulanandham, Calude and Dinneen: Bead-Sort: A Natural Sorting Algorithm","url":"https://www.researchgate.net/publication/37987842_Bead--Sort_A_Natural_Sorting_Algorithm"},{"title":"Calude: University of Auckland publication list","url":"https://www.cs.auckland.ac.nz/~cristian/papers.html"}],"visual":{"rows":[{"zh":"输入：四个非负整数","en":"Input: four nonnegative integers","values":[3,1,4,2],"active":[],"fixed":[],"moved":[]},{"zh":"每格是一行：1 珠、0 空","en":"Each cell is a row: 1 bead, 0 empty","values":["1110","1000","1111","1100"],"active":[],"fixed":[],"moved":[]},{"zh":"按列数珠子","en":"Count beads by column","values":[4,3,2,1],"active":[0,1,2,3],"fixed":[],"moved":[]},{"zh":"各列下落后的四行","en":"Four rows after each column settles","values":["1000","1100","1110","1111"],"active":[],"fixed":[],"moved":[0,1,2,3]},{"zh":"数每行珠子：升序输出","en":"Count each row: ascending output","values":[1,2,3,4],"active":[],"fixed":[0,1,2,3],"moved":[]}]},"seq":74,"refnos":[112,113]},{"id":69,"group":"F","zh_title":"意大利面排序","en_title":"Spaghetti sort","kind":"physical","zh_alias":"面条排序；SAG（Spaghetti Analog Gadget）","en_alias":"Spaghetti Analog Gadget (SAG)","zh":{"foundation":["把长度当作数：三厘米的杆代表 3，一厘米的杆代表 1。这里先假设长度为正且能准确制作、区分。","要比较杆的长短，底端必须落在同一个平面。把短杆举高，会误以为它更长。"],"idea":"把每个数做成一根对应长度的杆，像一把干意大利面。底端齐平时，最高的顶端属于最长的杆。拿走最长的，再拿剩下最长的，就会按从大到小取出。把这串结果倒过来，才是从小到大。","steps":["选定长度单位，准备每个数对应的杆。若需要知道原记录是谁，给杆加标签。","把所有杆竖起来，底端都放在同一个平面上。检查没有杆悬空，也没有歪斜导致高度失真。","从上方找到最高的顶端，取出对应杆，记下它的长度。现在这个数是剩余输入的最大值。","继续对剩余杆做同样的事，直到取完。得到的是降序：把结果整串反转，或每次从结果的最后一个空位置往前填，形成升序。"],"example":["输入 [3,1,4,2]，做出长度为 3、1、4、2 单位的四根杆。原来谁排在前面不影响长度。","底端对齐后，4 的杆最高。取出它，暂记 [4]；剩余长度是 3、1、2。","接着 3 最高，取出后暂记 [4,3]。再取 2，得到 [4,3,2]。最后取 1，得到 [4,3,2,1]。","反转时交换最外面的 4 和 1，得到 [1,3,2,4]；再交换中间的 3 和 2，得到 [1,2,3,4]。","为什么每次取出的都可靠？因为剩余杆的底端仍然齐平，顶端最高就等于长度最长。若底端不齐，这个推理就不成立。"],"cost":"理想模型若规定做杆、对齐、一次拿到最高杆都算一个动作，那么准备和读取各做约 n 次，工作量 Θ(n)，保存 n 根杆需要 Θ(n) 资源。n 是数的个数，Θ 是同一增长数量级。真实成本还取决于总长度、材料、精度和操作。计算机若没有一次拿到最大值的物理能力，而是每轮逐个比较寻找最大值，就会做 n+(n−1)+… 次检查，时间 Θ(n²)。","why":"快来自特殊器材把全部长度同时展示成高度。器材替我们做了大范围比较；准备器材和读出结果仍然需要工作。相近长度尤其难分辨。","use":"适合讲解模拟计算，以及为什么效率必须说明允许什么操作。不是普通程序里免费调用的线性排序。","details":"等长杆先取谁没有保证。若要求稳定，必须带原顺序标签并规定等高时的取出顺序。负数要加偏移，小数要求更高精度；这些都增加前提。不能把“对齐后高度已经有序”当作整项工作零成本完成。"},"en":{"foundation":["Use length to represent a value: a three-unit rod represents 3. Assume positive lengths that can be made and distinguished accurately.","The bottom ends must share a flat surface. Raising a short rod would make its top falsely suggest a larger value."],"idea":"Make one rod for each value, like a handful of uncooked spaghetti. With the bottoms aligned, the highest top belongs to the longest rod. Remove that rod, then the longest remaining rod. The readings arrive largest first. Reverse them to obtain ascending order.","steps":["Choose a length unit and prepare the rods. Add labels if the original records have identities that must survive.","Stand the rods upright with every bottom on the same flat surface. A lifted or tilted rod can give a misleading height.","Find the highest top, remove its rod, and record its length. That rod represents the largest remaining input.","Continue until no rods remain. Reverse the recorded sequence, or write each removal into the last available output slot and work backward."],"example":["For [3,1,4,2], prepare rods of lengths three, one, four, and two units. Their original positions do not affect their lengths.","After aligning the bottoms, the four-unit rod is highest. Remove it: the partial reading is [4], and the remaining lengths are 3,1,2.","Three is highest next, giving [4,3]. Then remove two, giving [4,3,2], and finally one, giving [4,3,2,1].","To reverse the readings, exchange the outside values 4 and 1: [1,3,2,4]. Exchange the middle values 3 and 2: [1,2,3,4].","Each removal is justified because all remaining bottoms are still aligned. Highest top then means greatest length. Without that alignment, the argument fails."],"cost":"Suppose an ideal model counts preparing a rod, aligning it, and selecting the highest top as unit-cost actions. Preparation and reading each take about n actions: Θ(n) work and Θ(n) rods, where n is the item count and Θ means the same growth order. Real work also depends on length, material, precision, and handling. A computer that scans every remaining value to find each maximum makes n+(n−1)+… checks and takes Θ(n²) time.","why":"The apparatus exposes many lengths at once and supplies a special selection operation. Making the apparatus and reading its answer still require work. Nearly equal lengths are especially difficult to measure.","use":"Use it to discuss analog computation and why speed claims need an operation model. It is not a free linear-time operation available to ordinary software.","details":"Equal rods have no automatic stable order. Labels and an original-order rule are needed for ties. Negative values need an offset, and fractions need enough measurement precision. An aligned physical state is not the same as a zero-cost completed sorting job."},"sources":[{"title":"A. K. Dewdney: Computer Recreations, June 1984","url":"https://www.scientificamerican.com/article/computer-recreations-1984-06/"}],"seq":75,"refnos":[114]},{"id":70,"group":"F","zh_title":"睡眠排序","en_title":"Sleep sort","kind":"joke","zh_alias":"延时输出排序（描述性名称）","en_alias":"Delay-based output (descriptive name)","zh":{"foundation":["一个任务可以先等待一段时间，之后再执行。等待结束通常只表示它可以运行，不保证它立刻抢到处理器或输出设备。","多个任务同时存在叫并发。并发不等于所有任务真的同一时刻开始、同一时刻按计划写出结果。"],"idea":"给每个数开一个等待任务：小数值等得短，大数值等得长。希望它们按醒来的先后写出数，就成为升序。这依赖现实中没有普遍保证的时间条件，所以它是一种演示技巧，不能保证一般输入都正确排序。","steps":["先限定非负数，选时间比例，例如每 1 个数值单位等 1 秒。若希望最小值先写出，所有等待必须以同一个起点计时。","为每个输入安排任务。数值 x 的计划输出时刻是共同起点加 x 倍时间比例。不要误把依次创建任务的各自起点当成共同起点。","收集实际写出的值，等所有任务完成。实际顺序取决于任务何时获得运行和输出机会。","若计划时间与实际写出时间的次序不同，就得到错误结果。普通等待调用本身不提供排序正确性；演示必须明确这些理想前提。"],"example":["用 [3,1,2]，假设共同在零秒开始、每单位等一秒、没有任何延误。1 在一秒写出，2 在两秒写出，3 在三秒写出，结果 [1,2,3]。","这期间没有比较两个数，也没有交换数组位置。数值被改成了计划等待时间。","再看 [1,2]。任务 1 在一秒准备好，却因为处理器忙一直等到 2.5 秒才写出；任务 2 在两秒顺利写出。实际收集到 [2,1]，排序失败。","还有一种错误：先创建 3 的任务，过很久才创建 1 的任务。即使各自都精确等待，较小数也可能更晚写出。共同起点可以修复这一点，却不能修复后续调度延误。"],"cost":"理想条件下，创建和收集各处理 n 个任务，工作量 Θ(n)；总等待约为时间比例乘最大值 M。n 是输入个数，M 是最大数值，Θ 表示同一增长数量级。通常要 O(n) 任务资源，O 表示上界。只有启动动作少不代表整项工作快：若最大值随数字位数 b 达到约 2^b，等待也可这么长。真实系统一般没有保证正确次序的调度上界，不能给它一个按 n 排列的可靠最好、通常、最坏排序时间。","why":"它把数字大小换成真实时间，没有消除这份成本。把等待比例缩短，虽然快一些，但更容易被时间分辨率和调度误差打乱。","use":"适合学习计时、并发和“准备运行”与“实际运行”的区别。需要结果一定正确时，不应选它。","details":"等值记录的先后也没保证，因此不稳定。负数加偏移、小数扩大比例都不能解决任务延误。若使用能可靠按时刻取出事件的队列，队列本身可能已经需要堆或别的排序结构，其成本也应计入。"},"en":{"foundation":["A waiting task becomes ready after its delay. Ready does not mean it immediately receives processor time or access to output.","Several tasks can exist concurrently without starting or printing at exactly their planned times."],"idea":"Create a waiting task for each value. Small values wait briefly; large values wait longer. The hope is that printing in wake-up order gives ascending values. That hope requires timing conditions real systems do not generally promise, so this is a demonstration trick rather than a reliable general sort.","steps":["Restrict values to nonnegative numbers and choose a scale, such as one second per value unit. All delays should refer to a common starting time.","Arrange one task per value. For x, the planned print time is the common start plus x times the scale. Separate task-creation times are not automatically a common start.","Collect the values actually printed and wait for every task to finish. Actual order depends on when each task can run and write.","If actual output order differs from planned time order, the result is wrong. A normal sleep or timer call does not by itself provide a sorting guarantee."],"example":["Take [3,1,2]. Assume a common start at zero, one second per unit, and no delays. One prints at one second, two at two seconds, and three at three seconds: [1,2,3].","No pair of values was compared and no array positions were exchanged. Values were encoded as planned waiting times.","Now take [1,2]. The task for one becomes ready at one second, but a busy processor delays its output until 2.5 seconds. The task for two prints at two seconds. The collected result is [2,1].","Starting the tasks at different times creates another problem. A task for three can start much earlier than a task for one. A shared starting time fixes that issue, but does not remove later scheduling delays."],"cost":"In an ideal delay-free model, launching and collecting n tasks requires Θ(n) work. Elapsed waiting is roughly the scale times the largest value M. Here n counts inputs, M is their maximum, and Θ means the same growth order. Task resources are usually O(n), an upper bound proportional to n. A maximum represented with b bits can approach 2^b, producing enormous waiting. Real scheduling generally provides neither guaranteed output order nor a universal delay bound, so ordinary best, usual, and worst sorting times cannot be ranked using n alone.","why":"It replaces numeric size with real waiting instead of removing that cost. Shortening the scale increases sensitivity to timer resolution and delays.","use":"Use it to learn timers, concurrency, and the difference between becoming ready and actually running. Do not use it when order must be correct.","details":"Equal records have uncertain order. Offsets for negatives and finer scales for fractions do not fix scheduling. A dependable ordered event queue may already use a heap or another ordering structure whose work must be counted."},"sources":[{"title":"Kevlin Henney: Need Something Sorted? Sleep On It!","url":"https://accu.org/journals/overload/31/175/henney/"}],"seq":76,"refnos":[115]},{"id":71,"group":"F","zh_title":"穷举全排列排序","en_title":"Exhaustive permutation sort","kind":"joke","zh_alias":"确定性排列排序；deterministic Bogosort 在部分资料中的称呼","en_alias":"Permutation sort; sometimes deterministic Bogosort","zh":{"foundation":["一个排列，就是同一批记录的一种摆法，不添加也不丢掉记录。例如 [3,1,2] 和 [1,3,2] 是两种摆法。","可以先选第一格放谁，再从剩余记录里选第二格。一次选到底得到一个候选；不成功就退回最近的选择，换一个还没试过的选项。"],"idea":"按一个确定顺序，把可能的摆法逐一试出来。每得到一串完整候选，就检查是否从小到大；找到一串就停。它保证最后能找到答案，但前面失败的摆法几乎没给下一次提供帮助。","steps":["准备当前候选和“哪些记录已经用过”的记号。从输入顺序开始，依次尝试第一格的各个可用记录。","选好第一格后，把它标为已用。第二格只尝试尚未用过的记录。这样继续，直到每一格都有记录。","从第一对相邻数开始检查候选。若每个数都不大于右边的数，返回这个候选。若发现前数更大，候选失败。","失败后退回最近还有其他选项的位置。撤销后面记录的已用记号，换一个未试的选择，再把后面的格子逐格填上。一个位置的选项都试完就再向前退。这个规则保证没有遗漏摆法。"],"example":["输入 [3,1,2]，选项按原记录顺序尝试。第一格先放 3，第二格放 1，剩余 2 只能放第三格：候选 [3,1,2]，因为 3>1 失败。","退回第二格，把 1 放回可用记录，改选 2。第三格填剩余 1：候选 [3,2,1]，也失败。以 3 开头的选择已试完。","退回第一格，改放 1。剩余记录按顺序是 3、2，所以先得到 [1,3,2]，因为 3>2 失败。","再退回第二格，改放 2，第三格放 3，得到 [1,2,3]。两对相邻数都通过，停止。以 2 开头的两个候选不必再试。"],"cost":"候选增长非常快：n 个不同记录有 n! 种摆法，! 表示 n×(n−1)×…×1。这里 n 是记录个数。若每个候选都完整检查 n−1 对，则第一候选已正确的最好时间 Θ(n)，最后才找到的最坏时间 Θ(n·n!)，Θ 表示同一增长数量级。若正确候选的位置大致均匀，通常也需要阶乘量级试验。一次只保留当前候选和选择状态，额外空间 O(n)，不用存所有候选。发现错误就提前停止检查，会改变单次检查成本，但候选数仍巨大。","why":"多一个不同记录，就把摆法数再乘一个越来越大的数。保证能结束，和能在合理时间内结束，是两件事。","use":"适合用极少记录学习穷举和逐格选择，也可作为小输入的答案核对方法。","details":"等值记录若各自有身份，默认可能改变顺序。按“数值、原下标”共同比较可规定唯一稳定目标。这里的排列枚举与排名排序不是同一方法：后者通过两两比较计算位置，不把所有摆法逐一尝试。"},"en":{"foundation":["A permutation is one arrangement of the same records. No record is added or lost: [3,1,2] and [1,3,2] are different arrangements.","Choose a record for the first slot, then one of the remaining records for the second. Completing all choices gives a candidate. After failure, return to a choice and try another option."],"idea":"Try possible arrangements in a fixed, systematic order. Check each complete candidate for ascending order and stop when one passes. The method eventually finds an answer, but failed candidates provide almost no useful guidance for the next attempt.","steps":["Keep a current candidate and marks showing which records are used. Try the options for its first slot in input order.","After choosing a record, mark it used. Try only unused records for the next slot. Continue until all slots are filled.","Check neighboring values from left to right. If each value is no greater than its right neighbor, return the candidate. A larger left value makes it fail.","After failure, return to the latest choice that has another option. Release the records used after that choice, select the next option, and fill the later slots again. If a choice has no options left, move back farther. This avoids missing arrangements."],"example":["Start with [3,1,2], trying records in input order. Put 3 first, then 1, then the only remaining record, 2. Candidate [3,1,2] fails because 3>1.","Return to the second slot. Release 1 and try 2 there, leaving 1 for the last slot: [3,2,1]. It fails too. All candidates beginning with 3 have now been tried.","Return to the first slot and choose 1. The remaining records are 3 and 2, so the next candidate is [1,3,2]. It fails because 3>2.","Change the second choice to 2 and put 3 last: [1,2,3]. Both neighboring pairs pass, so stop. The two arrangements beginning with 2 need not be generated."],"cost":"With n different records, there are n! arrangements. The exclamation mark means n×(n−1)×…×1. With a complete n−1-pair test for each candidate, best time is Θ(n), and worst time Θ(n·n!); Θ means the same growth order. If the target position is roughly uniform, usual waiting is also factorial-scale. Keeping only the current choices needs O(n) extra space, a linear upper bound. Stopping a check at its first error can save checks, but does not remove the huge candidate count.","why":"Adding one distinct record multiplies the possibilities by another growing factor. Guaranteed eventual success does not imply practical speed.","use":"Use tiny examples to learn exhaustive search or to check another method’s answer.","details":"Equal records may exchange identities. Comparing both value and original position defines a stable target. This permutation enumeration differs from rank/enumeration sort, which calculates positions from pairwise comparisons."},"sources":[{"title":"NIST DADS: permutation sort","url":"https://xlinux.nist.gov/dads/HTML/permutationSort.html"}],"seq":77,"refnos":[116]},{"id":72,"group":"F","zh_title":"Bogo 排序","en_title":"Bogosort","kind":"joke","zh_alias":"愚蠢排序；猴子排序；随机排列排序","en_alias":"Stupid sort; monkey sort; random permutation sort","zh":{"foundation":["先检查相邻数：左边不大于右边就是这一对顺序正确；所有相邻对都正确，整串才正确。","洗牌是重新打乱整批记录。正确的随机洗牌不丢记录，并让每种排列有同样机会；不是随便交换一次就等价。"],"idea":"检查当前摆法。若已经有序就结束，否则整串随机洗牌，再检查。每次失败后都丢掉已有顺序信息，希望某次碰巧摆对。答案正确来自最后一次完整检查；难题是等待它出现可能要很久。","steps":["从左到右检查相邻对。如果每对都满足左值不大于右值，就停止并返回当前数组。","发现错误后做均匀洗牌。一个办法是从最后一格开始，在第一格到当前格之间等机会选一格，和当前格交换；再把当前格向左缩一格，重复到第二格。","现在重新检查整串。洗牌之后，原来正确的前缀或后缀都不能继续当成已完成。","只要检查失败，就再洗牌。演示可以设尝试次数上限，但达到上限的含义是尚未完成，不能把最后一串当作排序答案。"],"example":["从 [3,1,2] 开始，第一对 3、1 不对，准备洗牌。假设最后一格 2 抽中与第一格 3 交换，得到 [2,1,3]；再在前两格抽中交换，得到 [1,2,3]。这是一条成功的洗牌路径。","也完全可能第一轮得到 [2,3,1]，检查因 3>1 失败；下一轮又回到 [3,1,2]。前一次看起来的进步没有保证保留。","只有得到 [1,2,3]，并检查 1≤2、2≤3 后，才停止。上述结果是假设的随机结果，不能照着预测下一轮。","三个不同数有六种排列，均匀洗牌每次成功机会为六分之一。平均六轮不表示第六轮一定结束；第六十轮仍失败也可能发生。"],"cost":"已经有序时只检查一遍，最好时间 Θ(n)，n 为记录个数，Θ 表示同一增长数量级。不同值共有 n! 种排列，其中一种有序；! 是从 n 连乘到 1。独立均匀洗牌平均需要 n! 轮，每轮洗牌和完整检查都花约 n 个动作，期望时间 Θ(n·n!)。原地洗牌只用固定几个临时变量，额外空间 O(1)。随机失败可以不断发生，没有有限的最坏终止时间。若有重复数，数值排列数减少；例如 [1,1,2] 只有三种数值摆法，不是六种。","why":"它完全不利用比较告诉我们的方向。巨大候选空间里反复抽签，即使最终结束的概率是 1，也没有某个有限时刻必定完成的承诺。","use":"适合极小例子，用来区分平均等待、概率和最坏情况。不是实用的大数据排序。","details":"通常不稳定，因为洗牌可能改变等值记录身份的先后。若重复值的数量分别为 c₁、c₂……，不同数值摆法数 D=n!/(c₁!c₂!……)，成功概率是 1/D。随机数或洗牌不符合前提会改变结论。只随机交换两个位置的是 Bozosort；stupid sort 也可能指侏儒排序，别名有歧义。"},"en":{"foundation":["A neighboring pair is in order when its left value is no greater than its right value. All neighboring pairs must pass.","A shuffle rearranges all records without losing any. A uniform shuffle gives every permutation the same chance; a single arbitrary swap does not do that."],"idea":"Check the current arrangement. If it is ordered, finish. Otherwise shuffle the whole array and check again. It throws away useful order and hopes to land on the answer by chance. The final check ensures correctness; the difficulty is how long success takes.","steps":["Check neighboring pairs from left to right. Stop if every pair has its smaller or equal value on the left.","After failure, shuffle uniformly. One method starts at the last slot: choose a slot uniformly from the first through the current slot and exchange their records. Move the current slot one place left and repeat through the second slot.","Check the complete array again. No prefix or suffix remains protected after a shuffle.","Repeat after every failure. A demonstration may impose an attempt limit, but reaching it means unfinished, not sorted."],"example":["Start with [3,1,2]. The pair 3,1 fails. One possible shuffle exchanges the last record 2 with the first record 3, giving [2,1,3]. It then exchanges the first two slots, giving [1,2,3].","Another run might instead produce [2,3,1], which fails at 3>1, then shuffle back to [3,1,2]. Apparent progress can disappear.","Only [1,2,3], followed by checks of 1≤2 and 2≤3, makes this example stop. These are possible random outcomes, not a script predicting future attempts.","Three distinct values have six arrangements. A uniform shuffle succeeds with probability one sixth. An average of six attempts is not a promise to finish on attempt six, or even sixty."],"cost":"For sorted input, one check gives best time Θ(n), where n counts records and Θ means the same growth order. Distinct records have n! permutations, with ! meaning multiplication from n down to 1. Independent uniform trials need n! attempts on average. Linear-cost shuffling and checking give expected time Θ(n·n!). In-place shuffling needs O(1) extra space: a fixed number of temporary values. There is no finite worst-case completion bound. Repeated values reduce the possibilities: [1,1,2] has three value arrangements, not six.","why":"The comparisons supply direction, but the method ignores it and draws another arrangement. Probability-one eventual termination does not supply a finite guaranteed deadline.","use":"Use very small examples to explain averages, probability, and worst cases.","details":"It is normally unstable. If equal-value counts are c₁,c₂,…, the number of value arrangements is D=n!/(c₁!c₂!…), giving success probability 1/D. The randomness assumptions matter. Randomly swapping just two slots defines Bozosort. The alias stupid sort can also mean gnome sort."},"sources":[{"title":"NIST DADS: bogosort","url":"https://xlinux.nist.gov/dads/HTML/bogosort.html"},{"title":"Gruber, Holzer and Ruepp: Sorting the Slow Way","url":"https://link.springer.com/chapter/10.1007/978-3-540-72914-3_17"}],"seq":78,"refnos":[117,118]},{"id":73,"group":"F","zh_title":"Bozo 排序","en_title":"Bozosort","kind":"joke","zh_alias":"随机两格交换排序","en_alias":"Random-transposition sort","zh":{"foundation":["交换两格，要先暂存其中一个记录，再把另一格搬来，最后把暂存记录放进另一格。这样两个记录都还在。","随机选位置，是不根据数值大小决定选谁。交换后仍要检查全部相邻对，不能只看刚交换的两个数。"],"idea":"每次随机选两个位置交换，然后检查整串是否已经有序。与整串洗牌不同，它一次只改两个位置。但交换不看数值方向，有时改好，有时把刚做好的关系改坏。","steps":["先检查全部相邻对。有序就停；否则准备一次随机交换。","这里约定从全部位置里随机选两个不同位置。把这两格的完整记录交换。另一种版本允许同一格选两次，那一轮相当于不动。","重新从头检查相邻对。只有全都通过才成功；有任何一对左边更大就继续。","再次随机选两格交换。任何位置以后仍可被选中，不能把碰巧正确的开头标为永久完成。"],"example":["从 [3,1,2] 开始，3>1，所以失败。假设随机选第一、第二格。暂存 3，把 1 搬到第一格，把 3 放到第二格，得到 [1,3,2]。","检查：1≤3 通过，3>2 失败。假设这次选第二、第三格，交换得到 [1,2,3]。全部相邻对通过，于是结束。","但另一条路径会在 [1,3,2] 后又选第一、第二格，回到 [3,1,2]。第一格曾经正确，不代表以后被保护。","也可能一直交换同一对位置，来回往返。每轮都遵守规则，却没有保证在有限轮数内到达目标。"],"cost":"已排序时只扫描一遍，最好时间 Θ(n)，n 是记录数，Θ 表示同一增长数量级。一次交换只要固定几个动作，额外空间 O(1)，即固定数量临时变量。困难是需要几轮：标准随机交换模型的等待可达阶乘量级；准确期望依赖选位置规则、起始排列与检查方式，不能给所有版本套同一个公式。每轮若完整检查就再做 Θ(n) 工作；发现第一处错误即停可少一些。没有有限的最坏终止时间，通常也不稳定。","why":"交换本身便宜，却不一定朝答案走。改好一对关系时也可能破坏其他关系，下一轮又可能撤销刚才的交换。","use":"适合用三四个数比较“一次洗全串”和“一次随机交换”的差别。不是实用排序。","details":"若总选两个不同位置，每次交换会改变排列的奇偶性；这不妨碍最终到达目标，只影响可能到达的步数。允许同一位置被选两次会多一些空转。理想随机选择可以使最终到达概率为 1，仍不能给出固定完成期限。"},"en":{"foundation":["To exchange two records safely, save one, move the other into its slot, then put the saved record into the other slot. Both records survive.","Random position choices ignore the values. After the exchange, the whole neighboring-pair test must still pass, not merely the changed pair."],"idea":"Choose two random positions, exchange their records, and check whether the array is ordered. Unlike a whole-array shuffle, this changes only two positions at a time. Because the choices ignore values, an exchange may help or undo an earlier improvement.","steps":["First check every neighboring pair. Stop if they are all ordered. Otherwise prepare a random exchange.","Here choose two different positions uniformly and exchange their complete records. Another version allows choosing the same position twice, creating an idle attempt.","Start the order check again from the beginning. Every pair must pass. Any larger left value means another attempt is needed.","Choose another random pair. All positions remain eligible; an accidentally correct first slot is not permanently finished."],"example":["Start with [3,1,2]. The check fails at 3>1. Suppose the chosen positions are one and two. Save 3, move 1 into the first slot, and place 3 in the second: [1,3,2].","Check again: 1≤3 passes, but 3>2 fails. Suppose positions two and three are chosen next. Their exchange gives [1,2,3]. Every neighboring pair passes, so finish.","A different run can reach [1,3,2], then choose positions one and two again and return to [3,1,2]. The first slot looked finished but had no protection.","It is also possible to keep exchanging the same pair and travel back and forth. Each attempt follows the rule without guaranteeing success within a fixed number of attempts."],"cost":"Already ordered input needs one scan: best time Θ(n), where n is the record count and Θ means the same growth order. Each swap uses a fixed number of actions and O(1) temporary space. Waiting is the main cost. Standard random-transposition models have factorial-scale waiting; exact expectations depend on pair selection, starting arrangement, and checking rules. A complete check adds Θ(n) work per attempt. Stopping at the first error can reduce that check. There is no finite worst-case completion bound, and equal records are normally not stable.","why":"A cheap swap does not necessarily point toward the answer. It can repair one relation while breaking another, or the next attempt can reverse it.","use":"Use three or four records to compare random pair swaps with complete shuffles.","details":"Exchanging distinct positions alternates permutation parity but does not prevent eventual reachability. Allowing identical choices adds idle steps. Ideal randomness can give probability-one eventual success without a fixed deadline."},"sources":[{"title":"NIST DADS: bozo sort","url":"https://xlinux.nist.gov/dads/HTML/bozoSort.html"},{"title":"Gruber, Holzer and Ruepp: Sorting the Slow Way","url":"https://link.springer.com/chapter/10.1007/978-3-540-72914-3_17"}],"seq":79,"refnos":[119,118]},{"id":74,"group":"F","zh_title":"Bogo-Bogo 排序","en_title":"Bogobogosort","kind":"joke","zh_alias":"递归检查型 Bogobogosort；存在不统一变体","en_alias":"Recursive-check Bogobogosort; definitions vary","zh":{"foundation":["副本是另一份独立记录。改副本，不会自动改原数组；下面会同时跟踪两份，不能混为一谈。","前缀是开头的一段。前缀若已经升序，它的最后一个数就是这段的最大数。再看全串最后一个数是否不小于它，就能知道整份副本是否有序。","递归是让同一方法处理更短的输入。较大任务先停在“等待小任务完成”处，小任务做完再回来继续；长度零或一时直接返回，避免一直拆下去。"],"idea":"这是一种故意把检查做得很费劲的方法。普通随机排序直接检查相邻对；这里先复制原数组，再用同一个慢方法排副本的前面部分，想办法得到一份完全有序的副本，然后比较副本和原数组是否一模一样。若不同，明明已有正确副本，也不拿它当答案，而是重新洗原数组再试。","steps":["空串或一项直接完成。其余情况，要检查原数组 A，就先做独立副本 C。A 在这次检查过程中不动。","让同一方法排序 C 的前 n−1 项，n 是当前项数。这个小任务也要复制、检查、必要时洗牌；它没完成，当前任务就等着。","小任务完成后，C 的前面部分已经有序。看 C 最后一项是否不小于前缀最后一项。若更小，就把整个 C 随机洗牌，再重排它的前 n−1 项，再比这两个末尾值，直到 C 完全有序。","现在逐格比较有序副本 C 与检查前的 A。每格数值都相同，说明 A 本来就有序，本次检查通过；只要一格不同就失败。","失败后丢掉这次检查结果，对原数组 A 洗牌。重新从复制步骤开始。千万不要把有序 C 直接复制回 A；那会变成另一种、较合理的方法。"],"example":["外层原数组 A=[2,1,3]，先复制 C=[2,1,3]。要排 C 的前两项 [2,1]，于是暂停三项任务，进入两项任务。","两项任务的原串 P=[2,1]，做副本 Q=[2,1]。Q 的前一项 [2] 无须动；最后的 1 小于 2，所以 Q 还没排好。假设洗 Q 得 [1,2]，再处理前一项 [1]，比较 2≥1，Q 有序。","Q=[1,2] 与 P=[2,1] 不同，两项检查失败。假设洗原串 P 得 [1,2]，下一次复制 Q=[1,2]，前一项直接返回，末尾比较通过，Q 与 P 相同。两项任务这才返回 [1,2]。","回到三项任务，现在 C=[1,2,3]。3≥2，所以 C 有序；但 C 不等于 A=[2,1,3]。外层检查失败，A 仍是原来的摆法。","假设洗 A 得 [1,3,2]。副本前两项 [1,3] 本来有序，其两项检查可直接通过；但副本末尾 2<3，所以要洗的是副本 C。假设洗 C 得 [2,1,3]，它的前两项像上面那样最终排成 [1,2]，C 又得到 [1,2,3]，仍与 A=[1,3,2] 不同。","外层再失败，再洗 A。假设这回 A=[1,2,3]。副本的前两项检查通过，末尾 3≥2，副本与原串逐格相同，外层终于通过。这些洗牌结果只是选来说明过程的可能路径，不保证实际轮数。"],"cost":"即使输入本来有序，检查也要做长度 n、n−1……的副本，并逐层比较，所以这个版本最好也花 Θ(n²) 复制和检查工作；n 是项数，Θ 表示同一增长数量级。较大任务等待时仍保留自己的副本，基本实现同时保存的格子数为 n+(n−1)+…，额外空间 O(n²)，O 表示上界。随机重试还可能无限继续，没有有限的最坏终止时间。不同 Bogobogosort 定义没有统一公认的精确期望公式，不能把作者的估测写成定理。","why":"它把本可一遍完成的检查，换成套着套的排序，并且在检查失败后扔掉已排好的副本。内层等待与外层等待一起放大浪费。","use":"只适合极小例子，帮助看懂递归等待、副本与原数据的区别，以及为什么检查方法本身也有成本。","details":"这里用“大于或等于”检查末项，以支持重复的最大值；严格大于的原始写法对这些重复值有问题。数值相同的记录身份仍可能被洗乱，通常不稳定。还有逐步增长前缀等不同版本，它们不应继承本条的准确成本结论。"},"en":{"foundation":["A copy is separate data. Changing it does not automatically change the original array. Keep track of both.","A prefix is the beginning part of an array. Once that part is ascending, its last value is its maximum. The full array is ordered if the final value is at least that maximum.","Recursion asks the same method to handle a smaller input. The larger task waits, then resumes where it stopped. Zero or one item returns immediately."],"idea":"This method deliberately makes checking expensive. Instead of checking neighboring pairs, it copies the original, sorts the beginning of the copy using this same method, and tries to obtain an ordered copy. It then compares that copy with the original. If they differ, it discards the useful ordered copy and shuffles the original again.","steps":["Zero or one item needs no work. Otherwise, to check original array A, make an independent copy C. Leave A untouched during this check.","Ask this method to sort the first n−1 items of C, where n is the current item count. That smaller task also copies, checks, and sometimes shuffles. Wait until it finishes.","The prefix of C is now ordered. Compare its last value with the final value of C. If the final value is smaller, shuffle the whole copy C, sort its prefix again, and repeat this comparison until C is ordered.","Compare ordered C with A, slot by slot. Equality everywhere means A was already ordered and the check passes. Any difference makes it fail.","After failure, discard the check result, shuffle A, and restart with a fresh copy. Do not replace A with ordered C: that would define a different, more sensible method."],"example":["Let A=[2,1,3], and copy it to C=[2,1,3]. Sorting the first two items pauses the three-item task and starts a two-item task on P=[2,1].","That task copies P to Q=[2,1]. Its one-item prefix [2] returns immediately. The final 1 is smaller than 2, so Q is not ordered. Suppose shuffling Q gives [1,2]. Its prefix [1] returns, and 2≥1 makes Q ordered.","But Q=[1,2] differs from P=[2,1], so the two-item check fails. Suppose P now shuffles to [1,2]. A new copy, one-item return, final comparison, and equality test all pass. The two-item task finally returns [1,2].","Resume the three-item task: C=[1,2,3]. Since 3≥2, C is ordered, but it differs from A=[2,1,3]. The outer check fails. A has not yet changed.","Suppose A shuffles to [1,3,2]. Its copy has an ordered prefix [1,3], but final 2<3. Shuffle that copy. A possible result [2,1,3] requires the two-item work above, eventually giving C=[1,2,3]. C still differs from A, so the outer check fails again.","Suppose A next shuffles to [1,2,3]. Its copy passes the prefix check, the final comparison, and equality with A. Only now does the outer task finish. These chosen shuffle outcomes illustrate a possible path, not a fixed waiting time."],"cost":"Even already ordered input creates and checks copies of lengths n,n−1,… . Its best no-shuffle path takes Θ(n²) work; n counts items and Θ means the same growth order. Waiting parent tasks retain their copies, so a basic implementation needs O(n²) live extra space. Random retries have no finite worst-case completion bound. Definitions vary, and there is no universal established exact expected-time formula.","why":"It replaces a short check with nested sorts and can discard their completed work. Inner and outer retries compound the waste.","use":"Use only tiny examples to study recursive waiting and copies.","details":"This version uses at least, rather than strictly greater, to support duplicate maxima. Shuffling can reorder equal record identities, so stability is not assured. The original author gives complexity guesses. Prefix-growing variants should not inherit this version’s precise claims."},"sources":[{"title":"David Morgan-Mar: Bogobogosort definition and discussion","url":"https://www.dangermouse.net/esoteric/bogobogosort.html"},{"title":"Lucas Werkmeister: recursive-check implementation","url":"https://github.com/lucaswerkmeister/Miscellaneous/blob/master/Sorting/src/Bogobogosort.java"}],"seq":80,"refnos":[120,121]}],"front":{"zh":{"title":"排序算法学习手册","subtitle":"像有人坐在旁边 从最小的动作开始讲","cover":["中文版 独立学习版","80 个学习条目 含算法家族 重要变体与辅助技术","2026 年 10 月 5 日"],"opening":"桌上有四张纸，分别写着 4、1、3、2。我们想把它们摆成 1、2、3、4。一张纸也不能少，重复的数字也要保留。这个目标很容易说清楚，难点是：下一步应该看哪张纸，什么时候换位置，怎样知道已经完成？排序算法就是把这些决定写成一套能反复照着做的步骤。这本书会先讲每个小动作，再把动作接成完整方法。","scope_title":"覆盖范围与计数方法","scope":["完整目录先于算法正文。目录共有 80 个编号学习条目；编号代表讲解单元，不等于 80 种互不相关的新算法。同名别称归到同一条目。具有不同操作步骤的重要变体单列，并标明“变体”；多个相关实现标明“家族”。","范围包括常见比较排序，整数与字符串的分布排序，自适应与缓存方法，少见的堆和树方法，外存调度，并行与网络排序，限制操作及趣味方法。置换选择明确是段生成阶段；间接排序和固定小网络明确是辅助技术。Grailsort 与 WikiSort 是同一类块归并的不同实现，并非彼此别名。","这个范围足够广，但不能穷尽所有已发表或新命名的方法。未展开的范围包括 AKS 等复杂网络构造、Columnsort、Cubosort、LearnedSort 的众多模型版本、特殊整数排序理论、全部缓存优化及磁带调度变体，也不逐一计数每一种枢轴、增量或阈值组合。它们需要额外的数学或机器模型，不应随意补一个通用复杂度。","Stalin sort 会删去不合次序的值，不能保持全部输入记录；miracle sort 没有保证发生的有效步骤。两者不计为本手册中的完整排序算法。拓扑排序排列依赖关系、Quickselect 只找某个名次，任务不同，亦不混入全量数值排序的速度排名。","本文固定从小到大排序。步骤图和例子为自制，数值小是为了看清动作，不作为实测性能证据。高级家族会给出可理解的具体操作与必要前提；平台级实现还需按文末作者资料补齐边界和工程细节。"],"primer_title":"从四张纸和最小的动作开始","primer":[["1 我们到底要得到什么",["先把 1+1 想成把一张纸和另一张纸放在一起：现在共有两张纸。这里最重要的是分清“有多少张”和“纸上写着几”。纸上写着 7，也仍然只是一张纸。输入 [4,1,3,2] 有四张纸，不是十张。","从小到大表示：沿着一排纸往右看，右边的数不能比左边小。[1,2,3,4] 满足这个条件，[1,3,2,4] 不满足，因为 3 后面紧跟着 2。相等可以挨在一起，所以 [1,2,2,4] 也是排好的。"]],["2 为什么不能把不顺眼的数拿掉",["如果 [4,1,3,2] 最后只剩 [1,2,3]，它看起来从小到大，却不是正确排序：4 被丢了。正确排序要同时做到两件事：顺序正确，每张原来的纸也都还在。","纸不只有数字。它也可能写着一个人的名字和分数。按分数排序时，名字要跟着分数一起走。整张纸叫“记录”，决定位置的分数叫“键”。这两个词后面还会出现，含义就是这样。"]],["3 看一眼和动一下是两件事",["看到 4 和 1，我们可以问：4 比 1 大吗？答案是大。这叫比较。比较只得到一个判断，两张纸现在还在原位置。","如果规定左边不能比右边大，我们接着把它们对调：[4,1,3,2] 变成 [1,4,3,2]。这叫交换。一次比较可以不交换，例如 1 和 4 已经方向正确。算法必须告诉我们该比较谁，不能只说“比较到排好为止”。"]],["4 为什么只换一次还没有完成",["[1,4,3,2] 的头两张已经从小到大，但 4 后面仍有较小的 3 和 2。所以“这一对排好”和“整排排好”不是一回事。","很多算法每一步只保证一小件事。例如让最小数到最左边，或者让开头三张彼此有序。下一步靠这件已完成的小事继续推进。书中的绿色有时表示一个局部排好的小区间，文字会说明它是否已在最终位置。"]],["5 怎样插入一个数 又不丢掉别的数",["假设开头两张是 [1,4]，现在要加入 3。3 应放在 1 与 4 之间。先把 3 拿在手里，再把 4 向右挪一个位置，最后把 3 放进空位，得到 [1,3,4]。","电脑里的“挪动”也要按这个顺序。直接把 3 写到 4 的格子里，会覆盖 4；如果没有先保存或挪走它，就把记录丢掉了。文中的临时保存、空位和右移，都在解决这个问题。"]],["6 位置编号只是用来指路",["一排格子让我们能说“拿第几个”。为了避免每次都写长句，电脑通常从 0 编号。对于 [4,1,3,2]，位置 0 放 4，位置 1 放 1，位置 2 放 3，位置 3 放 2。","数字的大小与位置编号没有关系。位置 0 可以放最大的数。本文一般用“第 1 个”说话；出现下标公式时会说明从 0 数。连续几个位置叫区间，开头的一段叫前缀，末尾的一段叫后缀。"]],["7 重复数为什么还可能有先后",["两张纸都写 2，但一张属于甲，一张属于乙。我们用 2a、2b 记住纸的身份，字母不参与数字大小比较。输入 [2a,1,2b]，从小到大可以是 [1,2a,2b]，也可以是 [1,2b,2a]。","如果我们要求相等时仍按原先先后，第一种结果才符合要求，这叫稳定。稳定与数值是否排对是两个问题。每个条目会讲所述做法能否保留这种先后。"]],["8 两排已经有序的纸 怎样合成一排",["拿 [1,4] 和 [2,3]。每排最左边都是自己那排剩余纸里最小的，所以只比较两排的头就够了。1 比 2 小，先拿 1；现在比较 4 和 2，拿 2；再比较 4 和 3，拿 3；另一排空了，把剩下的 4 接上。结果 [1,2,3,4]。","这个动作叫归并。拿走一张后，只更新它所属那排的头，不重新扫描所有纸。它成立的前提是两排各自已排好；把两排无序数这样合起来，不保证正确。"]],["9 大任务拆成小任务 为什么有用",["要排四张纸，可以先分别排好前两张和后两张，再用刚才的归并合起来。排两张时，又可以把它们看作两组各一张。一张纸本来就有序，不再拆。","让同一个做法处理更小的一组，叫递归。它像一个人暂停手上大任务，先解决里面的小任务，再回到原来的地方。必须规定什么时候不再继续，通常是只剩零张或一张；否则会不停重复。"]],["10 栈与队列 只是两种取东西的顺序",["把小盘子一层层叠起来，最后放的盘子最先取，这种规则叫栈。递归要记住“做完小任务后回哪儿”，可以把待回去的任务叠在这样的栈里。","排队买东西时，先来的人先走，这种规则叫队列。算法的队列也是先放先取。它们不是自动排序工具，而是安排下一步取谁的规则。"]],["11 什么是树 它为什么能组织数字",["画一个圆圈放 4，下面画两个圆圈放 1 和 6，用线相连。上面的圆圈叫父节点，下面的叫孩子。再在 1 下连 2 和 3，就有了树形关系。最上面的节点叫根；顺着线下去经过的所有节点是后代。","树不一定代表大小顺序。算法还必须规定关系。例如搜索树要求左边都较小、右边都较大；最小堆要求每个父节点不大于自己的孩子。两种规则不同，不能看到树就当作已排序。"]],["12 堆怎样帮我们总是先拿到最小数",["若每个父节点都不大于孩子，从根沿任意路径往下走，数都不会变小。所以根是全树最小的。这样的树叫最小堆。拿走根以后，把末尾的数补到根，再与较小的孩子比较，必要时向下交换，直到关系恢复。","加进一个新数时，先放树的末尾，与父节点比较；若新数更小，向上交换，反复做到根或不再需要交换。堆只保证根最小，兄弟之间不必有序。具体堆算法会继续讲怎样放到数组里、怎样找孩子。"]],["13 什么是桶 与数位",["桶就是分组。按“0 到 9、10 到 19、20 到 29”分组时，整个第一组一定在整个第二组前面，但第一组内部还可能乱。所以分组以后，常常仍需排每一组。","十进制的 21 表示两个十加一个一。个位是 1，十位是 2。按个位分组与按整个数分组不同：21 和 11 个位相同，却不代表它们相等。基数排序会解释为什么要把几轮分组按特定顺序接起来。"]],["14 一排已经有序 怎样省力找位置",["要把 5 插进 [1,3,6,8,10]。先看中间的 6，知道 5 在它左边，就不用再查 8 和 10；只看 [1,3]，最后找到 3 与 6 之间。这样每次排除约一半候选，叫二分查找。","它省的是找位置时的比较。真把 5 放进紧密排列的格子里，6、8、10 仍得往右挪。所以“很快找到了位置”不等于“整次插入也只做很少的动作”。"]],["15 我们用什么办法说快或慢",["先问具体在做什么：看多少张纸、比较多少次、交换多少次、挪多少张、读写多少块文件。有时比较很贵，有时搬整张大记录很贵，两者不能总混成同一个数字。","再问数据有多少。后面用 n 表示记录数。n=4 就是四张；n=1000 就是一千张。走一遍每张看一次，大约做 n 件事。输入翻倍，这一类工作通常也约翻倍。"]],["16 为什么会出现 n² 和 log n",["若每张纸都与所有其他纸打交道，总次数接近 n 乘 n，写成 n²。十张大约一百份这种工作，一千张大约一百万份。这是解释增长趋势，实际算法常只比较一半的成对组合。","若每次把候选减少一半，一千个候选约十次就缩到一个：1000、500、250、125，继续往下减。所需的减半次数写作 log₂n，读作“以 2 为底的对数”。每层看完整批，约十层，就有 n log n 的工作。先理解动作，符号只是给这种增长起个短名字。"]],["17 最好 最坏 平均 不是同一件事",["一排本来就有序，是某些方法的最好情况；完全倒着放，可能是最坏情况。但“最坏”不一定都是倒序，取决于方法会在哪种输入上反复做最多的事。","说平均要先讲怎样抽取输入。把所有排列等可能抽一个，与“每天来的日志通常接近有序”，不是同一分布。随机算法还可能因为自己的随机选择，时快时慢。没有这些前提，就不能把一个平均数字当成保证。"]],["18 空间 正确结束 与下一步怎样读",["除了原来的纸，我们可能还要另一排空格、一张计数表、几张用来记任务的小纸条。这些是额外空间。原地排序通常表示不再准备另一份同样大的记录数组，但递归栈仍可能占地方。","每个方法都要能说清什么时候结束。正确结果必须有序、所有记录都保留，而且按所述条件能完成。接下来看算法时，沿着数字例子问三个问题：这一步改了哪里？为什么不会丢纸？完成了哪一件小事？复杂度部分可以在你能手动复现过程之后再读。"]]],"cost_title":"如何公平比较效率","cost_intro":"我们已经把 n、减半和 n² 讲过了。现在才用一张表把这些工作量放在一起。表中比较的是增长趋势，不是秒数。默认只有一个工作者，数字已放在内存里，每次比较或搬动一个小记录的成本差不多。文件读写、多核和特殊数字条件要分开看。","growth":[["增长量","朴素含义","n 为 1000 时的量级"],["n","像完整扫描一次；输入翻倍，工作约翻倍","1000"],["n log2 n","每层扫描，每次把任务约减半","约 10000"],["n log2² n","有约平方对数层的固定网络等","约 100000"],["n²","每项可能与几乎所有项打交道","1000000"],["n!","尝试输入的全部排列，增加一项就再乘一次","大到不适合穷举"]],"cost_notes":["O 表示增长上界，Θ 表示同一增长量级，Ω 表示下界。它们通常忽略常数，不是秒数。n 是记录数，k 可能是键域大小或位移上限，r 是基数，d 或 w 是位数；每个条目会给局部定义，不能跨条目把 k 当同一个量。log 默认以 2 为底，其他固定底数只差常数。","最好指最有利输入，最坏指最不利输入，平均需要说明输入分布；期望也可能来自算法自己的随机选择。“以高概率”表示失败概率随规模变小，不等于任何随机结果都保证。无法可靠给出统一平均界时，正文明确保留条件或不给数值。","假设所有键都不同。两项比较只有“前者小”或“后者小”两个结果。问一次，最多分出 2 条结果路径；问两次，最多 4 条；问 t 次，最多 2^t 条。n 条不同记录的可能次序有 n! 种，其中 n! 表示 1×2×…×n。要把这些次序分清，最坏路径必须足够长，使 2^t≥n!，因此最坏至少要 log₂(n!) 次比较，即 Ω(n log n)。这不是说每一次比较都恰好把可能性减半。计数和基数排序还利用键的结构，所以不受纯比较的这个限制。","现实中比较字符串要检查多个字符，大记录移动很贵，缓存命中、分支、分配和磁盘读写也有成本。两种同为 O(n log n) 的算法仍可相差很多。小例能说明原理，不能证明常数性能。","外存按 B 条记录一块读取、M 条记录内存来计算传输；并行同时报告总工作量 W 和跨度 S。p 个工作者的时间至少是 max(W/p,S)，还会有同步与传输成本。物理装置和计时器方法则不能套用普通 RAM 排名。"],"rank":[["固定条件","优先层级 从较少工作到较多工作","限制"],["整数键域 k=O(n)，位数 d 固定","计数或基数的近线性层 → 通用 n log n 比较层 → 平方层","键域巨大、键很长会改顺序；桶类另需分布假设"],["已有很少逆序或很少长有序段","插入的 O(n+I) 或自适应归并的近线性层 → 常规 n log n 层","I 为逆序对数；不同“近有序”含义不可混用"],["任意大数组，只准键比较","有保护的 n log n 层 → 无保护可能 n² 的方法 → 固定平方层 → 超多项式层","普通快排平均很快，但最坏保障弱；同层靠实测比较"],["写入昂贵或记录巨大","间接排序、Cycle 的少写策略需单独评估","比较更多仍可能总用时更短"],["文件超过内存","少轮的大路数归并或均衡分布 → 更多整文件读写轮次","固定内存、磁盘、桶均衡和可用流数量"],["多核 GPU 或排序电路","固定 W、S、线程数与带宽后评估","不能把并行层数当串行工作量；不作跨硬件名次"],["物理与随机趣味模型","条件成立的特殊模型另列；阶乘穷举和随机重试靠后","Sleep 不保证正确；随机方法没有有限最坏步数"]],"navigation":"阅读顺序按效率条件分组：先看可能近线性的专用方法和自适应方法，再看通用 n log n 方法；特殊机器条件单列；通常较慢的方法及趣味方法靠后。同组内先介绍有保障或较少工作的一层，再介绍附带条件、退化可能或研究型方法。同一效率层中的先后是学习依赖，不宣称前一个必定比后一个快。完整目录和 PDF 书签均可直接跳转。","diagram":"步骤图图例：橙色边框与 C 表示正在比较或分类；蓝色填充与 M 表示刚交换或移动；绿色填充与 S 表示文字明确指出的已排好区间或最终位置。S 若只是局部有序，并不宣称全局最终。白色是当前未标记项。图中有省略的内部比较时，正文会逐步解释；每一行都对应正文的一个状态。","reading_title":"如何使用每个条目","reading":["每个条目先把要用的小动作讲清楚，再接成完整方法。拿纸片照着例子做一遍：每次换、挪、分组或输出，都确认没有丢掉任何一张纸。复杂方法允许多读一遍；关键是每一步都有理由，而不是记住一个名字。","效率部分解释成本和成立条件；用途部分说明什么数据值得考虑。学习时先能复现例子，再替换为重复数、负数、逆序数和空数组。正文给出的稳定性仅针对所述版本，不能未经检查套到所有同名实现。","算法正文包含完整数字例、具体执行规则和必要工程注意；参考资料提供作者原论文、大学教材、NIST 定义和原实现。引用编号在两个语言版本中分别独立可用。"]},"en":{"title":"Sorting Algorithms Learning Manual","subtitle":"A patient explanation, starting with the smallest actions","cover":["English edition for independent study","80 learning entries including families variants and supporting techniques","5 October 2026"],"opening":"Imagine four cards on a table: 4, 1, 3, and 2. We want them to read 1, 2, 3, 4. Every card must survive, including cards with equal numbers. The goal is easy to say. The questions are what to look at next, when to change positions, and how to know we are done. A sorting algorithm is a set of steps that answers those questions. We will learn the small actions first, then see how each method combines them.","scope_title":"Scope and counting rules","scope":["The complete catalog appears before the algorithm lessons. Its 80 numbered entries are teaching units, not 80 unrelated inventions. Alternate names share one entry. An important variant receives its own lesson only when its operations differ, and is labeled as a variant. Related implementations may be taught as a family.","Coverage includes common comparison sorts, integer and string distribution methods, adaptive and cache-oriented methods, less familiar tree and heap sorts, external schedules, parallel sorts and networks, restricted-operation sorts, and playful methods. Replacement selection is labeled as a run-generation phase. Indirect sorting and small-network design are supporting techniques. Grailsort and WikiSort are different implementations in one family, not synonyms.","The catalog is broad rather than exhaustive. It does not develop AKS network construction, Columnsort, Cubosort, the many model-specific LearnedSort variants, all theoretical integer-sorting results, every cache optimization, or every tape schedule. It also does not count each choice of pivot, gap sequence, or threshold as a new algorithm. Those topics need additional mathematical or machine assumptions.","Stalin sort discards out-of-order items and therefore fails the requirement to keep every input record. Miracle sort lacks an effective step that guarantees progress. Neither is counted as a full sorter here. Topological sorting orders dependencies, and Quickselect finds a rank rather than fully sorting; they solve different tasks and are excluded from the numeric-sorting ranking.","Examples use ascending order and are newly constructed for this manual. Small numbers expose operations; they are not performance measurements. Advanced families receive concrete mechanisms and prerequisites, while a production implementation still needs the boundary and engineering details in the cited original materials."],"primer_title":"Start with four cards and the smallest actions","primer":[["1 What result are we trying to get?",["Think of 1+1 as putting one card beside one more card: there are now two cards. Separate the number of cards from the number written on a card. A card marked 7 is still one card. Input [4,1,3,2] contains four records.","Ascending order means that, as you move right, the next number never gets smaller. [1,2,3,4] passes that test. [1,3,2,4] fails because 2 follows 3. Equal numbers may stand together, so [1,2,2,4] is ordered too."]],["2 Why every original card must stay",["Output [1,2,3] looks increasing, but it does not correctly sort [4,1,3,2]: the card marked 4 has disappeared. We need both correct order and every original card, exactly once.","A card may hold a name and a score. When sorting by score, the name must move with it. The whole card is a record. The score used to decide order is its key. Those words will mean exactly this in later lessons."]],["3 Looking and moving are different actions",["Ask whether 4 is larger than 1. The answer is yes. That action is a comparison; the cards have not moved.","If the rule requires the smaller card on the left, exchange their positions: [4,1,3,2] becomes [1,4,3,2]. That action is a swap. A comparison need not cause a swap: 1 followed by 4 is already in the right direction. A complete algorithm must tell us which cards to compare next."]],["4 Why one successful swap is not enough",["The first pair in [1,4,3,2] is ordered, but 4 still has smaller numbers to its right. Ordering one pair and ordering the whole row are different achievements.","Many methods make one small promise at a time: the smallest item is now first, or the first three items are ordered among themselves. The next action builds on that promise. Green in a diagram may mark a locally ordered part; the caption says whether those items also occupy final positions."]],["5 Insert a card without losing another one",["Suppose [1,4] is already ordered and we want to add 3. It belongs between them. Hold 3 aside, move 4 one place right, then put 3 into the empty place. The result is [1,3,4].","Computer positions follow the same logic. Writing 3 straight over 4 destroys the old value unless we first save or move it. Temporary storage and shifting are ways of keeping every record safe. A held card is still part of the input."]],["6 Position numbers are addresses",["We need a short way to say which place to use. Computer arrays usually count from zero. In [4,1,3,2], position 0 holds 4, position 1 holds 1, position 2 holds 3, and position 3 holds 2.","A position number says nothing about key size: position 0 may hold the largest key. Prose uses first, second, and so on; index formulas state the zero-based convention. A range is a consecutive group of positions. A prefix starts at the beginning, and a suffix reaches the end."]],["7 Equal numbers can still be different records",["Two cards may both show 2 while belonging to different people. Write 2a and 2b to remember their identities; the letters do not change the numeric keys. Input [2a,1,2b] can become [1,2a,2b] or [1,2b,2a] while ordering its keys.","Keeping the original order of equal-key cards is called stability. The first result is stable for this input. Key order and equal-record order are separate requirements; each lesson says what its version preserves."]],["8 Combine two ordered rows",["Take [1,4] and [2,3]. Each front card is the smallest one remaining in its own row, so compare the two fronts. Take 1 before 2. Then compare 4 with 2 and take 2. Compare 4 with 3 and take 3. One row is empty, so append the remaining 4. Output: [1,2,3,4].","This action is called merging. After taking a card, update only that row’s front. We do not search the whole input again. Both input rows must already be ordered; merging two unordered rows this way is not a sorting guarantee."]],["9 Why solve smaller tasks first?",["To sort four cards, sort the first pair and the second pair, then merge the ordered pairs. To sort a pair, we may treat it as two single-card groups. A single card is already ordered, so splitting stops there.","Running the same method on a smaller group is recursion. Imagine pausing a large job, finishing its smaller jobs, then returning to where you paused. A stopping rule is essential; empty or single-item groups usually stop immediately."]],["10 A stack and a queue are rules for taking things",["In a pile of plates, the last plate added is the first removed. That rule is a stack. Paused recursive jobs can be remembered this way, so the program knows where to return.","In a waiting line, the first person to arrive is served first. That rule is a queue. Neither structure sorts values by itself. It determines which stored item is taken next."]],["11 A tree organizes relationships",["Draw a circle containing 4, with circles 1 and 6 below it and lines joining them. The upper circle is a parent and the lower circles are children. Add circles 2 and 3 beneath 1. The linked shape is a tree. Its top node is the root. Nodes reached farther down a path are descendants.","The picture alone makes no promise about number order. A search tree requires smaller values on the left and larger ones on the right. A min-heap requires each parent to be no larger than its children. These are different rules, and neither picture is automatically a fully sorted row."]],["12 How a heap keeps the smallest item available",["If every parent is no larger than its children, a path downward can never decrease. The root must be a smallest item. This structure is a min-heap. After removing the root, put the last item there, compare it with the smaller child, and exchange downward when needed until the rule holds again.","To add an item, place it at the end and compare it with its parent. Move it upward while it is smaller, stopping at the root or a valid parent relation. Siblings need not be ordered. Heap lessons explain how array positions represent the tree and how to find the children."]],["13 Buckets and digits",["A bucket is a group. Groups for 0–9, 10–19, and 20–29 have a useful order: every first-group key precedes every second-group key. Yet a single bucket may still be unordered, so its contents may need sorting.","In decimal notation, 21 means two tens and one unit. Its units digit is 1 and its tens digit is 2. Grouping by one digit differs from grouping by the complete number. Radix methods explain how several digit passes combine into correct full-key order."]],["14 Find a place by repeatedly halving",["To insert 5 into [1,3,6,8,10], first inspect the middle item, 6. Since 5 is smaller, ignore 8 and 10 and inspect the left part. The final gap is between 3 and 6. Removing roughly half the remaining candidates at each step is binary search.","This saves comparisons during the search. To put 5 into a tightly packed array, 6, 8, and 10 still have to move right. Finding a place quickly does not make those moves disappear."]],["15 What do we count when we say fast?",["Count actual actions: cards inspected, key comparisons, swaps, records moved, or file blocks read and written. Some tasks have expensive comparisons; others have very large records that cost more to move. One count does not always capture both.","We use n for the number of records. n=4 means four cards; n=1000 means a thousand. A pass that touches each item once performs roughly n actions. Doubling the input usually doubles this kind of work."]],["16 Why n squared and log n appear",["If almost every item interacts with almost every other item, work grows like n times n, written n². Ten items give a scale near a hundred such actions; a thousand give a scale near a million. Actual pairwise methods may use roughly half that many comparisons.","If candidates repeatedly halve, a thousand shrink to one in about ten steps: 1000, 500, 250, 125, and so on. That halving count is log₂n, the base-two logarithm. Touching the whole input at each of about ten levels gives work near n log n. The symbols name patterns of actions we can already understand."]],["17 Best, worst, and average need different questions",["An already ordered row is favorable for some methods. A reversed row may be unfavorable, but not every algorithm has its worst case on reversed data. The worst input is whichever makes that particular method do the most work.","An average needs a rule for choosing inputs. Choosing every permutation with equal probability differs from using daily logs that are usually nearly ordered. A randomized method may also vary because of its own choices. Without those conditions, an average number is not a guarantee."]],["18 Room, termination, and how to read a lesson",["An extra row, a count table, or notes about unfinished jobs all use extra space. In-place usually means no second full record array; it does not automatically remove a recursive stack.","A method must say when it finishes. Correct sorting orders the keys, preserves every record, and completes under its stated conditions. While following an example, ask what changed, why no card was lost, and what small promise now holds. Read the cost formulas after you can carry out the actions yourself."]]],"cost_title":"Compare efficiency under the same conditions","cost_intro":"We have already met n, repeated halving, and n² through concrete actions. The table now puts those growth patterns together. It gives scales of work, not seconds. Unless stated otherwise, one worker handles data already in memory and each comparison or small-record move has similar cost. Files, many workers, and special key types need separate conditions.","growth":[["Growth","Plain meaning","Scale at n equal to 1000"],["n","A full scan; doubling the input roughly doubles work","1000"],["n log2 n","Scan per level while tasks repeatedly halve","about 10000"],["n log2² n","For example a network with squared-logarithmic depth","about 100000"],["n²","Most items may interact with most other items","1000000"],["n!","Try all permutations; each added item multiplies the count","far beyond useful enumeration"]],"cost_notes":["O gives an asymptotic upper bound, Θ a matching growth scale, and Ω a lower bound. These symbols usually hide constants and do not give seconds. n counts records; k can mean a key-range size or a displacement bound; r is a radix; d or w counts digits or bits. Each lesson defines its local symbols. Unless stated otherwise, log means base two.","Best case means the most favorable input and worst case the least favorable. An average needs an input distribution; an expectation may instead be over the algorithm’s own random choices. With high probability is not a guarantee for every random outcome. A lesson avoids a single average bound when it cannot justify one.","Assume all keys are different. Comparing two items has two possible answers: the first is smaller or the second is smaller. One question can distinguish at most two answer paths; two questions at most four; t questions at most 2^t. There are n! possible orders, where n! means 1×2×…×n. To distinguish them all, the longest path must allow 2^t≥n!, requiring at least log₂(n!) comparisons in the worst case, or Ω(n log n). An individual comparison need not split possibilities evenly. Counting and radix sorts use key structure beyond these two-answer questions.","Real string comparisons may inspect many characters. Large records cost more to move, and caches, branches, allocation, and disk transfers matter. Two O(n log n) sorts can therefore have different elapsed times. A tiny trace explains correctness, not processor speed.","External-memory analysis counts blocks of B records transferred with memory capacity M. Parallel analysis reports total work W and span S, the longest chain of dependent actions. On p workers, time is at least max(W/p,S), before scheduling and communication costs. Physical devices and timer tricks need their own models."],"rank":[["Fixed conditions","Priority tiers from less work to more work","Limits"],["Integer range k=O(n) and fixed digits","Near-linear counting or radix tier → general n log n comparison tier → quadratic tier","Huge ranges or long keys change this order; buckets need distribution assumptions"],["Few inversions or few long ordered runs","O(n+I) insertion or near-linear adaptive merging → ordinary n log n tier","I counts inversions; different meanings of nearly sorted are not interchangeable"],["Arbitrary large arrays using comparisons","Protected n log n tier → methods exposed to quadratic worst cases → fixed quadratic tier → superpolynomial tier","Plain quicksort can be fast on average; methods within a tier need actual measurement"],["Expensive writes or large records","Evaluate indirect sorting and low-write cycle sorting separately","More comparisons can still mean less total time"],["Data exceeds memory","Fewer wide merge or balanced distribution passes → more whole-file passes","Hold memory capacity disk system balance and stream limits fixed"],["Multicore GPU or sorting circuits","Evaluate fixed work span workers and bandwidth","Parallel layers are not serial work; no ranking across different hardware"],["Physical and playful random models","Model-dependent special methods stand apart; factorial trials appear later","Sleep sort has no general correctness guarantee; random retry has no finite worst-case bound"]],"navigation":"The lessons begin with methods that can be near-linear under key or order assumptions, then develop general n log n methods. Separate machine models follow. Usually slower methods and playful algorithms come later. Within a group, guaranteed or low-work tiers precede conditional, degeneration-prone, or research-oriented methods. Order within one tier follows learning dependencies, not an assertion that one always runs faster. The catalog and PDF bookmarks link to every entry.","diagram":"Diagram key: orange outlines and C mark comparisons or classification; blue fills and M mark records just moved or swapped; green fills and S mark an ordered region or final positions explicitly described in the text. A locally ordered S region need not be globally final. White cells are unmarked. Each row matches a state in the written example; the text explains any intermediate comparisons omitted from the drawing.","reading_title":"How to study an entry","reading":["Each lesson first explains any small actions it needs, then connects them into a complete procedure. Move paper cards while following the example. After every swap, shift, group, or output, check that every card still exists. A complex method may take a second reading; the aim is to understand each action rather than memorize a name.","The cost section states the assumptions behind efficiency. Try duplicates, negative values, reverse order, and an empty input after reproducing the supplied trace. A stability claim applies to the described version, not automatically to every implementation with the same name.","Each lesson provides concrete operations, a complete small example, and necessary implementation cautions. References point to original papers, author implementations, university material, and NIST definitions. Each language edition has its own usable reference numbering."]}},"groups":{"zh":{"A":["一 键结构与分布条件下的方法","先看小整数键域与固定位数可达到的近线性层，再看依赖分布或前缀的桶与字符串方法。同层并列；输入键域、字符总量、桶均衡度改变次序。二进制快速排序是 MSD 的变体，字符串三向快排使用字符比较，不能对任意长文本宣称 O(n)。"],"B":["二 利用已有顺序的自适应方法","在少数长有序段条件下先看自适应归并；在少逆序条件下看插入。它们依据不同“近有序”指标，不互相给固定名次。随后看附带空间或随机条件的方法，以及仍可退化为平方工作的提取方法。最坏保障与自适应能力分别说明。"],"C":["三 通用比较排序与条件优化","一般大数组中，先讲保证或总体摊还 O(n log n) 的层；随后讲枢轴、输入结构等条件下高效但可能退化的方法。Shellsort 的界依增量而变。缓存、比较次数及大记录移动的优化单列于本组后部，度量不同，不按实际秒数强行排序。"],"E":["四 外存并行与受限输入的方法","本组不能与单核内存算法混排：外存按块读写轮次，CPU/GPU 按总工作与等待链，网络按比较器数与层数。先外存，后并行，再固定网络和特殊输入；这些是不同模型的分组，不是跨机器快慢名次。置换选择仅负责生成有序段。"],"D":["五 工作较多或操作受限的方法","先看梳与 Circle 等步幅或整遍方法，其总体界需按版本判断；然后是通常平方级的比较/移动层，最后是高次与超多项式递归。Cycle 可少写但比较仍多；Pancake 按整段翻转计费。平方层内以原理依赖安排，不能宣称每项必比后一项快。"],"F":["六 特殊模型与趣味方法","珠子、面条与计时器依赖额外模型，速度不能按普通比较排序衡量。后面的排列枚举、随机打乱和递归重试在常规机器上通常非常慢。趣味名称不改变保留元素和正确输出的要求；明确区分有限穷举与无有限最坏界的随机方法。"]},"en":{"A":["1 Methods using key structure and distribution","Begin with the near-linear tier for small integer domains and fixed-width keys, then examine distribution- and prefix-dependent methods. Methods within a tier are peers. Key range, total character count, and bucket balance change the order. Binary quicksort is an MSD variant; multikey quicksort compares characters and is not automatically linear for arbitrary long text."],"B":["2 Methods that use existing order","Start with adaptive merging under a few-long-runs condition, then insertion under a few-inversions condition. These are different measures of existing order and do not create a fixed rank against one another. Later entries use space or randomness assumptions, or extraction strategies that may still do quadratic work. Worst-case protection and adaptivity are separate properties."],"C":["3 General comparison sorts and conditional optimizations","For large arbitrary arrays, guaranteed or aggregate-amortized n log n methods precede methods whose efficiency relies on pivots or input structure. Shellsort bounds depend on its gaps. Cache behavior, comparison counts, and large-record movement receive separate treatment toward the end; these measures do not imply a measured timing rank."],"E":["4 External parallel and restricted-input methods","These models cannot share one timing list with serial in-memory sorting. Count block-transfer passes for external data, total work and dependency chains for CPU/GPU tasks, and comparators and layers for networks. External, parallel, network, and restricted-input entries are separate model groups. Replacement selection generates runs rather than completing the sort."],"D":["5 Higher-work and restricted-operation methods","Gap and full-pass methods appear first, with version-dependent total bounds. The quadratic comparison or movement tier follows, then high-degree and superpolynomial recursion. Cycle sort can reduce writes while retaining many comparisons. Pancake sorting charges for whole-prefix reversals. Order inside a tier follows learning dependencies rather than universal speed."],"F":["6 Special models and playful methods","Beads, rods, and timers rely on models outside ordinary comparison sorting. Permutation enumeration, random shuffling, and recursive retries usually become very slow on ordinary computers. Names do not relax correctness or record-preservation requirements. Finite exhaustive searches are distinguished from random methods with no finite worst-case bound."]}},"kinds":{"zh":{"algorithm":"算法","variant":"重要变体","family":"算法家族","phase":"辅助阶段","technique":"辅助技术","physical":"物理模型","joke":"趣味方法"},"en":{"algorithm":"Algorithm","variant":"Important variant","family":"Algorithm family","phase":"Supporting phase","technique":"Supporting technique","physical":"Physical model","joke":"Playful method"}},"trees":{"21":[[{"zh":["树构建完成","最初候选仅为根 1"],"en":["Tree after construction","Only root 1 is initially eligible"],"nodes":[["a",1,0.5,1,"C"],["b",3,0.2,0.55,""],["c",2,0.8,0.55,""],["d",4,0.65,0.08,""]],"edges":[["a","b"],["a","c"],["c","d"]]},{"zh":["输出 1 后","2 与 3 成为下一候选"],"en":["After emitting 1","2 and 3 become candidates"],"nodes":[["a",1,0.5,1,"S"],["b",3,0.2,0.55,"C"],["c",2,0.8,0.55,"C"],["d",4,0.65,0.08,""]],"edges":[["a","b"],["a","c"],["c","d"]]}],{"zh":"笛卡尔树与候选前沿 同一示例 [3,1,4,2]","en":"Cartesian tree and eligible frontier for [3,1,4,2]"}],"33":[[{"zh":["建堆后比较根与孩子","数组为 [4,2,3,1]"],"en":["Compare root and children","Array is [4,2,3,1]"],"nodes":[["a",4,0.5,1,"C"],["b",2,0.2,0.55,"C"],["c",3,0.8,0.55,"C"],["d",1,0.08,0.08,""]],"edges":[["a","b"],["a","c"],["b","d"]]},{"zh":["取出 4 后修复剩余堆","堆 [3,2,1]  输出后缀 [4]"],"en":["Heap after removing 4","Heap [3,2,1]; output suffix [4]"],"nodes":[["a",3,0.5,1,"M"],["b",2,0.2,0.55,""],["c",1,0.8,0.55,"M"]],"edges":[["a","b"],["a","c"]]}],{"zh":"堆的树形关系 节点只是同一数组的另一种画法","en":"Heap relationships: nodes show the same array, not additional records"}],"37":[[{"zh":["插入 3 后","右左形状"],"en":["After inserting 3","Right-left shape"],"nodes":[["a",1,0.22,1,""],["b",4,0.67,0.52,"C"],["c",3,0.48,0.08,"C"]],"edges":[["a","b"],["b","c"]]},{"zh":["在 4 处右旋","3 成为 1 的右孩子"],"en":["Rotate right at 4","3 becomes the right child of 1"],"nodes":[["a",1,0.2,1,""],["b",3,0.53,0.52,"M"],["c",4,0.82,0.08,"M"]],"edges":[["a","b"],["b","c"]]},{"zh":["再在 1 处左旋","3 升到根"],"en":["Then rotate left at 1","3 reaches the root"],"nodes":[["a",3,0.5,1,"M"],["b",1,0.17,0.45,"M"],["c",4,0.83,0.45,""]],"edges":[["a","b"],["a","c"]]}],{"zh":"伸展树的两次旋转 对应插入 3 的文字步骤","en":"Two splay rotations for the example insertion of 3"}]}}</script>
