const basics={zh:[
 ['先数清楚：四张纸为什么还是四张',['拿四张小纸，分别写 4、1、3、2。一张纸就是一条东西；我们暂时叫它“记录”。先拿一张，再拿一张，就是两张：1+1=2。再加两张，一共四张。纸上写的 4 不是“有四张纸”，它只是这张纸的数值。','我们要按纸上的数字，从小到大摆：1、2、3、4。换位置不会增加或减少纸。因此结束时仍应有四张，数字也各出现一次。这个动作叫排序。','方括号只是把一排数字框起来。[4,1,3,2] 的意思是：左起依次放着 4、1、3、2，不是做加法。','从小到大允许相等的挨着。[1,1,2,3] 也排好了。两张写着 1 的纸都得留下。']],
 ['看懂长条：高低是数值，左右是位置',['动画把每张纸画成一根竖条。4 的条比 1 高，因为 4 比 1 大。数字写在条上，你不用凭高度猜。','长条从左到右对应刚才纸的位置。条向左或向右移动，表示纸换了位置；它的数字不会跟着改变。排完以后，高度从左向右逐渐升高，等值的高度相同。','这两件事要分开：高度回答“它多大”，左右位置回答“它现在在哪”。一个 4 站在第一格，仍然是 4，不是 1。','电脑里常从 0 给位置编号。本节用 0、1、2、3 说明四格左起的格号；格号 0 就是从左数第一个位置，里面的数值仍是 4，不是 0。有的算法例子也写“第 0 格、第 1 格”，这里指格号：第 1 格是从左数第二个位置。读例子时先看它怎样编号。动画下方的小标签 1、2、3、4 始终表示从左数第几个位置，条上的大数字才是数值。','现在打开下面的“先认识长条”。先不排序，只看四根。关掉动画标签页，就能回到这里。']],
 ['比较：只问大小，不移动',['看 4 和 1，问一句：4 比 1 大吗？答案是“是”。这叫比较。比较是看一眼、得出答案；它本身不换两张纸的位置。','4>1 中的 > 表示“大于”。1<4 中的 < 表示“小于”。2=2 中的 = 表示“一样大”。4≥4 的 ≥ 是“大于或者等于”。你也可以直接读成一句话，不必先记符号。','如果想从小到大排，看到左边 4、右边 1，就知道这两张的左右关系不对。知道不对以后，还要另做一个动作，才能改正。']],
 ['交换：两张纸互换位置',['[4,1,3,2] 中，把第一张 4 和第二张 1 交换，变成 [1,4,3,2]。4 去了 1 的地方，1 去了 4 的地方，两张都还在。','在桌上你可以左右手各拿一张。在电脑里，可以先把 4 暂存起来，把 1 写到原来 4 的格，再把暂存的 4 写到原来 1 的格。暂存是为了别把 4 盖掉。','只做这次交换还没排完：4 仍然在 3 前面。每一种算法都要告诉我们接下来检查哪里，并在有把握全部正确时停止。']],
 ['移动：给手里那张腾位置',['把 [2,4,3] 里的 3 拿到手里，桌上成为 [2,4,空]。4 比手里的 3 大，便把 4 向右挪到空位，得到 [2,空,4]；再把 3 放入空位，得到 [2,3,4]。','这不是只交换相邻两张。关键是：手里那张一直被保管着；空位随搬动往左走。只看桌上短暂少了一张，并不代表记录丢了。','电脑的复制动作可能暂时让两个格都写着 4。学习时把已经让出的格画成“空”，可以更容易追踪每一条记录。最后要检查桌上加手里总共仍是原来的那些纸。']],
 ['“这一小排排好了”还不是“以后不再动”',['[2,4,3,1] 的左边 [2,4] 是从小到大的，这叫内部有序。但最后那个 1 到来后，还要站到 2 前面；2 和 4 的位置会改变。','所以绿色标记会有两种意思，必须看旁边的字：插入里的绿色是“小排内部有序”，冒泡或选择某一步的绿色可能是“最终位置已确定”。颜色自己不能告诉你是哪一种。','只有整排每个相邻关系都正确，而且原来的记录一条不少，才算完整排序完成。']],
 ['相等的两张，也可能是不同东西',['给两张写着 2 的纸加名字：2甲、2乙。甲原来在乙前面。[2甲,1,2乙] 可以按数字排成 [1,2甲,2乙]，也可能变成 [1,2乙,2甲]。两种数字顺序都对。','如果要求甲仍在乙前面，这个要求叫“稳定”：相同数值的记录，保留原来的先后。名字只帮助辨认身份，不用拿来比较大小。','排序一份成绩名单时，分数是“键”，姓名和其他信息跟着同一条记录一起走。不能只改分数而把姓名留在原地。']],
 ['一套方法，需要“做什么”和“何时结束”',['“把数字排好”只是目标，还没有告诉别人怎么做。算法是一套可以照着执行的方法：当前看哪张，比较谁，满足什么条件就移动，下一步去哪，最后怎么结束。','我们先学插入、选择、冒泡、归并、快速和计数。六种方法够你认识核心动作。后面许多方法是把这些动作结合、减少重复工作，或适应特殊的数据和机器。','每种方法先读思路，再做小例子；先能解释动作，最后才看快慢和符号。遇到不懂的名词，点“基础补充”，找到对应小节，再回来。']]
],en:[
 ['Four cards must remain four cards',['Take four pieces of paper and write 4, 1, 3, and 2 on them. Each card is one item, also called a record. One card plus one card makes two: 1+1=2. Add two more and you have four cards. The number 4 on one card is its value, not the number of cards.','Our goal is to arrange them as 1, 2, 3, 4. Changing positions must not add or remove cards. This rearrangement is sorting.','Square brackets describe a row. [4,1,3,2] says that these values appear in that left-to-right order. It is not an addition.','Equal values are allowed. [1,1,2,3] is ordered too. Both cards labeled 1 must survive.']],
 ['Read the bars: height and position mean different things',['The animation draws one vertical bar for each card. A 4 is taller than a 1 because its value is greater. The printed value removes any need to guess from height.','A bar moving left or right means its card changes position. Its value stays the same. After sorting, heights rise from left to right; equal values have equal height.','Height answers “How large is it?” Horizontal position answers “Where is it now?” A 4 in the first slot is still a 4.','Computers often number positions starting at zero. Here the four positions have indices 0,1,2,3 from the left. Index 0 is the first position, whose value is still 4, not 0. A walkthrough that uses slot 0 and slot 1 means numbered slots: slot 1 is the second position from the left. Check the numbering used in that example. The animation’s small labels 1,2,3,4 always count positions from the left. The large numbers on the bars are their values.','Open Read the bars below. Do not sort yet. Look at the four records, then close that animation tab to return here.']],
 ['A comparison asks a question',['Look at 4 and 1. Is 4 greater than 1? Yes. That question and answer are a comparison. Looking does not move either card.','The sign > means greater than, < means less than, and = means equal. The sign ≥ means greater than or equal to. You can read each as ordinary words.','When the larger card is on the left, that pair is in the wrong order for an ascending result. Finding the problem is one action; changing positions is another.']],
 ['An exchange changes two positions',['Exchange the first two cards of [4,1,3,2]. The row becomes [1,4,3,2]. Each card takes the other card’s place, and both survive.','On a table, use two hands. In a computer, save 4 temporarily, write 1 into the first slot, and write the saved 4 into the second slot. Saving prevents the first write from losing 4.','That exchange does not finish sorting: 4 is still before 3. A full method must say where to look next and when it is safe to stop.']],
 ['A move can open a gap',['From [2,4,3], hold 3 in your hand. The table reads [2,4,empty]. Since 4 is greater than the held 3, move 4 right into the empty slot: [2,empty,4]. Place 3 in the gap: [2,3,4].','The important idea is keeping the held card safe while the gap moves left. A record temporarily outside the main row has not disappeared.','A computer may copy 4 and temporarily leave its old bits behind. The teaching display marks the vacated slot empty so each record is easy to follow. Count records in the row and in the hand together.']],
 ['An ordered part may still move later',['The beginning [2,4] of [2,4,3,1] is internally ordered. But the final 1 will eventually need to go before 2, moving that beginning.','Read the text next to a green mark. It may mean “this part is internally ordered” or “this record has reached its final position.” Color alone cannot distinguish them.','The full task is complete only when the entire row is ordered and every original record remains.']],
 ['Equal values can belong to different records',['Label two twos as 2A and 2B, with A originally first. Sorting [2A,1,2B] could give [1,2A,2B] or [1,2B,2A]. Both value sequences are ordered.','Keeping A before B is an additional property called stability. Equal-key records retain their original order. Identity labels help us watch this; they are not extra values being compared.','In a list of students, the score may be the key: the value used for sorting. The name and other fields must travel with that score as one complete record.']],
 ['A method needs instructions and a stopping rule',['“Put the numbers in order” gives a goal but no procedure. An algorithm gives repeatable instructions: which item to inspect, what to compare, when to move it, where to go next, and when to stop.','We begin with insertion, selection, bubble, merge, quick, and counting sort. Later methods combine their ideas, avoid repeated work, or suit special data and machines.','Read the idea, carry out a small example, and explain the actions before studying timing symbols. Use Foundations for a new term and then return to your lesson.']]
 ]};
const practice={
 11:{zh:['轮到你：空位往哪边走？','[2,4,3] 中把 3 拿在手里。下一步搬谁？搬完后空位在哪？为什么不用把 2 也往右挪？','把 4 右移，桌上成为 [2,空,4]。空位在中间。2 不大于手里的 3，且前面小排原本有序，所以 3 放在 2 后面就可以。不是每一项都要搬。'],en:['Your turn: where does the gap go?','Hold 3 from [2,4,3]. Which record moves next? Where is the gap afterward? Why does 2 stay?','Move 4 right: [2,empty,4]. The gap is in the middle. Since 2 is no greater than 3 and the old beginning was ordered, place 3 after 2. Not every record must move.']},
 41:{zh:['轮到你：候选是不是最后答案？','[4,3,1,2] 中，先把 4 当作目前最小。看过 3 后，候选变成 3。现在能把 3 放到最前面并结束这一轮吗？','不能。还没有看后面的 1 和 2。候选只是“目前看过的最小”，把所有未完成项都看过以后，才有把握它是整段最小。最终选 1，与最前面的 4 交换成 [1,3,4,2]。'],en:['Your turn: is the candidate final?','In [4,3,1,2], start with 4 as the minimum candidate. After seeing 3, the candidate is 3. Can this round finish now?','No. The unseen 1 and 2 may be smaller. A candidate is the smallest seen so far. After inspecting the whole unfinished region, choose 1 and exchange with 4: [1,3,4,2].']},
 43:{zh:['轮到你：这一轮确定了谁？','从 [4,1,3,2] 开始，从左往右比较相邻两项，左边更大就交换。完整一轮后会是什么？下一轮哪一项不用再碰？','4 和 1 交换成 [1,4,3,2]；4 和 3 交换成 [1,3,4,2]；4 和 2 交换成 [1,3,2,4]。最大值 4 已到最右端，下一轮不用再碰它，但 [1,3,2] 仍要排。'],en:['Your turn: what does one round finish?','Start with [4,1,3,2]. Compare neighbors from left to right and exchange when the left value is greater. What remains after a full round?','The exchanges give [1,4,3,2], then [1,3,4,2], then [1,3,2,4]. The maximum 4 is finished at the right edge. The remaining [1,3,2] still needs sorting.']},
 22:{zh:['轮到你：为什么只看两个开头？','把已经有序的 [1,4] 和 [2,3] 合起来。第一张应该取谁？取完后下一步比较谁？为什么不一开始就比较 4 和 3？','先比较 1 和 2，取 1。接着比较左边剩下的开头 4 和右边开头 2，取 2。各小排已经有序，开头就是该排剩余最小的数，所以只需比较两个开头；不是随便忽略其他数。'],en:['Your turn: why compare only two heads?','Merge the ordered rows [1,4] and [2,3]. Which record comes first? What comparison follows? Why not compare 4 and 3 immediately?','Compare 1 and 2 and take 1. Then compare the remaining heads, 4 and 2, and take 2. Each head is the smallest remaining record of its already ordered row.']},
 26:{zh:['轮到你：分成两边就排完了吗？','以 3 当标尺，一次分区得到 [2,1,3,5,4]。哪一项已经固定？还要处理什么？','3 已固定：左边都不大于 3，右边都大于 3。但左边 [2,1]、右边 [5,4] 各自仍乱，必须分别继续排。分区解决的是两组之间的关系，不会自动解决组内关系。'],en:['Your turn: does partitioning finish everything?','A partition around 3 produces [2,1,3,5,4]. Which item is finished? What remains?','The pivot 3 is fixed. Every left value is no greater, and every right value is greater. But [2,1] and [5,4] still need sorting internally. Group separation does not order each group.']},
 1:{zh:['轮到你：次数不是新造出来的纸','[3,1甲,2,1乙] 中，1 有两条。累计数量 [2,3,4] 表示什么？从右边取 1乙时应该放到第几格？','累计数量说明：值不超过 1 的有 2 条，不超过 2 的有 3 条，不超过 3 的有 4 条。格号从 0 开始，所以 1乙 放到格号 1，即从左数第二格；1甲 后来放到格号 0。每条原记录各放一次，等值的顺序也保留下来。'],en:['Your turn: counts do not create new cards','For [3,1A,2,1B], running totals are [2,3,4]. What do they mean? Where should the rightmost 1B go?','There are 2 records at most 1, 3 records at most 2, and 4 records at most 3. With zero-based slots, 1B goes to index 1, the second slot from the left. Later 1A takes index 0. Every original record is placed once, with equal-key order preserved.']}

function animationLink(id,lesson=3){const name=anim[id]||'bubble',values=samples[id]||[4,1,3,2];return `排序动画_从零开始.html#algo=${name}&lang=${lang}&data=${values.join(',')}&lesson=${lesson}`;}
function watch(id,lesson=3){return `<div class="callout">${p(t('先猜下一步会发生什么，再点一次检查。第一次用“下一步”，不要急着连续播放。','Predict the next action, then check one step. Use Next before continuous playback.'))}<a target="_blank" rel="noopener" href="${animationLink(id,lesson)}">${e(lesson===1?t('先认识长条 →','Read the bars →'):lesson===2?t('看比较和交换 →','Watch comparing and exchanging →'):t('看对应动画 →','Open the matching animation →'))}</a><p class="minor">${e(t('动画会在新标签页打开。看完关掉该标签页，或点浏览器里的原手册标签，就回到当前小节。','The animation opens in a new tab. Close that tab, or select this manual’s tab, to return to the same section.'))}</p></div>`;}
function diagram(d){let out='';if(d.visual){out+=`<figure class="diagram"><figcaption>${e(t('同一例子的步骤图','Steps from the same example'))}</figcaption><p class="legend">${e(t('C = 正在比较；M = 刚移动；S = 有序区域。S 是否为最终位置，以每行文字为准。','C = comparing; M = moved; S = ordered region. The row text says whether a position is final.'))}</p>`;for(const r of d.visual.rows){out+=`<div class="diagram-row"><div class="row-label">${e(r[lang])}</div><div class="numbers">${r.values.map((v,i)=>{let c='',tag='';if((r.active||[]).includes(i)){c='compare';tag='C'}else if((r.moved||[]).includes(i)){c='move';tag='M'}else if((r.fixed||[]).includes(i)){c='ordered';tag='S'}return `<span class="number ${c}">${e(v)}${tag?`<small>${tag}</small>`:''}</span>`}).join('')}</div></div>`;}out+='</figure>';}
 if(B.trees[d.id]){const [frames,caption]=B.trees[d.id];out+=`<figure class="diagram tree"><figcaption>${e(caption[lang])}</figcaption>`;for(const f of frames){const coords=Object.fromEntries(f.nodes.map(n=>[n[0],[40+n[2]*450,45+(1-n[3])*210]]));out+=`<p class="row-label">${e(f[lang].join(' — '))}</p><svg viewBox="0 0 530 290" role="img" aria-label="${e(f[lang].join(', '))}">`;for(const [a,b] of f.edges){out+=`<line x1="${coords[a][0]}" y1="${coords[a][1]}" x2="${coords[b][0]}" y2="${coords[b][1]}"/>`;}for(const n of f.nodes){const[x,y]=coords[n[0]];out+=`<circle class="${n[4]}" cx="${x}" cy="${y}" r="24"/><text x="${x}" y="${y+6}" text-anchor="middle">${e(n[1])}</text>`;if(n[4])out+=`<text x="${x+30}" y="${y+6}">${n[4]}</text>`;}out+='</svg>';}out+=`<p class="legend">${e(t('C 比较；M 移动；S 已输出。线表示父子关系，不是额外的记录。','C comparing; M moved; S emitted. Lines show parent-child relationships, not extra records.'))}</p></figure>`;}return out;
}

function section(d,k){const a=d[lang][k];return `<h2>${e(headings[lang][k])}</h2>`+(Array.isArray(a)?(k==='foundation'?paras(a):list(a)):p(a));}

function prerequisites(d){const indices=[0,1,4,5,6];if(/tree|heap|cartesian|splay|树|堆/i.test(d.en_title+' '+d.zh_title))indices.push(10,11);if(/merge|归并/i.test(d.en_title))indices.push(7,8);if(/radix|bucket|基数|桶/i.test(d.en_title+' '+d.zh_title))indices.push(12);if(/binary|insertion|二分/i.test(d.en_title))indices.push(13);return `<details><summary>${e(t('遇到陌生的小动作，补这几节','If a small action is unfamiliar, review these sections'))}</summary><div><ul>${[...new Set(indices)].map(i=>`<li><a href="#view=foundation&item=${i}&lang=${lang}">${e(B.front[lang].primer[i][0])}</a></li>`).join('')}</ul>${p(t('阅读补充以后，用浏览器“返回”回到刚才的小节。这里的链接都留在总手册内。','After a supplement, use your browser’s Back button to return. These links stay within the master manual.'))}</div></details>`;}

 ])}<h2>${e(t('文件都从这里进入','Open every file from here'))}</h2><ul><li><a target="_blank" rel="noopener" href="排序动画_从零开始.html#lang=${lang}">${e(t('离线排序动画：六种基础方法','Offline animations: six basic methods'))}</a></li><li><a target="_blank" rel="noopener" href="排序算法学习手册_中文版.pdf">${e(t('中文完整参考册','Complete Chinese reference'))}</a></li><li><a target="_blank" rel="noopener" href="Sorting_Algorithms_Learning_Manual_English.pdf">Complete English reference</a></li></ul><details><summary>${e(t('可选的联网补充工具：VisuAlgo','Optional online supplement: VisuAlgo'))}</summary><div>${p(t('这不是必需的。想看另一个现成演示，可打开 VisuAlgo，选“排序”、算法和输入，再播放。它适合在你已看懂基础动作以后补看；外部页面的按钮和语言可能更新。先用本包动画即可。','This is optional. VisuAlgo provides another existing sorting demonstration. Choose Sorting, a method, and an input, then play. Use it after learning the small actions here; its controls may change. The package’s own animation is sufficient for the beginner route.'))}<a target="_blank" rel="noopener" href="https://visualgo.net/${lang==='zh'?'zh':'en'}/sorting">VisuAlgo</a></div></details>`;}
function efficiencyContent(){const f=B.front[lang];return `<h1>${e(t('快慢，先从实际要做几次看起','Understand speed by counting the actions'))}</h1>${paras(lang==='zh'?[
 '同样四张纸，有的方法需要来回搬很多次，有的方法先找准位置再搬。我们关心的不是算法名字听起来厉不厉害，而是完成同一任务要比较、移动、分配、读写多少次。',
 '拿已经有序的 [1,2,3,4] 给插入排序：每个新数看一次左边就停，只比较三次，完全不用搬。拿 [4,3,2,1] 给它：要让位 1 次、2 次、3 次，一共 6 次。相同方法，因为数据不同，工作量也不同。',
 '“数据变成两倍，需要做的事大约变成几倍？”这是增长问题。要读每条记录一次，大约两倍；每条都和很多其他条比，可能接近四倍；把大排不断分成两半，有多少层取决于要分几次。这些事情懂了，再看符号。',
 '先固定条件再比较：记录数量、是否已经有序、重复多少、键的类型与范围、是否要稳定、内存大小、几个人同时做、是否算硬盘读写。外存、GPU、并行和物理模型各有自己的账，不能和单人桌面排序直接排成一条总名次。'
 ]:[
 'For the same four cards, one method may move records repeatedly while another finds destinations first. Compare the amount of checking, movement, storage, and reading needed for the same task.',
 'Insertion sort on [1,2,3,4] makes three checks and no shifts. On [4,3,2,1], it shifts 1, then 2, then 3 records: six shifts. The method is unchanged; the input changes its work.',
 'Ask what happens when the record count doubles. Reading every record once roughly doubles the work. Comparing each record with many others can make work grow about fourfold. Repeated halving creates several levels. Understand those actions before memorizing symbols.',
 'Hold the conditions fixed: record count, existing order, duplicates, key type and range, required stability, memory, workers, and included disk transfers. External, parallel, GPU, and physical methods use different cost models and cannot share one universal timing rank.'
 ])}<details><summary>${e(t('看懂增长后，再展开符号和效率分组','After growth makes sense, open the notation and tiers'))}</summary><div>${p(f.cost_intro)}<div class="table-wrap"><table>${f.growth.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'}>${e(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table></div>${paras(f.cost_notes)}<h2>${e(t('只能在这些条件下分层','Tiers under stated conditions'))}</h2><div class="table-wrap"><table>${f.rank.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'}>${e(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table></div>${p(f.navigation)}</div></details>`;}
function chooseContent(){return `<h1>${e(t('基础动作懂了，再选择下一条路','Choose a next path after the basics'))}</h1>${p(t('你不需要一次学完 80 条。先确认自己能解释六种基础方法，再按下面的问题选。每个名字点开后都是完整章节；每章开头会补它需要的基础。','You do not need all 80 entries at once. First explain the six basic methods. Then choose a path by the question below. Every linked name opens a complete lesson with its own foundations.'))}<ul>${[
 [t('想知道怎样少做无用工作：','How can existing order reduce work? '),[12,15,16,17]],
 [t('想知道树和堆怎样帮忙：先点基础补充的树、堆，再看 ','How do trees and heaps help? Review their foundations, then read '),[33,35,36,37]],
 [t('键是小整数或固定位数：','The keys are small integers or fixed-width numbers: '),[2,3,4,78,5]],
 [t('想知道真实通用实现如何防止极慢情况：','How do practical general sorts avoid bad cases? '),[28,30,31,18]],
 [t('数据大到装不下，或多人一起排：','The data does not fit, or workers sort together: '),[54,57,59,60,61,62]],
 [t('只能按固定线路或特殊动作排：','Fixed circuits or restricted operations: '),[63,64,80,50,51]],
 [t('其余冷门与趣味方法：读完整目录中对应分组，不必优先。','For less common and playful methods, use their catalog groups when interested. '),[68,69,70,71,72,73,74]]
 ].map(([text,ids])=>`<li>${e(text)}${ids.map(id=>`<a href="#view=algorithm&item=${id}&lang=${lang}">${e(byId[id][lang+'_title'])}</a>`).join(' · ')}</li>`).join('')}</ul>${p(t('这里是学习顺序，不是速度排行榜。完整目录按效率条件分组，你可以从“怎么比较快慢”读清楚分组的理由。','This is a learning order, not a speed ranking. The catalog groups methods by efficiency conditions; How speed compares explains those conditions.'))}`;}
function routeContent(r){if(r.type==='welcome'){return `<h1>${e(t('你只需要从这一页开始','Start with this one page'))}</h1>${paras(lang==='zh'?[
 '先不用背算法名，也不用看代码。我们从四张写着数字的纸开始，一次只搞懂一个动作。',
 '这不是给你一摞文件让你自己找路。眼前这个是总手册，全部 80 个条目的讲解都在里面；动画和两份 PDF 只在需要时打开。先点“下一小节”，我会告诉你接下来做什么。',
 '第一次学习顺序是：准备工具 → 看完整目录这个地图 → 看懂数字和动作 → 插入 → 选择 → 冒泡 → 归并 → 快速 → 计数 → 挑进阶方向。每种方法分成思路、步骤、数字例子、自己试一试。',
 '不用按天赶进度。一个动作能用自己的话说清楚，再往下走。停下来并不浪费时间；只要下一次点“继续入门路线”，就能接着学。'
 ]:[
 'You do not need algorithm names or code yet. Start with four numbered cards and understand one action at a time.',
 'This is the master manual, not a pile of files to navigate alone. It contains all 80 full lessons. Open the animations or PDFs only when they help. Next section tells you what to do next.',
 'The first route is tools, the complete catalog as a map, basic actions, insertion, selection, bubble, merge, quick, counting, and a choice of advanced paths. Each method has an idea, a procedure, a numeric walkthrough, and a question.',
 'There is no daily deadline. Move on after explaining the action in your own words. Continue beginner route brings you back when you return.'
 ])}<div class="route-map">${p(t('本节只做一件事：拿四张纸、一支笔，然后点右下方“下一小节”。没有纸也可以先看动画。','For now, get four cards and a pen, then choose Next section. You can begin with the animation if paper is unavailable.'))}</div>`;}if(r.type==='tools')return toolsContent();if(r.type==='catalog')return catalogContent();if(r.type==='basic'){const [title,body]=basics[lang][r.index];return `<h1>${e(title)}</h1>${paras(body)}${r.index===1?watch(43,1):r.index===3?watch(43,2):''}`;}
 if(r.type==='algo'){const d=byId[r.id],st=r.stage;let out=`<h1>${e(d[lang+'_title'])}</h1>${meta(d)}`;if(st==='idea')out+=section(d,'foundation')+section(d,'idea');if(st==='steps')out+=section(d,'steps')+p(t('先不用一次记全。在纸上走一遍，下一小节会把这些指令接到具体数字上。','Do not memorize the whole procedure now. Try it with cards; the next section applies these instructions to actual numbers.'));if(st==='example')out+=section(d,'example')+diagram(d)+watch(d.id);if(st==='practice'){const [title,q,answer]=practice[d.id][lang];out+=`<div class="question"><h2>${e(title)}</h2>${p(q)}${p(t('先自己想或摆纸，再展开答案。猜错时，回到上一小节看看是哪一个动作没跟上。','Think or use cards before opening the answer. If your prediction differs, revisit the previous section to find the missed action.'))}<details><summary>${e(t('我想过了，看看解释','I have tried: show the explanation'))}</summary><div>${p(answer)}</div></details></div>`+section(d,'why')+section(d,'use')+`<details><summary>${e(t('可选：现在看工作量和容易错的细节','Optional: work and implementation details'))}</summary><div>${section(d,'cost')}${section(d,'details')}${sources(d)}</div></details>`;}return out;}
 if(r.type==='choose')return chooseContent();return `<h1>${e(t('现在检查：你能自己做了吗？','Check whether you can perform the method yourself'))}</h1>${paras(lang==='zh'?[
 '拿四张纸写 5、2、4、1。任选刚学的方法，不看动画，按它的步骤摆一遍。每次动作都说一句：我在比较谁，为什么移动，哪一小排已排好，为什么可以停。',
 '再换成 [2甲,1,2乙,1丙]。看看你是否保留了全部四张，结果是否从小到大，以及相等记录是否保持原先后。不能只看数字顺序。',
 '如果说不清，先回到那种方法的数字例子，不必重新读全部手册。能说清之后，用“完整目录”继续感兴趣的方向，或用“基础补充”学习树、堆、二分、递归等小工具。',
 '资料以后可以整理进一个 GitHub 总仓库，按主题分文件夹。一个主题里把总入口、中文英文文件、动画和图片放一起。等某个主题成为独立课程或工具时，再考虑单独仓库。现在的文件夹可以直接保存。'
 ]:[
 'Write 5, 2, 4, and 1 on four cards. Choose a method and perform it without the animation. At each action, explain the comparison, movement, ordered region, and stopping reason.',
 'Try [2A,1,2B,1C]. Check that all four records survive, values are ordered, and any promised equal-key order remains. Ordered numbers alone are not a complete check.',
 'If one action is unclear, revisit that method’s numeric walkthrough. You do not need to restart the whole manual. Then choose another catalog entry or learn small tools such as trees, heaps, binary search, and recursion in Foundations.',
 'For future study materials, one GitHub repository organized by topic is a practical starting point. Keep each topic’s entry file, languages, animations, and images together. A topic that becomes an independent course or tool may later deserve its own repository.'
 ])}<a href="#view=catalog&lang=${lang}">${e(t('进入完整目录 →','Continue to the complete catalog →'))}</a>`;}
function persist(){try{localStorage.setItem('sorting-learning-route',JSON.stringify({lang,step:savedStep}));}catch{}}
function hash(){return '#'+new URLSearchParams({view,lang,item:String(view==='route'?step:view==='algorithm'?current:foundation)}).toString();}
function navigate(v,item=0){view=v;if(v==='route'){step=Math.max(0,Math.min(route.length-1,Number(item)||0));savedStep=step;}if(v==='algorithm')current=byId[item]?Number(item):11;if(v==='foundation')foundation=Math.max(0,Math.min(17,Number(item)||0));persist();location.hash=hash();render();window.scrollTo({top:0,behavior:'instant'});}
function parseHash(){const q=new URLSearchParams(location.hash.slice(1));if(q.has('lang'))lang=q.get('lang')==='en'?'en':'zh';const v=q.get('view');if(['route','algorithm','foundation','catalog','efficiency','files','foundations'].includes(v))view=v;const item=Number(q.get('item')||0);if(view==='route'&&q.has('item')){step=Math.max(0,Math.min(route.length-1,item));savedStep=step;}if(view==='algorithm')current=byId[item]?item:11;if(view==='foundation')foundation=Math.max(0,Math.min(17,item));persist();}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=t('从这里开始 · 排序学习手册','Start here · Sorting learning manual');el('brand').textContent=t('排序，从最小的动作学起','Sorting, one small action at a time');for(const[l,z,en]of[['start','回到起点','Start'],['resume','继续入门路线','Continue beginner route'],['catalog','完整目录','Complete catalog'],['foundations','基础补充','Foundations'],['efficiency','怎么比较快慢','How speed compares'],['files','工具与文件','Tools and files']])el(l).textContent=t(z,en);el('zh').setAttribute('aria-pressed',String(lang==='zh'));el('en').setAttribute('aria-pressed',String(lang==='en'));el('pace').textContent=t('能解释这一小步，再往下走。你可以随时停下来。','Continue when you can explain this small step. You can stop at any time.');el('footer').textContent=t('自制步骤图和数字例子 · 80 个完整学习条目 · 六种离线动画 · 中文与英文完整独立内容 · 2026 年 10 月 5 日','Original diagrams and numeric examples · 80 full learning entries · Six offline animations · Complete Chinese and English content · 5 October 2026');let body='';if(view==='route'){body=routeContent(route[step]);el('position').textContent=t(`入门路线 · 第 ${step+1} / ${route.length} 小节`,`Beginner route · Section ${step+1} of ${route.length}`);}else if(view==='algorithm'){body=fullAlgorithm(byId[current]);el('position').textContent=t('完整章节 · 想接着入门，点上面的“继续入门路线”','Full lesson · Continue beginner route resumes the guided course');}else if(view==='catalog'){body=catalogContent();el('position').textContent=t('完整地图 · 按有条件的效率分组','Complete map · Grouped by efficiency conditions');}else if(view==='files'){body=toolsContent();el('position').textContent='';}else if(view==='efficiency'){body=efficiencyContent();el('position').textContent='';}else if(view==='foundation'){const[title,bodyList]=B.front[lang].primer[foundation];body=`<h1>${e(title)}</h1>${paras(Array.isArray(bodyList)?bodyList:[bodyList])}`;el('position').textContent=t('基础补充 · 看完用浏览器“返回”回到刚才位置','Foundation supplement · Use browser Back to return to your lesson');}else{body=`<h1>${e(t('基础补充：哪里不懂，就补哪里','Foundations: review only what you need'))}</h1>${p(t('每节只讲一个小工具。树、堆、递归、二分等词在这里从头解释，不要求你有算法基础。点进去看完，用浏览器“返回”即可回到这张清单；再点“继续入门路线”。','Each section introduces a small tool from the beginning. No algorithm background is assumed. Open one, then use browser Back to return to this list. Continue beginner route restores your course.'))}<ol>${B.front[lang].primer.map(([title],i)=>`<li><a href="#view=foundation&item=${i}&lang=${lang}">${e(title)}</a></li>`).join('')}</ol>`;el('position').textContent='';}el('content').innerHTML=body;el('prev').disabled=view==='route'&&step===0;el('prev').textContent=view==='route'?t('← 上一小节','← Previous section'):t('← 回到入门路线','← Beginner route');el('next').disabled=view==='route'&&step===route.length-1;el('next').textContent=view==='route'?t('下一小节 →','Next section →'):t('继续入门路线 →','Continue beginner route →');if(view==='algorithm'){const i=B.entries.findIndex(d=>d.id===current);el('position').textContent=t(`完整条目 ${i+1} / 80 · 可按本组顺序继续读`,`Complete entry ${i+1} of 80 · Continue through the catalog order`);el('prev').disabled=false;el('prev').textContent=i===0?t('← 完整目录','← Complete catalog'):t('← 上一条','← Previous entry');el('next').disabled=i===B.entries.length-1;el('next').textContent=t('下一条 →','Next entry →');}for(const b of el('content').querySelectorAll('[data-algorithm]'))b.addEventListener('click',()=>navigate('algorithm',Number(b.dataset.algorithm)));}
el('prev').onclick=()=>{if(view==='algorithm'){const i=B.entries.findIndex(d=>d.id===current);i===0?navigate('catalog'):navigate('algorithm',B.entries[i-1].id);}else navigate('route',view==='route'?step-1:savedStep);};el('next').onclick=()=>{if(view==='algorithm'){const i=B.entries.findIndex(d=>d.id===current);if(i<B.entries.length-1)navigate('algorithm',B.entries[i+1].id);}else navigate('route',view==='route'?step+1:savedStep);};el('start').onclick=()=>navigate('route',0);el('resume').onclick=()=>navigate('route',savedStep);el('catalog').onclick=()=>navigate('catalog');el('foundations').onclick=()=>navigate('foundations');el('efficiency').onclick=()=>navigate('efficiency');el('files').onclick=()=>navigate('files');for(const l of ['zh','en'])el(l).onclick=()=>{lang=l;persist();location.hash=hash();render();};window.addEventListener('hashchange',()=>{parseHash();render();window.scrollTo({top:0,behavior:'instant'});});parseHash();render();
window.sortingManual={getState:()=>({lang,view,step,savedStep,current,foundation,routeLength:route.length}),navigate,entries:B.entries,route};
})();
</script>
