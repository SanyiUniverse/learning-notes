ancestor tests, and extraction paths must use one matched convention. Flipping a bit changes child roles rather than reversing the array."},"sources":[{"title":"Edelkamp & Wegener: weak-heapsort analysis","url":"https://eccc.weizmann.ac.il/report/1999/028/download/"},{"title":"Edelkamp et al.: Weak heaps engineered","url":"https://www.sciencedirect.com/science/article/pii/S1570866713000592"},{"title":"Katajainen: weak-heap variants and applications","url":"https://hjemmesider.diku.dk/~jyrki/Myris/EEK2012bJ.html"}],"seq":27,"refnos":[48,49,50]},{"id":35,"group":"C","zh_title":"锦标赛排序","en_title":"Tournament sort","kind":"algorithm","zh_alias":"胜者树排序；淘汰赛排序","en_alias":"Winner-tree sort; tournament-tree sorting","zh":{"foundation":["想成淘汰赛，比较两位选手时小的赢。比赛只记录谁赢，不会把输的原记录删除。","树的叶子是最下层没有孩子的位置，每条原记录占一个叶子。上面的比赛位置存“哪个叶子赢”，不是多出一份要输出的记录。","某叶子退出后，只有通向顶端的比赛曾依赖它；别的比赛结果仍有效。所以不用从头比较所有选手。","退出用“活跃/不活跃”标记表示，不要随便拿一个数字当永远最大；输入可能真的包含那个数字。"],"idea":"先让相邻记录两两比赛，再让胜者两两比赛，直到顶端记录最小项。把这一项输出并让其叶子退出，仅重打它向上的比赛。顶端就指出下一最小项，反复输出直到没有活跃记录。","steps":["选择叶子数 P，为不小于 n 的最小二的整数次幂（1、2、4、8、16…之一），n 是输入项数。可以用树格子编号：根为 1，孩子为 2v、2v+1，叶子为 P..2P−1。前 n 个叶子指向原记录，剩余叶子标不活跃。空输入直接结束。","定义一次比赛。两个孩子都不活跃，就让父不活跃；只有一个活跃，就让父记它的记录编号；两个都活跃就比较记录值，父记较小者的原编号。若相等，用原始输入编号较小者获胜，以保留先来先输出。","从最后父位置 P−1 倒着到 1 做比赛。孩子的结果先做好，父才有正确候选；根最后存着全体冠军的记录编号。","读取根编号，输出那条完整原记录。把对应叶子设不活跃，不能仅清掉根；否则下层还会把同一条推上来。","从这个叶子的父位置开始，重新比较它两个孩子的当前结果，再往父的父走，直到根。这些编号每次除以二向下取整。","根若还有活跃编号，就输出新冠军、退出、更新路径；输出 n 条或根不活跃就结束。输出缓冲只按这些冠军逐条增加，比赛树内编号不再额外输出。"],"example":["输入 [4,1,3,2]，P=4。叶子位置 4、5、6、7 分别指原记录 0、1、2、3。位置 2 比叶子 4、5 的 4、1，记原编号 1；位置 3 比 3、2，记原编号 3；根比 1、2，记编号 1。","根指出值 1，输出 [1]，让叶子 5 不活跃。位置 2 只剩 4，自动记编号 0；根比较 4 与另一边胜者 2，改记编号 3。值 3 的叶子和它的比赛都没必要重做。","输出 2，让叶子 7 退出。位置 3 只剩 3，根比较 4、3，冠军变 3，输出已为 [1,2]。","再输出 3、让叶子 6 退出；位置 3 空了，根自动记左边剩下的 4。输出 4，所有叶子不活跃，结果 [1,2,3,4]。四条输入只各输出一次。"],"cost":"设 n 为项数，P<2n（n>0）。初建不到 2P 个树位置，工作 Θ(n)。每输出一项沿约 log₂n 个父位置更新，共 n 次，基础完全胜者树最好、一般、最坏 Θ(n log n)。存叶子编号、比赛结果和通常的输出需要 O(n) 空间；不是原地常数空间方法。按原编号处理所有等值比赛则稳定；随意选某边获胜不一定稳定。","why":"每个新最小值只需重打一条路径。保存很多旧比较结果节省重新全扫的工作，但要付树格子、输出和跳跃读取的成本。","use":"反复选择下一最小项，特别是把多条已排序输入流接成一条时很自然：输出某流头之后，只换该流的下一项并更新路径。","details":"败者树是相关结构：比赛位置记录败者，换入选手一路挑战记录的对手，顶端留冠军。外排的替换选择还会把不能接当前输出的项冻结到下一排；这是生成长有序排的步骤，不是这个完整排序的另一个名字。"},"en":{"foundation":["Think of a knockout tournament in which the smaller value wins. Losing a match does not delete the original record.","Leaves are bottom positions without children. Each record has one leaf; match positions above store the identity of a winning leaf, not another output record.","When one leaf withdraws, only matches on its path to the top depended on it. Other remembered results remain valid.","Use an active flag for withdrawals rather than inventing a numeric value that might also occur in the input."],"idea":"Compare pairs, then their winners, until the top identifies the smallest record. Output it, withdraw its leaf, and replay only its path upward. The top then identifies the next smallest. Continue until every record has been output once.","steps":["For n records, choose P as the smallest power of two at least n, chosen from 1,2,4,8,16,.... A convenient tree uses root position 1, children 2v and 2v+1, and leaves P through 2P−1. Assign records to the first n leaves; mark unused leaves inactive. Empty input stops.","Define a match. With no active child, mark the parent inactive. With one active child, copy its winning record identity. With two, compare their records and retain the smaller identity. On equal keys, the lower original input position wins, preserving arrival order.","Build matches from parent P−1 backward to 1. Children therefore have valid results before their parent is processed. Root finally names the champion.","Output the complete record named by root, then mark its particular leaf inactive. Clearing only root would leave stale lower matches that could promote the same record again.","Starting at that leaf’s parent, recompute each match using the current child winners. Move upward by integer-dividing the tree position by two, stopping after root.","If root still names an active record, output and withdraw it, then update again. Stop after n outputs or an inactive root. Match identities themselves are never additional records to output."],"example":["For [4,1,3,2], P=4. Leaves 4,5,6,7 refer to original record positions 0,1,2,3. Match position 2 compares 4 and 1, retaining record 1. Match 3 compares 3 and 2, retaining record 3. Root compares those winners and names record 1, value 1.","Output [1] and deactivate leaf 5. Match 2 now automatically promotes its remaining 4. Root compares that 4 with the unchanged other winner 2 and names record 3. Other branches need no replay.","Output 2 and deactivate leaf 7. Match 3 promotes remaining 3; root compares 4 and 3. Output is [1,2], and the new champion is 3.","Output 3, deactivate leaf 6, and make match 3 inactive. Root automatically promotes remaining 4. Output 4; all leaves are inactive. Result: [1,2,3,4]."],"cost":"Let n count records. The padded leaf count P is below 2n for nonempty input. Construction visits O(n) positions. Each of n withdrawals updates about log₂n matches, so the basic complete winner tree takes Θ(n log n) best, typical, and worst time. Tree identities and usual output storage require O(n) extra space. Consistent original-position tie-breaking makes it stable.","why":"Remembered comparisons replace a full rescan for each new minimum with one path. Extra tree storage and indirect reads are the trade-off.","use":"Useful for repeated minimum selection and joining ordered streams: replace an output stream head with its next record and replay that leaf’s path.","details":"A related loser tree stores opponents defeated along the path instead. Replacement selection additionally freezes records that cannot continue the current external run; it generates runs and is not another name for this complete sort."},"sources":[{"title":"Sahni: winner-tree sorting implementation","url":"https://www.cise.ufl.edu/~sahni/dsaaj/instruct/exer/c14/e8.htm"},{"title":"NIST: tournament sort and original report","url":"https://xlinux.nist.gov/dads/HTML/tournamentSort.html"}],"seq":28,"refnos":[51,52]},{"id":30,"group":"C","zh_title":"内省排序","en_title":"Introsort","kind":"algorithm","zh_alias":"Introspective sort；快速排序与堆排序的混合","en_alias":"Introspective sort; quicksort–heapsort hybrid","zh":{"foundation":["快排先按一个标准值分左右，再分别处理两边。若每次只能分出一项，几乎整排会被扫描很多遍。","预算在这里是一个整数计数器，记录同一条拆分路径还允许继续分区多少次，不是时间测量，也不是全局所有分区共用一个钱包。","插入动作是拿住下一项、把前面更大的项右移、放进空位。最大堆则是把每个父项摆得不小于孩子，让第一项一定最大。"],"idea":"先走通常很快的快排路线，同时数拆分层数。层数太深说明这一条路不顺，就对那一块改用最坏工作受控的堆排序；非常小的块直接插入。它不是一种神秘的新搬动，而是按明确条件选择已有的三组动作。","steps":["空输入或只有一项时直接结束，不计算预算。其余输入有 n 项时，常把预算设为 2floor(log₂n)。具体可从整数 n 开始，每次除以二去掉小数部分，直到只剩一，数做了几次，再乘二。16→8→4→2→1 有四次，预算八；10→5→2→1 有三次，预算六。选固定小范围阈值。","处理范围时，若它很小，做插入：从第二项起保存 x，向左看，只要前项>x 就把前项右移，最后把 x 写入空位，直到整块有序。若不是小范围且预算为零，跳到堆方法。","预算还有时，挑枢轴。常取第一、中间、最后三个值的中位数：几次比较排出这三值，取中间值，不是把所有数求平均。把它移到末端，扫描其余项；用前部边界收集≤枢轴的数，最后把枢轴交换到边界，留下两边未排块。这里展开一种可用分区，具体库可用其他正确分区。","预算减一，两个子块各获得这个减一后的数。分别继续同样决策；处理一个子块不会另行消耗另一个子块的余额。为省栈，可先调用较小子块，较大子块用循环继续。","后备堆只处理当前未完成块。把块内编号从 0 看起，i 的孩子为 2i+1、2i+2。从最后父项往前，比较孩子选较大的；父比它小就交换并沿新位置往下，直到父足够大或无孩子。","堆根成为最大值后，交换根与本块最后活跃项，缩小活跃范围，再让换入的根沿较大孩子向下找位置。反复直到只余一项。这个块有序后就返回，绝不能重排其他已经确定的范围。"],"example":["真实小数组 [4,1,3,2] 通常直接插入：拿住 1，移 4，得到 [1,4,3,2]；拿住 3，移 4，得到 [1,3,4,2]；拿住 2，移 4、3，再放到 1 后，成为 [1,2,3,4]。","为看清切换，另用同样输入，但故意把预算设为一、关闭小数组捷径。选末项 2 为标准。4>2 留下；1≤2，与前部 4 换位，成 [1,4,3,2]；3>2 留下。再交换标准与 4，成 [1,2,3,4]。","枢轴 2 固定，左块 [1] 已完；右块 [3,4] 继承余额零，改建堆。父 3 比孩子 4 小，交换为 [1,2,4,3]，这里只改右块。","把右块根 4 与它的末项 3 交换，得 [1,2,3,4]；余下一项停止。这是为展示机制而选的控制设置，不是普通库在四项上真的会走的路线。"],"cost":"设 n 为项数。每层分区合计最多扫描 n 项，路径预算只有 O(log n) 层，所以分区总量 O(n log n)。后备块互不重叠，各自堆排的工作加起来也不超过 O(n log n)。通常 Θ(n log n)，最坏 O(n log n)；基础非自适应版最好也约 Θ(n log n)，小块插入不会改变大输入的这个量级。通常实现栈 O(log n)，交换临时空间 O(1)。不稳定。","why":"正常数据保留快排的连续扫描；坏分区不能无限延续。额外只多预算判断，坏情况下堆虽然常数成本大些，却把总工作封住。","use":"适合通用数组排序，尤其不能容忍特殊输入导致平方级工作的情况。","details":"预算按当前拆分路径递减，不是按完成了多少交换递减。只有当前未完成范围切换到堆。某些实现最后用一次插入扫描收尾，也要先保证未完成小块的大小受到控制。"},"en":{"foundation":["Quicksort separates a range around a reference value, then works on both sides. One-item splits can repeatedly rescan nearly the whole row.","A depth budget is an integer counter for one chain of subdivisions. It is not a timer or one shared budget spent by every branch.","Insertion holds the next item, shifts larger preceding items right, and fills the opening. A maximum heap puts each parent above smaller children so its first item is largest."],"idea":"Begin with quicksort. If one chain of partitions becomes too deep, switch that unfinished range to heapsort. Use insertion for tiny ranges. Introsort chooses among these familiar actions using explicit size and budget tests.","steps":["Stop immediately for empty or singleton input, without computing a budget. For other inputs of n items, a common starting budget is 2floor(log₂n). Compute it by repeatedly integer-dividing n by two until one remains, counting the steps and doubling the count. 16→8→4→2→1 gives budget eight; 10→5→2→1 gives six. Choose a fixed tiny-range threshold.","At a tiny range, insert its items: starting with the second, hold x, move preceding values larger than x one slot right, then write x into the opening. Repeat to the end. Otherwise, if the budget is zero, use the heap steps below.","With budget left, choose a pivot. A common sample is the first, middle, and last values: compare them to find the middle-valued one, not their arithmetic average. One valid teaching partition moves it to the end, scans other items, exchanges values at most the pivot into a growing front region, and finally exchanges the pivot into that region’s boundary.","Subtract one from the budget. Both unfinished sides receive that reduced value. Processing one branch does not spend the other branch’s allowance. Calling the smaller side and looping over the larger side limits stack use.","The fallback heap applies only to the current range. Use local positions starting at zero, with children 2i+1 and 2i+2. Starting with the last parent and working backward, select its larger child; exchange if the parent is smaller, and continue downward. Stop at a sufficiently large parent or a childless position.","The heap root is now largest. Exchange it with the last active item of this range, shrink the active part, and sink the replacement root by the same larger-child rule. Repeat until one item remains, then return to the surrounding task."],"example":["A practical implementation usually inserts [4,1,3,2] directly. Insert 1 by shifting 4: [1,4,3,2]. Insert 3 by shifting 4: [1,3,4,2]. Insert 2 by shifting 4 and 3: [1,2,3,4].","To expose the fallback separately, use the same input with an artificial budget of one and disable the tiny-range shortcut. Pivot 2 admits 1 into the front by exchanging it with 4: [1,4,3,2]. The 3 stays larger. Put pivot 2 into its boundary slot: [1,2,3,4].","Left singleton [1] stops. Right range [3,4] inherits budget zero. Its heap construction exchanges parent 3 and child 4, giving [1,2,4,3]. Other ranges remain untouched.","Exchange that heap’s root 4 with its last 3: [1,2,3,4]. The remaining heap is a singleton. These artificial settings illustrate switching, not normal four-item library behavior."],"cost":"Let n count records. Partition ranges at one depth contain at most n items in total. Only O(log n) depths are allowed, so partition work is O(n log n). Fallback ranges do not overlap, and their combined heap work is also O(n log n). Typical time is Θ(n log n), worst O(n log n). Basic nonadaptive versions also have about Θ(n log n) best time. Standard control uses O(log n) stack space and O(1) exchange storage. It is unstable.","why":"Ordinary cases keep quicksort’s fast scans. Difficult cases cannot continue bad partitions indefinitely; the heap supplies a dependable upper bound.","use":"A general-purpose choice when unusual input must not trigger quadratic work.","details":"The allowance follows partition depth, not swap count. Heap-sort only the unfinished current range. Versions that finish with one insertion sweep must still keep unfinished small pieces bounded in size."},"sources":[{"title":"Musser: original introsort paper","url":"https://onlinelibrary.wiley.com/doi/10.1002/(SICI)1097-024X(199708)27:8%3C983::AID-SPE117%3E3.0.CO;2-%23"},{"title":"Musser: generic algorithms and introsort","url":"https://www.cs.rpi.edu/~musser/gp/index_1.html"}],"seq":29,"refnos":[53,54]},{"id":31,"group":"C","zh_title":"模式破坏快速排序","en_title":"Pattern-defeating quicksort (pdqsort)","kind":"algorithm","zh_alias":"pdqsort；模式抵抗快排","en_alias":"pdqsort; pattern-defeating quicksort","zh":{"foundation":["先记住三种小动作：按枢轴扫描分左右；拿住一项向前插入；让最大值沿父子规则升到堆根、再送尾部。这里是把这些动作配上观察和切换条件。","“模式”指输入已有规律，例如有序、逆序或周期排列。这些规律可能让某种选枢轴方式反复选坏标准。打破模式只交换少数位置，不生成或删除记录。","“有限尝试”是给插入搬动规定一个小上限；超过就停这条捷径，继续正常排序。试失败之后的数据可以变了，但所有记录必须还在。"],"idea":"pdqsort 一边快排，一边问两个具体问题：这次分区是否很偏？这一块是不是其实容易排？容易的用短插入结束，偏得厉害的先打乱少量位置，坏分区累计太多就堆排。还有专门等值处理，避免把重复项反复拆下去。","steps":["小范围直接插入：从第二项拿住 x，前面>x 的项逐格右移，x 填到停止处。大范围从第一、中间、末尾等小样本选中间值；更大范围可用多个三项样本的中间值再取中间值。这只挑标准，不是完成排序。","一种普通分区把枢轴暂放左端 lo 并保存其值 p，i=lo+1、j=hi。只在 i≤j 时扫描：左侧遇值<p 就 i 加一；右侧遇值≥p 就 j 减一；若仍 i≤j，交换错边两项，再前进 i、后退 j。交叉后把枢轴与位置 j 交换，小项在它左、其余在右，继续两侧。记录的信号是内部错边交换；挑样本和放回枢轴的交换不算。作者实现另有优化的边界检查和分支少版本。","记录内部错边交换是否发生；挑样本、最后放枢轴的交换不等同于这个信号。如果分区不太偏且没有内部交换，分别尝试有限插入。每次向左挪 x 时累计挪了多少格；在小上限内排完就结束这块，超过就放好拿住的记录后退出尝试，继续分区。","如果某一侧少于当前范围约八分之一，就记为坏分区。交换大侧一些预先指定的远处分布位置，让后续样本不再看到同样布局；坏分区预算减一，初值与 log₂n 成正比，花完就堆排当前块。交换不能保证立刻均衡，真正最坏保护来自预算和堆后备。","还有一个有条件的等值捷径：若前一次分区已知这一块所有值≥左邻旧枢轴，而新枢轴恰等于旧值，就扫描把等值放前、严格更大者放后，等值区无需再排。没有那条已知下界时，不能擅自忽略较小值。","堆后备把当前块按父 i、孩子 2i+1/2i+2 看待。从末父向前，挑大孩子，父较小时交換并继续下沉。根成为最大后与活跃末项交换、缩小、继续下沉，直到一项。小范围插入、等值区完成和预算规则共同保证终止。","可选分支少的分区先把左侧错边位置收进小编号缓冲，右侧错边位置收进另一缓冲，再按配对交换。缓冲存的是“哪格错了”，不是额外输出记录；其容量固定。"],"example":["作者实现对 [4,1,3,2] 走小范围插入：插 1 得 [1,4,3,2]，插 3 得 [1,3,4,2]，插 2 时移 4、3，得 [1,2,3,4]。这条真实小例没有调用大范围模式逻辑。","单看容易分区信号：局部有序 [1,2,3,4,5] 选标准 3，把它暂放左端，成为 [3,2,1,4,5]。两头扫描在中间交叉，未交换内部错边对；枢轴回边界后变回 [1,2 | 3 | 4,5]。两边插入检查都不用移较大项，可快速确认。","单看坏分区信号：一块十六项若标准最小，左边零项、右边十五项，属于坏分区。预算减一，再交换右边若干样本位置；若随后仍不断出现这种分割，余额用完就只堆排余块。固定位置的具体选择是作者实现策略，不能由这个说明猜出一套必定最快的置换。"],"cost":"设 n 为项数。容易且被识别的输入可只扫描和短检查，最好 O(n)。一般 O(n log n)。每次坏分区减少预算，大幅未缩小的范围不能无限重复；堆后备使最坏 O(n log n)。通常作者实现栈 O(log n)，固定容量编号缓冲额外 O(1) 个机器字。不稳定。阈值与固定交换位置影响常数，不改变后备的总工作保护。","why":"不盲目把容易排的块继续拆，也不任由坏模式反复耗时。额外的试探、采样和缓冲有成本，比较本身昂贵时，减少条件分支未必更划算。","use":"高效通用数组排序，且不要求等值记录保持先后时。适合了解实际库如何把多个小优化组织成明确控制流程。","details":"有限插入失败后仍须把拿住的记录放回；不能直接返回并丢掉它。原作者完整实现还包含防越界哨兵、采样布局等工程细节，生产应复用其代码。"},"en":{"foundation":["Keep three actions in mind: partition around a value, insert a held item by shifting larger predecessors, and extract a heap maximum to the end. pdqsort combines them with observations and switching rules.","An input pattern is an existing arrangement such as ascending, descending, or periodic order. Some pivot policies repeatedly choose poorly on a pattern. Exchanging a few positions disturbs it without changing the records.","A limited insertion attempt has a small movement allowance. If it fails, all held records must be returned before normal sorting continues."],"idea":"While quicksorting, ask whether a split is badly uneven and whether a region already looks easy. Finish easy regions with a short insertion attempt; disturb recurring bad patterns; fall back to heapsort after too many bad splits. Conditional equal-key filtering avoids repeatedly processing duplicates.","steps":["Use insertion on small ranges: hold the next x, shift larger predecessors right, then fill the opening. For larger ranges choose a middle-valued sample item. Large samples may take medians of three groups and then their median; this selects a pivot rather than sorting the row.","One ordinary partition temporarily places saved pivot p at left endpoint lo. Set i=lo+1 and j=hi. While i≤j, advance i over values below p and retreat j over values at least p, checking i≤j before reading. If they have not crossed, exchange the misplaced pair, advance i, and retreat j. After crossing, exchange the pivot with position j, then continue on either side. The observation records internal pair exchanges, not sample rearrangement or final pivot placement. Author code refines the bounds and offers a branchless form.","Record whether internal misplaced-pair exchanges occurred. Sample rearrangement and final pivot placement are different from that signal. If the split is reasonably balanced and no internal exchanges occurred, try insertion on the sides with a small total movement allowance. Count how many positions held items move. Finish if the attempt completes; otherwise return the held item safely and resume partitioning.","A side below roughly one eighth of the range marks a bad partition. Exchange a few specified, separated positions in the larger side to disturb repeated sampling patterns. Reduce a bad-partition allowance initially proportional to log₂n. On exhaustion, heap-sort this unfinished range. Pattern disturbance alone is not a guarantee; the allowance and fallback supply it.","Equal filtering needs prior information. If an earlier partition established that every value here is at least the preceding pivot, and the new pivot equals that value, separate equals from strictly larger items. Leave all equal records in the completed front and continue only on larger ones. Without that lower-bound information, smaller values cannot be ignored.","For fallback, use local heap positions: i has children 2i+1 and 2i+2. Work backward from the last parent, selecting its larger child and exchanging downward while the parent is smaller. Exchange the resulting maximum root to the active end, shrink, and sink again until one item remains.","An optional branchless partition records misplaced left positions in one fixed-size buffer and misplaced right positions in another, then exchanges matched pairs. These buffers hold locations, not additional output records."],"example":["The author implementation inserts tiny input [4,1,3,2]: insert 1 to get [1,4,3,2], then 3 to get [1,3,4,2], then 2 by shifting 4 and 3 to obtain [1,2,3,4]. Large-range pattern logic is not used.","Separately inspect an easy partition of ordered [1,2,3,4,5]. Temporarily move pivot 3 left: [3,2,1,4,5]. The scans cross without exchanging internal misplaced pairs. Final pivot placement restores [1,2 | 3 | 4,5]. Limited insertion on both sides confirms order without shifts.","For a bad-split example, a sixteen-item range whose pivot is its smallest value leaves zero items left and fifteen right. Spend one allowance and disturb specified positions on the large side. Continued failures eventually send the unfinished range to heapsort. Exact disturbance positions belong to the author’s implementation."],"cost":"Let n count records. Recognized easy patterns can take O(n) scans and short checks. Typical time is O(n log n). Repeated severely unbalanced splits spend the allowance; heapsort then bounds remaining work, giving worst O(n log n). Author implementations use O(log n) stack space and optional O(1) fixed buffer space. The method is unstable. Thresholds and disturbance choices affect constants.","why":"Easy regions stop early, while difficult patterns cannot consume unlimited partition work. Sampling and trial checks add overhead, and branchless handling mainly helps cheap comparisons.","use":"A fast general-purpose array sort when stability is unnecessary; also a useful example of explicit control around familiar sorting actions.","details":"A failed trial must preserve every record. Production code also needs precise sample layouts, bounds, and sentinel handling; reuse the tested author implementation rather than treating this explanation as its complete source code."},"sources":[{"title":"orlp: pdqsort design and guarantees","url":"https://github.com/orlp/pdqsort/blob/master/readme.md"},{"title":"orlp: pdqsort source","url":"https://github.com/orlp/pdqsort/blob/master/pdqsort.h"},{"title":"Lammich: verified introsort and pdqsort","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7324064/"}],"seq":30,"refnos":[55,56,57]},{"id":37,"group":"C","zh_title":"伸展树排序","en_title":"Splaysort","kind":"algorithm","zh_alias":"Splay sort；自调整树排序","en_alias":"Splay sort; self-adjusting tree sorting","zh":{"foundation":["先有查找树：比节点小的走左，大的走右，空连接才建新节点。它不是已经有序的数组，只是保存了大小关系。","一次右旋把父 p 的左孩子 x 提到上面。p 成 x 的右孩子，x 原来的右分支接到 p 的左边；该分支的值介于 x 与 p 之间，所以放在那里合适。左旋完全反向。","当前节点 x 的上一层叫父 p，再上一层叫祖父 g。要看 x 和 p 分别是上一层的左孩子还是右孩子，才能选择旋转顺序。","“摊还”看整串操作总成本。有一次走很长，不代表每次都长；O(log n) 摊还不是给每个单次操作承诺的上限。"],"idea":"每插入或访问一个节点，都把它通过旋转送到根，叫作 splay。刚用过的值和附近值以后可能更容易到达。全部插完后按左、当前、右读出。这是一种会自己改形状的树排序，不是每次都硬性维持树高。","steps":["插入 x 时从根逐节点比较，小则向左、大则向右，到空连接建节点。相等可以在现有节点队列末尾追加记录，并把这个现有节点当作 x。记住沿途父连接，接下来需要向上改变它们。","若 x 已是根，不转。若父 p 是根，只转一次：x 在 p 左则右旋 p，x 在 p 右则左旋 p。x 直接成为根；这个情形称 zig。","若 x、p 都是左孩子，先右旋祖父 g，把 p 提上去，再右旋 p，把 x 提上去；都是右孩子时先左旋 g 再左旋 p。此同方向双旋叫 zig-zig。顺序是先父上祖父，不是随便转两次。","若 x 在 p 右、p 在 g 左，先左旋 p，让 x 上到 p 原位置，再右旋 g；反向情形先右旋 p 再左旋 g。这种拐弯双旋叫 zig-zag。","每次重接被转部分与更上层的连接；检查 x 现在的父、祖父，再选合适情形继续，直到 x 成根。转动时只改连接，不丢子树；转移的中间分支必须挂回去。","所有记录都插完后，读出规则是：空连接返回；先完全读左分支，再输出节点队列，再读右分支。用调用栈或显式列表记住待返回的节点。相等队列保持到达次序。"],"example":["输入 [4,1,3,2]。4 是根；插 1 到它左边。父 4 是根，右旋一次：1 成根，右孩子是 4。顺序关系 1<4 不变。","插 3：从 1 往右到 4，再往左建 3。是右—左拐弯：先右旋 4，3 取代 4 成为 1 的右孩子，4 接 3 右；再左旋 1，根成 3，左右孩子为 1、4。","插 2：从 3 左到 1，再右建 2。先左旋 1，2 成 3 的左孩子、1 成 2 左孩子；再右旋 3，根成 2，左孩子 1、右孩子 3，3 右仍有 4。四条记录都在。","读出先走到 1 输出它，再输出根 2，然后右分支的 3、4，得到 [1,2,3,4]。","另观察某个待转部分若是左链 4→3→2：先右旋 4，变 3 上、左 2、右 4；再右旋 3，变 2 上、右 3、3 右 4。这说明 zig-zig 的两次顺序，并不是说刚才四项例子一定经过此形状。"],"cost":"设 n 为项数。一轮插入包含路径比较和沿路径若干旋转；单次可能 O(n)。但按 splay 规则算整个序列，通常和完整排序最坏 O(n log n)，不能把最坏单次乘 n 得出此算法一定平方。单调到达时每次新值在根旁插入并转一次，最好可 Θ(n)。节点 O(n) 空间；最终树仍可能是长链，递归读出最坏栈 O(n)，不是固定 O(log n)。相等队列或原编号规则正确则稳定。","why":"根始终靠近最近使用的值，后续相近键可能少比较。旋转、连接读取和分配盒子都花时间，不能只看比较量级。","use":"适合学习利用已有顺序的树排序，或本来要使用自调整查找树的数据。","details":"把两个同方向旋转顺序反过来，会变成别的调整规则，不能直接沿用 splay 的摊还结论。树可以很高；必须保留旋转中的中间分支，不能提升节点时顺手删除它。"},"en":{"foundation":["A search tree follows smaller keys left and larger keys right until an empty link receives a node. It remembers order relationships rather than storing an already sorted array.","A right rotation raises left child x over parent p. Make p the right child of x and transfer x’s old right branch to p’s left. Its keys lie between x and p. A left rotation mirrors this.","The node above x is its parent p; the next above is grandparent g. Their left/right relationships determine the rotation order.","Amortized cost bounds a whole sequence, allowing an expensive individual operation. It is not a per-operation promise."],"idea":"After inserting or accessing a node, rotate it up to root: this is splaying. Recently used keys and their neighbors may become easier to reach. After all insertions, read the tree left, node, right. The tree changes shape without maintaining a fixed height bound.","steps":["Insert by comparisons from root: smaller left, larger right, then create a node at an empty link. For equality, append to an existing node’s arrival-order queue and use that node as x. Keep parent connections for the upward changes.","If x is root, stop. If p is root, perform one rotation: right at p for a left child, left for a right child. This zig puts x at root.","If x and p are both left children, rotate right at g to raise p, then right at p to raise x. For two right-child edges, rotate left at g, then left at p. This zig-zig raises the parent first; its order is deliberate.","If x is right of p while p is left of g, rotate left at p, then right at g. Reverse both directions for the opposite turn. This zig-zag raises x over its parent, then grandparent.","Reconnect the rotated part to any higher ancestor, inspect x’s new relatives, and repeat until x is root. Preserve every transferred middle branch. Rotations reconnect records; they do not remove them.","For final output, return at empty links. Completely read the left branch, output the node’s queued records, then read the right branch. Calls or an explicit stack remember unfinished returns."],"example":["Insert [4,1,3,2]. Root 4 receives left child 1. A right zig at 4 makes root 1 with right child 4.","Insert 3 by going right from 1 and left from 4. This right-left turn needs right rotation at 4, making 3 the right child of 1 with 4 to its right, then left rotation at 1. Root is 3 with children 1 and 4.","Insert 2 by going left from 3 and right from 1. Rotate left at 1, then right at 3. Root becomes 2 with left child 1 and right child 3; node 3 keeps right child 4. No records disappear.","Read left child 1, root 2, then right-branch nodes 3 and 4: [1,2,3,4].","To inspect zig-zig separately, suppose a local left chain is 4→3→2. Right-rotate 4 to make 3 above children 2 and 4; right-rotate 3 to make 2 above the right chain 3→4. This is a separate shape demonstration."],"cost":"Let n count records. One insertion and splay can follow O(n) nodes. Across the full sequence, the splay rules give typical and whole-sort worst O(n log n); multiplying the worst individual cost by n loses that sequence guarantee. Monotone arrivals can cost Θ(n), inserting beside root and rotating once each time. Nodes need O(n) space. Final trees can still be tall, so recursive reading may need O(n) stack. Arrival-order equal queues or original-position ties can make output stable.","why":"Keeping recent keys near root can shorten later nearby searches. Rotations, pointer reads, and allocation add costs beyond comparisons.","use":"Useful for adaptive-sorting study and data already using a self-adjusting search tree.","details":"Changing the zig-zig order creates a different adjustment rule without automatically retaining the splay guarantee. Preserve the middle subtree at every rotation. A tall tree remains possible despite good amortized performance."},"sources":[{"title":"Moffat, Eddy & Petersson: Splaysort","url":"https://onlinelibrary.wiley.com/doi/10.1002/(SICI)1097-024X(199607)26:7%3C781::AID-SPE35%3E3.0.CO;2-B"},{"title":"Sleator & Tarjan: self-adjusting trees","url":"https://www.cs.cmu.edu/~sleator/papers/self-adjusting.pdf"},{"title":"Carnegie Mellon: zig, zig-zig, zig-zag","url":"https://www.cs.cmu.edu/afs/cs.cmu.edu/academic/class/15451-f97/www/splay.html"}],"seq":31,"refnos":[58,59,60]},{"id":79,"group":"C","zh_title":"最小最大堆排序变体","en_title":"Sorting with a min-max heap","kind":"variant","zh_alias":"最小最大堆提取排序；双端优先队列排序","en_alias":"min-max-heap extraction sort","zh":{"idea":"同时在一棵树里保留最小端和最大端。要升序输出，就反复拿根的最小值，然后把树修好。它适合本来就需要“两端都能取”的结构，单纯排序未必值得这些额外检查。","steps":["用数组表示完整二叉树，层从 0 开始，偶数层最小、奇数层最大。建堆时可以用层边界一次认清角色：位置0是第0层，1–2是第1层，3–6是第2层，7–14是第3层；下一层起点是本层起点的两倍加1。倒着扫描时，只有越过层起点才把层数减1，不必让每个节点反复走父链。编号 i+1 的二进制位数减1也等于层数，但需要按所用机器的位操作成本计算。","从最后一个有孩子的位置 floor(n/2)−1 开始，向左直到根，逐个修复，保证当前节点之下的子树已修好。","在最小层，检查存在的两个孩子和最多四个孙子，找其中最小。没有比当前值小的就停；最小候选是直接孩子则交换一次并停。","候选是孙子时，交换当前值与它。下移到孙子位置的旧值若比它的最大层父亲还大，再和父亲交换校正。接着从该孙子位置继续第 3 步。最大层全做对称操作：找最大、过小的下移值与最小层父亲校正。","建好后，取根写输出。把数组最后一条搬到根，缩短树，用最小层规则修复根；反复取出直到树空。零项、一项时直接处理，不读取不存在的孩子。","若需降序，可以改取根孩子中较大的记录并做最大层修复。本文的升序版本使用独立输出数组，不能把它说成完全零额外空间。"],"example":["输入 [4,1,6,2,5,3]。根 4 是最小层，孩子 1、6 是最大层。最后有孩子节点 6 下只有 3，6 已够大；节点 1 下是 2、5，应把最大 5 换上，得 [4,5,6,2,1,3]。","修根 4 时，孩子 5、6 和孙子 2、1、3 中最小的是 1。与它交换，成 [1,5,6,2,4,3]。下移 4 的父是 5，4≤5，因此不用校正；它已在叶子，停止。","输出 1，用末项 3 补根并删去末格，得到 [3,5,6,2,4]。根候选最小 2 在孙子处，交换成 [2,5,6,3,4]；3≤父 5，无需校正。","输出 2，末项 4 补根，剩 [4,5,6,3]；与孙子 3 换成 [3,5,6,4]。再出 3，4 补根，孩子 5、6 都较大，不换；出 4，6 补根，与直接孩子 5 换成 [5,6]；最后出 5、6。完整结果 [1,2,3,4,5,6]。"],"cost":"底向上建树为 O(n)，每次取最小最多沿约 log n 层修复，所以全排序上界 O(n log n)。一般互异输入达到这个量级，全等输入可能少做修复。n 是记录数。堆本身复用输入，但这里把逐个取出的记录写到新数组，需 O(n) 输出空间；迭代管理仅 O(1)。通常不稳定。它比普通堆多检查孩子、孙子和跨层关系，用途是同时提供两端，而不是无条件更快。","why":"同时获得最小和最大值很方便；单纯全排序通常不需要这份双端能力，且孩子与孙子校正比普通堆复杂。","use":"已经需要双端优先队列、之后又要提取为有序结果的应用。","details":"看孩子却不看孙子，会漏掉隔层的更小或更大记录。候选是直接孩子与候选是孙子，后续处理不同；这也是步骤必须分开讲的原因。","foundation":["把数组按层填进二叉树：根占位置 0，两个孩子占 1、2，下一层从左到右占 3、4、5、6。每个位置 i 的孩子下标是 2i+1、2i+2，存在才读取。父位置是 floor((i−1)/2)，floor 就是去掉小数部分。","普通最小堆只便于取最小。这种树让层交替承担大小任务：根是最小层，下一层最大，再下一层最小。最小层节点不大于它的所有后代，最大层不小于后代。所以根最小，根的两个孩子中较大的给全树最大。","修复时为什么看孙子？同性质的下一层是隔一层的孙子：最小层应该沿最小层继续向下检查。直接孩子属于最大层，交换时还要照顾这一层的相反大小关系。"]},"en":{"idea":"Keep both extrema available in one tree. Ascending output repeatedly removes the root and repairs the remaining tree. The extra rules are useful when an application already needs both ends, rather than automatically improving ordinary sorting.","steps":["Represent the complete tree in an array. Depth zero is minimum; even depths are minimum and odd depths maximum. Find roles with level boundaries: position 0 is level 0, positions 1–2 level 1, 3–6 level 2, and 7–14 level 3. The next level starts at twice the current start plus one. While scanning positions backward, reduce the level only when crossing its start; do not repeatedly climb every node’s parent chain. The binary digit count of i+1 minus one also gives its level, if the machine’s bit-operation cost is accounted for.","Repair bottom-up from the last parent, floor(n/2)−1, through position zero. Children’s subtrees are already repaired before a parent is processed.","At a minimum level, inspect existing children and grandchildren and choose their smallest. Stop if none is smaller than the current record. If the candidate is a direct child, exchange once and stop.","For a grandchild candidate, exchange, then check the lowered old record against its maximum-level parent. If it is too large, exchange with that parent. Continue minimum-level repair at the grandchild position. Reverse all inequalities at maximum levels.","After construction, emit the root, move the final array record there, shorten the tree, and repair the minimum root. Repeat until empty. Empty and single-item trees must not inspect nonexistent children.","Descending extraction instead uses the larger root child and maximum-level repair. The ascending version here writes a separate output array."],"example":["For [4,1,6,2,5,3], root 4 is a minimum level and 1,6 are maximum levels. Node 6 already exceeds child 3. Node 1 must exceed children 2,5, so exchange with 5: [4,5,6,2,1,3].","Root candidates 5,6,2,1,3 have minimum 1. Exchange it with 4: [1,5,6,2,4,3]. Lowered 4 does not exceed parent 5, so no correction is needed.","Emit 1 and replace it with final 3, leaving [3,5,6,2,4]. Exchange with grandchild 2 to obtain [2,5,6,3,4]. Lowered 3 remains below parent 5.","Emit 2, replace with 4, and repair [4,5,6,3] to [3,5,6,4]. Emit 3; replacement 4 already lies below children 5,6. Emit 4; replacement 6 swaps with direct child 5 to form [5,6]. Emit 5 then 6. Output: [1,2,3,4,5,6]."],"cost":"Bottom-up construction is O(n). Each minimum removal repairs at most roughly log n levels, giving O(n log n) sorting work. General distinct-key cases have that scale; all-equal input may require fewer repairs. The heap reuses the input, but this extraction procedure needs O(n) output space, with O(1) iterative management. It is normally unstable. Children, grandchildren, and parent corrections add work compared with an ordinary heap; the benefit is exposing both extrema.","why":"Access to both extremes is useful, but full sorting alone rarely needs it. Child-and-grandchild repair is more complex than ordinary heap repair.","use":"Applications that already use a double-ended priority queue and later need ordered extraction.","details":"Checking children alone can miss a smaller or larger grandchild. Direct-child and grandchild exchanges have different continuation rules, so do not combine them into one vague repair instruction.","foundation":["Fill a binary tree by levels using array positions: root 0, children 1,2, then 3,4,5,6. Children of i are 2i+1 and 2i+2 when those positions exist. Its parent is floor((i−1)/2), with floor discarding a fractional part.","An ordinary min-heap exposes one end. A min-max heap alternates roles by level: root minimum, next level maximum, next minimum. A minimum-level node is no larger than its descendants; a maximum-level node is no smaller. The root is smallest, and the larger root child is largest.","Grandchildren share a node’s minimum or maximum role, while direct children have the opposite role. Repairs therefore inspect both generations and sometimes correct the intervening parent relation."]},"sources":[{"title":"Atkinson Sack Santoro Strothotte Min-Max Heaps and Generalized Priority Queues","url":"https://people.scs.carleton.ca/~santoro/Reports/MinMaxHeap.pdf"}],"seq":32,"refnos":[61]},{"id":25,"group":"C","zh_title":"块归并排序：Grailsort / WikiSort","en_title":"Block merge sorting: Grailsort / WikiSort","kind":"family","zh_alias":"块排序；Grailsort 与 WikiSort 是相关实现，互非别名","en_alias":"Block sort; Grailsort and WikiSort are related implementations, not aliases","zh":{"foundation":["块是一串连续格子。交换两块时，第一项互换、第二项互换，直到块末；不是只交换块首。","工作区临时装数据。本算法借原数据作工作区；里面的原记录仍要归还，不能被覆盖丢掉。","标签是暂放在 A 块首的不同数，表示块原先次序。真正首值与标签交换，寄存在标签区；标签次序和真正数值有不同用途。","旋转能换邻段而保留各段内部顺序：各自反转，再整体反转。[7,8 | 5,6] 经 [8,7 | 5,6]、[8,7 | 6,5] 后，整体反转成 [5,6 | 7,8]。","|A| 表示 A 中的项数；√ 表示平方根，例如 16 的平方根是 4，因为 4×4=16。"],"idea":"借少量真实记录作工具，把其余数成块搬动，再做局部接排，最后归还工具记录。以下具体讲 WikiSort 的两内部缓冲机制：只给左有序排 A 的块贴标签，右排 B 保留真正块首。Grailsort 是相关实现，但调度和边界不能混用。","steps":["先形成相邻有序排 A、B。短排可插入排序：拿住下一项，把前面更大的项右移，再放进空位。大排逐轮接起来。一次大接排取约 √|A| 的块长，即块长与块数大致相等。","找两组不同键：一组能装一块作工作区，另一组有每个剩余 A 块一个标签。先找选中键的位置，再从后面往前旋转，将选中键聚到保留区，保持未选记录相对次序。保留区不参加滚动。","按 A 块原次序，用升序标签分别与块首交换。真正首值寄存在相应标签槽。最小剩余标签指出下一 A 块；读标签区的对应真首值才能决定它插在哪。B 块不贴标签。","把滚动区最左 A 块与下一个同长 B 块逐项交换，让 B 前进、A 后移；A 块允许暂乱序。若下一 A 真首值仍大于刚越过 B 块的末值，再滚一块 B。否则扫描剩余 A 标签，找最小标签块，把它换到滚动区最左。","在刚越过的 B 块内找第一个不小于 A 真首值的位置：比较中间值，若太小就找右半，否则找左半，直到得到插入点。旋转 B 的这个后缀与 A 块，让 A 放在此处，相等时 A 在前。交换标签与寄存真首值，把块首恢复。","下一 A 块落定后，前一 A 和夹在两块之间的 B 项可以排定。先把前一 A 逐项交换到工作区。比较工作区未用头和 B 未用头，把较小者与下一输出格交换，前进所选头和输出位置。相等先取 A。被挤走的借用记录仍存着，不能直接覆盖。一边空后，另一边余项顺序交换到位。","最后一 A 与剩余 B 同法处理。打乱的工作区键用插入排序复原；标签恢复后仍有序。用搜索和旋转把保留键送回主体，按抽取来源保持等值先后。不同键不够时，WikiSort 只保留一个标签区、加大块长以减少块数，局部用搜索加旋转；不足整块的首尾片段也另作旋转。"],"example":["从整体仍无序的 [1,2,3,4,6,9,11,14 | 5,7,8,10,12,13,15,16] 开始。两半分别有序，但 14>5。借 [1,2] 作工作区、[3,4] 作标签，主体 A=[6,9][11,14]，B=[5,7][8,10][12,13][15,16]。16 个数全保留。","标签 3 换真首 6，标签 4 换真首 11。A 暂为 [3,9][4,14]，标签区 [6,11]。滚过 [5,7]，因 6≤7，在 7 前插入第一 A 块并恢复真首，形成 [5][6,9][7]。","第二 A 真首 11>10，越过 [8,10]；到 [12,13] 时 11≤13，在 12 前落定并恢复。主体布局 [5][6,9][7,8,10][11,14][12,13,15,16]，标签回到 [3,4]。","交换 [1,2] 与 [6,9]，工作区变 [6,9]，局部暂为 [1,2,7,8,10]。取 6 与输出格的 1 交换，局部 [6,2,7,8,10]、工作区 [1,9]。9>7，交换出 7，局部 [6,7,2,8,10]；9>8，再交换出 8，局部 [6,7,8,2,10]。","9<10，交换工作区 9 与输出格 2，局部 [6,7,8,9,10]，工作区回 [1,2]。10 已在正确格。最后一 A 与 B 输出 11、12、13、14、15、16。主体成为 5 到 16，归还 [1,2]、[3,4]，得到完整 1 到 16。小块用于展示；正式实现直接处理这种小数组。"],"cost":"设 n 是项数。成熟实现每层工作 O(n)，约有 log₂n 层，通常和最坏 O(n log n)。一轮约 √n 个 A 块，反复扫描这些标签最多约 (√n)²=n 次；把 √n 个工作键插入重排也只需 O(n)。原地配置外部空间 O(1) 个机器字；借来的 O(√n) 项属于输入，不是新分配。可选外部缓冲改变空间。跳过已顺序正确的接排可使最好接近 O(n)。成熟实现稳定，前提是抽取、相等规则、归还都正确。","why":"用块移动避免让单个左项反复跨越整排。省内存的代价是抽取、标签、恢复与边界管理，常数成本高，初学实现容易错。","use":"需要稳定又不能分配完整副本时有价值。先手演示动作，生产时复用经过测试的代码。","details":"标签只标明原块次序，不能用它代替真首值决定插入点。少键和不整块情况是完整算法所需规则，不是可任意省去的优化。"},"en":{"foundation":["A block is a consecutive group of slots. Exchange equal-size blocks item by item, not just their fronts.","Workspace temporarily holds data. Here it is borrowed from the input, so its original records must return.","Distinct tags temporarily replace A-block fronts to show original block order. The real fronts are parked in the tag area. Tags and real front values answer different questions.","Rotation exchanges neighboring pieces while preserving internal order. Reverse each piece and then the whole: [7,8 | 5,6] becomes [8,7 | 5,6], then [8,7 | 6,5], then [5,6 | 7,8].","|A| counts items in A. The symbol √ means square root: √16=4 because 4×4=16."],"idea":"Borrow a few real records as tools, move the remainder in blocks, join neighboring ordered pieces, then return every borrowed record. The representative below uses WikiSort’s two internal buffers. Only left-run A blocks receive tags; right-run B blocks retain actual first values. Related Grailsort has different scheduling and boundary rules.","steps":["First form neighboring ordered runs A and B. Tiny runs can use insertion: hold the next item, shift larger preceding items right, then fill the opening. Increase run sizes in successive joining rounds. For a large join, choose block length near √|A|.","Find distinct keys for two reserved groups: workspace large enough for one A block, and one tag per remaining A block. Identify selected keys, then collect them by rotations working backward from later selected groups. Unselected records retain their relative order. Reserved areas do not roll.","Exchange ascending tags with A-block first items in original order. Real first values remain in corresponding tag slots. The minimum remaining tag identifies the next original A block; read its corresponding real first value to decide insertion. B blocks receive no tags.","Exchange the leftmost rolling A block with the next equal-size B block. B moves left and A moves right; A blocks may become scrambled. Keep rolling while the next real A first value exceeds the last value of the B block crossed. Otherwise find the minimum-tag A block and exchange it into the leftmost rolling position.","Binary-search the preceding B block for its first value at least the real A first value. A smaller middle value eliminates the left half; otherwise retain the left half. Rotate that B suffix with A to insert A there. A goes before equal B values. Exchange its tag back with its real first value.","After the next A block lands, finish the previous A and intervening B items. Exchange that A block into workspace. Compare workspace and B heads; exchange the smaller head with the next output slot, then advance its source and the output. Choose A on ties. Displaced borrowed records remain safe. When one source ends, exchange the other remainder into place.","Finish the last A with remaining B. Insertion-sort scrambled workspace keys, then redistribute both reserved groups using searches and rotations with source-aware tie rules. Scarce keys require one tag buffer, larger blocks, and search-and-rotation local joins. Uneven edge pieces also need special rotations."],"example":["The whole input [1,2,3,4,6,9,11,14 | 5,7,8,10,12,13,15,16] is unordered although each half is ordered. Reserve [1,2] as workspace and [3,4] as tags. A=[6,9][11,14]; B=[5,7][8,10][12,13][15,16]. All sixteen items survive.","Tag A as [3,9][4,14], parking real fronts [6,11]. Roll past [5,7]. Since 6≤7, insert and restore the first A before 7: [5][6,9][7].","The next front 11 passes [8,10] and belongs before 12 in [12,13]. After restoration the body is [5][6,9][7,8,10][11,14][12,13,15,16]. Tags return to [3,4].","Exchange [6,9] into workspace [1,2]. Workspace becomes [6,9], local output [1,2,7,8,10]. Exchanging out 6 gives [6,2,7,8,10], workspace [1,9]. Choose B heads 7 and 8 next: [6,7,2,8,10], then [6,7,8,2,10].","Now 9<10. Exchange workspace 9 with output 2, obtaining [6,7,8,9,10] and restoring workspace [1,2]. Join the last pair into [11,12,13,14,15,16]. Return [1,2] and [3,4] to obtain 1 through 16. Real code directly handles tiny arrays; small blocks expose its tools."],"cost":"Let n count items. Established implementations keep each joining level to O(n), giving typical and worst O(n log n). Searching √n tags √n times costs O(n); insertion-sorting √n workspace keys also costs O(n). In-place configurations externally allocate O(1) machine words; borrowed O(√n) records remain inside the input. Optional external buffers change this. Ordered-input skipping can approach O(n). Established implementations are stable when extraction, ties, and restoration follow their rules.","why":"Whole blocks avoid repeated long individual shifts. Extraction, tagging, restoration, and edges add considerable overhead.","use":"Useful when stability must avoid a full second record array. Act out these operations, then use tested production code.","details":"Tags describe original block order, not value-based insertion points. Restore every borrowed record. Scarce-key and uneven-block handling are necessary parts of the complete algorithm."},"sources":[{"title":"Grailsort author implementation","url":"https://github.com/Mrrl/GrailSort"},{"title":"WikiSort author: in-place blocks, buffers, tags","url":"https://github.com/BonzaiThePenguin/WikiSort/blob/master/Chapter%203.%20In-Place.md"},{"title":"WikiSort author implementation","url":"https://github.com/BonzaiThePenguin/WikiSort/blob/master/WikiSort.c"}],"seq":33,"refnos":[62,63,64]},{"id":26,"group":"C","zh_title":"快速排序：Lomuto 分区","en_title":"Quicksort with Lomuto partitioning","kind":"algorithm","zh_alias":"快排；本节采用 Lomuto 单向扫描分区","en_alias":"Quicksort; Lomuto single-scan partitioning","zh":{"foundation":["本节用从 0 开始的位置编号。lo、hi 分别是当前排的第一和最后位置，两端都属于这一排。","枢轴只是临时挑来作分界标准的数。这里挑最后一项；其他记录照旧保留。","分区不是完全排序，而是把“小于等于标准”的放一边，把“更大”的放另一边。交换两个格子时，两个值都保留。","a 是这排数的名字，a[i] 就是编号 i 的格子里那项；方括号是在指定位置，不是做乘法。"],"idea":"从左到右看一次，把不大于末尾枢轴的数收集到前面。最后把枢轴夹到两组之间。这一项此时已经到正确位置；再对左右两组重复，所有位置就逐渐确定。","steps":["若范围少于两项，结束。保存末项的值 p，令 b=lo：b 指向前面已收集小项区之后的第一个位置；最开始小项区为空。","令扫描位置 j 从 lo 走到 hi−1，暂时不扫描枢轴格。若 a[j]≤p，交换 a[j] 与 a[b]，然后 b 加一。若 a[j]>p，不交换，只让 j 继续。","为什么可交换？b 到 j 之间已经看过的项都大于 p，把其中一项换到 j，并不会破坏小项区；j 自己等于 b 时自交换也无害。","扫描结束，把末尾枢轴与 a[b] 交换。b 前的项全≤p，b 后的项全>p，所以 b 上这个枢轴无需再参与排序。","对 [lo,b−1] 和 [b+1,hi] 分别重做这些动作。每次留下一个固定位置，范围变小，单项或空范围停止。可以用函数调用记住待做范围，也可自己用列表记录它们。"],"example":["[4,1,3,2] 中 p=2、b=0。j=0 看 4，4>2，留下；j=1 看 1，1≤2，交换位置 1 与 0，成为 [1,4,3,2]，b=1。","看 j=2 的 3，3>2，留下。扫描结束，交换 b=1 上的 4 与末尾 2，成为 [1,2,3,4]。位置 1 的 2 固定，左组 [1]、右组 [3,4]。","左组单项停止。右组末项 p=4，扫描 3 时它≤4，只和自己交换；枢轴 4 最后也和自己交换，右组已排好。结果 [1,2,3,4]。这个例子刚好一次分区就形成全局顺序，通常左右组仍要继续处理。"],"cost":"设 n 为记录数。一轮分区扫描整个当前范围，所以成本随范围长度增长。若每次分成大小接近的两组，约有 log₂n 层，最好 Θ(n log n)；随机打乱输入或随机选枢轴后期望 Θ(n log n)。每次只分出一项则要扫描 n、n−1、n−2…项，最坏 Θ(n²)。本规则全相等时每项都进左组，也会退化。通常调用栈 O(log n)，最坏 O(n)；每次只调用较小组、较大组用循环可把栈限在 O(log n)。不稳定。","why":"扫描动作很简单，许多小项能直接前移。但末项若总是极值，大部分范围要反复扫描；相等项多也不利。自交换和记录移动有真实成本。","use":"适合理解快排基本机制和核对分区逻辑。通用工程实现通常增加随机枢轴、三路处理或退化回退。","details":"固定的是这次枢轴的一项，不是前面全部数。边界 b 两边再排时必须排除 b。若改成严格小于 p，等值分组会变，但单侧等值退化仍可能存在。"},"en":{"foundation":["Positions here start at zero. lo and hi are the first and last positions of the current range, both included.","A pivot is a temporarily chosen comparison value. This version chooses the last item without removing it.","Partitioning separates values into groups; it does not order every item within those groups.","Notation a[i] means the item in slot i of the row named a. Brackets select a position; they do not mean multiplication."],"idea":"Scan from left to right and collect items no larger than the last-item pivot near the front. Then put the pivot between the two groups. That pivot item is finished. Repeat the operation on the two remaining groups.","steps":["Stop for fewer than two items. Save the last value as p and set b=lo. Position b is the first slot after the collected small-item group, which initially contains nothing.","Scan j from lo through hi−1, leaving the pivot slot untouched. If a[j]≤p, exchange a[j] with a[b], then increase b. Otherwise leave it and continue scanning.","Why is the exchange safe? Already scanned items from b to just before j are larger than p. Moving one of them to j leaves the small-item group intact. When b=j, exchanging a slot with itself changes nothing.","After the scan, exchange a[b] with the pivot at hi. Everything before b is at most p; everything after b is larger. The pivot at b has its final position.","Apply these instructions separately to [lo,b−1] and [b+1,hi]. Exclude b. Empty ranges and singletons stop. Calls can remember unfinished ranges, or an explicit list can do that job."],"example":["Use [4,1,3,2], with p=2 and b=0. Scan 4: it is larger, so leave it. Scan 1: exchange it with slot b, producing [1,4,3,2], then set b=1.","Scan 3: it is larger than 2, so leave it. Exchange the final pivot 2 with slot 1 containing 4. The row becomes [1,2,3,4]. Pivot 2 is fixed; unfinished ranges are [1] and [3,4].","The singleton stops. In [3,4], pivot 4 admits 3 into the small group through a self-exchange, and the final pivot exchange also changes nothing. All items are ordered. This lucky trace becomes globally ordered early; other partitions usually leave more work within both groups."],"cost":"Let n count records. A partition scans its entire range. Roughly equal splits give about log₂n levels and best Θ(n log n) time. Random input or randomized pivots give expected Θ(n log n). Repeated one-item splits scan n+(n−1)+… items, giving worst Θ(n²). All-equal input also degenerates with this ≤ rule. Stack space is usually O(log n), worst O(n), or always O(log n) when only the smaller side recurses. The algorithm is unstable.","why":"Simple scans and exchanges are cheap, but repeatedly choosing an extreme pivot rescans almost the whole input. Equal values need additional care.","use":"A clear introduction to quicksort partitioning. General-purpose versions usually add pivot sampling, equal-key grouping, or a fallback.","details":"Only the pivot item is final, not every item before it. Use this scheme’s recursion boundaries. Changing ≤ to < changes equal-key placement without automatically removing its bad equal-key case."},"sources":[{"title":"MIT OpenCourseWare: Quicksort lecture","url":"https://ocw.mit.edu/courses/6-046j-introduction-to-algorithms-sma-5503-fall-2005/resources/lecture-4-quicksort-randomized-algorithms/"},{"title":"Aumüller et al.: Lomuto-based partitioning analysis","url":"https://arxiv.org/abs/1810.12047"}],"visual":{"rows":[{"zh":"末尾枢轴 2；4 大于 2，略过","en":"Pivot 2 at end; skip 4 > 2","values":[4,1,3,2],"active":[0,3],"fixed":[],"moved":[]},{"zh":"1 ≤ 2：交换 1 和前部 4","en":"1 ≤ 2: exchange 1 and front 4","values":[1,4,3,2],"active":[0,1,3],"fixed":[],"moved":[0,1]},{"zh":"3 > 2；再把枢轴换到边界","en":"3 > 2; place pivot at boundary","values":[1,2,3,4],"active":[1,3],"fixed":[1],"moved":[1,3]},{"zh":"左右子区间完成","en":"Finish the left and right regions","values":[1,2,3,4],"active":[],"fixed":[0,1,2,3],"moved":[]}]},"seq":34,"refnos":[65,66]},{"id":27,"group":"C","zh_title":"快速排序：Hoare 分区","en_title":"Quicksort with Hoare partitioning","kind":"variant","zh_alias":"Hoare 原始分区；双向扫描快排变体","en_alias":"Original Hoare partition scheme; two-pointer quicksort variant","zh":{"foundation":["这里位置从 0 编号。lo、hi 都包括在当前范围内；靠左中点就是 (lo+hi) 除以 2 后去掉小数部分。","两个指针是两个位置编号：一个向右找，一个向左找；它们不会自动移动，步骤要明确规定每次移多少。","枢轴只是一份保存的数值。原来存它的记录可以被交换到别处，但比较标准不变。","a 是这排数的名字，a[i] 就是编号 i 的格子里那项；方括号是在指定位置，不是做乘法。"],"idea":"从两头找“站错边”的数：左边找不小于枢轴的，右边找不大于枢轴的，把这一对交换。扫描碰到或越过时，便得到能分别继续排的两组。返回的位置只是分界；不能当成枢轴已固定的位置。","steps":["范围少于两项就停止。取下中点 floor((lo+hi)/2) 的值为 p；floor 的意思是向下取整。设 i=lo−1、j=hi+1，先站在范围外。不要改用上中点；两项有序时可能分出没有缩小的范围。","先让 i 加一，再只要 a[i]<p 就继续加一；遇到≥p 的项停下。让 j 先减一，再只要 a[j]>p 就继续减一；遇到≤p 的项停下。","若 i≥j，不交换，返回 j。左范围 [lo,j] 的项都≤p，右范围 [j+1,hi] 的项都≥p。这里允许两组都有等值项。","若 i<j，交换两处。较小或相等项去了左边，较大或相等项去了右边；回到扫描步骤，两指针都先移动一次，避免在等值处永远打转。","分别排包含 j 的 [lo,j] 与 [j+1,hi]，重复同样规则。下中点与上述扫描使两个子范围比原范围小；零项或一项停止。不要丢掉分界 j，它没有被保证固定。"],"example":["[4,1,3,2]，lo=0、hi=3，下中点索引 1 的值是 p=1。i 从 −1 前进一步，在 4 停；j 从 4 后退，跳过 2、3，在位置 1 的 1 停。","交换 4、1，成为 [1,4,3,2]。下一轮 i 前移到位置 1 的 4；j 后移到位置 0 的 1。i≥j，返回 j=0。两组为 [1]、[4,3,2]。","右组边界 1..3，下中点 2 的值 p=3。左扫描停 4、右扫描停 2，交换成为 [1,2,3,4]。再移动后都停在位置 2 的 3，返回分界 2，留下 [2,3]、[4]。","[2,3] 的下中点是 2；两扫描相遇在它的左位置，分成 [2]、[3]。全体停止，结果 [1,2,3,4]。本例某些分界刚好也是最终位置，但算法没有这个承诺。"],"cost":"设 n 是项数。每次两头扫描总共经过当前范围的项；一项不会在同一轮被无限追看。均衡分区最好 Θ(n log n)，随机输入或恰当随机枢轴下期望 Θ(n log n)，坏分区最坏 Θ(n²)。全等时两指针不断对称前进，仍分成近半两组，时间 Θ(n log n)，没有三路快排的一轮结束优势。通常栈 O(log n)，最坏 O(n)；较小侧调用、大侧循环可把栈限制到 O(log n)。不稳定。","why":"一个交换同时纠正两边的一项，通常比只从一边收集少一些交换。不过次数少不代表任何数据上都快；分区是否均衡仍然关键。","use":"常用作高效数组快排的分区方式，前提是仔细配合中点选择、等值停止和子范围边界。","details":"有的教材把最后放回枢轴的双向扫描也称 Hoare 风格。那个版本会固定一项，边界不同。本节使用原始返回分界方案，必须保留 j 在左子范围。"},"en":{"foundation":["Use zero-based positions and inclusive endpoints lo and hi. The lower middle position is floor((lo+hi)/2); floor discards the fractional part.","A scanning pointer is a remembered position. Moving it means explicitly adding or subtracting one.","Save the pivot value separately. Its original record may move, but the saved comparison value does not."],"idea":"Look inward for items on the wrong side: the left scan stops on a value at least the pivot, and the right scan stops on one at most the pivot. Exchange the pair. When the scans meet or cross, split at their boundary. This boundary does not certify a final pivot position.","steps":["Stop at fewer than two items. Save the lower-middle value as p. Set i=lo−1 and j=hi+1, just outside the range. Do not substitute the upper middle: a two-item ordered range can then fail to shrink.","Advance i once, then keep advancing while its value is smaller than p. Retreat j once, then keep retreating while its value is larger than p. Stop on equal values as well as misplaced ones.","If i≥j, return j without exchanging. Values in [lo,j] are at most p, and values in [j+1,hi] are at least p. Equal values may appear on both sides.","Otherwise exchange the stopped values and repeat the scans. Each scan starts with its compulsory movement, so equal values cannot trap it at the same positions forever.","Sort [lo,j] and [j+1,hi] using these instructions. Include j in the left range. The lower-middle choice and scan rules make both subranges smaller. Stop at empty ranges and singletons."],"example":["For [4,1,3,2], bounds are 0..3. The lower-middle position 1 gives p=1. The left scan stops at 4. The right scan passes 2 and 3, then stops at 1.","Exchange them to get [1,4,3,2]. Next, i moves to position 1 and j to position 0. They cross. Return boundary 0 and handle [1] and [4,3,2].","For the right range, lower-middle value 3 is the pivot. Exchange stopped values 4 and 2: [1,2,3,4]. The next scans meet at position 2 containing 3, so return boundary 2. The unfinished groups are [2,3] and [4].","The lower-middle pivot 2 splits [2,3] into singletons. The result is [1,2,3,4]. A boundary happened to be final here; do not depend on that coincidence."],"cost":"Let n be the record count. A partition scans across its range once from two directions. Balanced distinct-key splits give best Θ(n log n); suitable randomization gives expected Θ(n log n). Bad splits allow worst Θ(n²). All-equal input splits near the middle but still requires Θ(n log n), rather than finishing in one pass. Stack space is typically O(log n), worst O(n), or O(log n) with smaller-side recursion. The method is unstable.","why":"An exchange corrects one item on each side. Fewer exchanges can help, but balanced subproblems remain essential.","use":"A common array-quicksort mechanism when scan limits and recursive bounds are carefully implemented.","details":"Some two-way schemes finally move the pivot and are called Hoare-style. Their bounds differ. This lesson uses the original boundary-returning scheme: never exclude j as if it were a final pivot."},"sources":[{"title":"Princeton: original Hoare implementation","url":"https://algs4.cs.princeton.edu/23quicksort/QuickHoare.java.html"},{"title":"Sedgewick & Wayne: original Hoare exercise","url":"https://algs4.cs.princeton.edu/23quicksort/"}],"visual":{"rows":[{"zh":"保存中间值 p=1；停在 4 与 1","en":"Save middle value p=1; stop at 4 and 1","values":[4,1,3,2],"active":[0,1],"fixed":[],"moved":[]},{"zh":"交换；之后返回分界 0","en":"Exchange; next return boundary 0","values":[1,4,3,2],"active":[0,1],"fixed":[],"moved":[0,1]},{"zh":"右组 p=3：交换 4 与 2","en":"Right region p=3: exchange 4 and 2","values":[1,2,3,4],"active":[1,3],"fixed":[],"moved":[1,3]},{"zh":"继续按分界递归后完成","en":"Finish recursive boundary splits","values":[1,2,3,4],"active":[],"fixed":[0,1,2,3],"moved":[]}]},"seq":35,"refnos":[67,68]},{"id":28,"group":"C","zh_title":"三路快速排序","en_title":"Three-way quicksort","kind":"variant","zh_alias":"三向快排；肥枢轴快排；分区使用荷兰国旗思路","en_alias":"3-way quicksort; fat-pivot quicksort; Dutch-national-flag partitioning","zh":{"foundation":["把一排分成三种是按值与标准比较：小于、等于、大于。等于不是删除重复数；每条等值记录都要留下。","三个位置把数组分成四区：已知小、已知等、尚未检查、已知大。只有尚未检查区需要继续判断。","交换之后，当前位置换进来的数可能从未检查过，所以不能一律向前走。","a 是这排数的名字，a[i] 就是编号 i 的格子里那项；方括号是在指定位置，不是做乘法。"],"idea":"普通快排对许多等值项可能反复做无用分区。三路快排一次把所有等于枢轴的项集中到中间，中间不用再排，只处理较小和较大两边。","steps":["选一个范围内的值保存为 p。位置从 0 编号，设 lt=lo、i=lo、gt=hi。lo..lt−1 是已知小项；lt..i−1 是等值项；i..gt 尚未检查；gt+1..hi 是已知大项。开始前三个已知区都为空。","只在 i≤gt 时判断 a[i]。若 a[i]<p，交换 a[i] 与 a[lt]，然后 lt、i 各加一。小项进了左区；若换进的是一个等值项，它已经检查过，可以同时前进。","若 a[i]=p，只让 i 加一，中间等值区扩大一项，保留这条记录。","若 a[i]>p，交换 a[i] 与 a[gt]，gt 减一，但 i 不前进。大项已进右区；从右边换来的项还不知道大小，必须再检查一次。","当 i>gt，未知区已经空了。只重排 lo..lt−1 与 gt+1..hi；中间 lt..gt 的每项都等于 p，作为整体完成。子范围少于两项时结束。"],"example":["[3,1,3,2,3]，取 p=3，lt=i=0、gt=4。第一项 3 相等，i 到 1。看到 1<3，交换位置 1、0，变 [1,3,3,2,3]；lt=1、i=2。","位置 2 的 3 相等，i 到 3。2<3，交换位置 3 与 lt=1，变 [1,2,3,3,3]；lt=2、i=4。最后一项相等，i 到 5，未知区空了。","小组 [1,2] 继续排，选 1 作标准。1 相等；2>1，交换自己并缩小右界，留下单项 [2]。最终 [1,2,3,3,3]，三个 3 全保留。","为看清“不前进”：局部 [2,3,1] 取 p=2，看到中间 3 就和右端 1 交换成 [2,1,3]；仍检查同一中间位置的新 1，把它换到左边，得到 [1,2,3]。若直接跳过，就漏查了 1。"],"cost":"设 n 是项数。一轮中每项进入某个已知区，扫描 Θ(n)。全部相等时一轮就完成，最好 Θ(n)。不同键、随机枢轴或随机输入通常期望 Θ(n log n)；枢轴连续极偏时最坏 Θ(n²)。通常栈 O(log n)，最坏 O(n)，采用较小侧调用可把栈限制 O(log n)。交换能跨过等值记录，因此不稳定；中间值相同不等于原身份顺序不变。","why":"大量重复值只需判断一次，不再把等值区拆下去。不同键居多时仍是快排，选坏枢轴依然有反复扫描成本。","use":"重复键多的统计、类别、评分数据很适合；也常作字符串按单个字符分组的基础。","details":"不要在大于分支同时增加 i。三个已知区的边界每一步都要匹配；把等值区遗漏或输出一次，都会丢掉重复记录。"},"en":{"foundation":["Three groups mean smaller than, equal to, and larger than a chosen value. Equal records are retained individually.","Three positions divide the row into known-small, known-equal, unchecked, and known-large regions. Only the unchecked region needs decisions.","After an exchange, an incoming item may be unchecked. Advancing immediately can skip it.","Notation a[i] means the item in slot i of the row named a. Brackets select a position; they do not mean multiplication."],"idea":"Collect all pivot-equal items in the middle during one scan. They need no further sorting by this key. Continue only on smaller and larger groups, avoiding repeated work on duplicates.","steps":["Save pivot value p. With zero-based inclusive bounds, set lt=lo, i=lo, gt=hi. The regions are lo..lt−1 small, lt..i−1 equal, i..gt unchecked, and gt+1..hi large. Initially only the unchecked region exists.","While i≤gt, inspect a[i]. If it is smaller than p, exchange it with a[lt], then advance both lt and i. The small region grows. Any equal item displaced from its boundary was already checked.","If it equals p, advance i only. This enlarges the equal region without removing the record.","If it is larger, exchange it with a[gt] and decrease gt. Keep i unchanged: the incoming right-side item still needs checking.","When i>gt, nothing remains unchecked. Sort only the small and large ranges with these same instructions. The equal range lt..gt is finished. Empty and singleton ranges stop."],"example":["For [3,1,3,2,3], take p=3. The first 3 advances i to 1. The 1 is small, so exchange positions 1 and 0: [1,3,3,2,3], with lt=1 and i=2.","The next 3 advances i to 3. Exchange 2 with the equal-region boundary at lt=1: [1,2,3,3,3], with lt=2 and i=4. The last 3 advances i beyond gt. All three 3s remain.","Sort [1,2] separately using pivot 1. The 1 is equal; the 2 moves into the large region through a self-exchange. Its singleton needs no work. Result: [1,2,3,3,3].","To see why a large-item exchange does not advance i, take [2,3,1] with p=2. Exchange middle 3 with last 1: [2,1,3]. Check the new middle 1 again and move it left, obtaining [1,2,3]. Skipping that check would miss the 1."],"cost":"Let n count items. Each step shrinks the unchecked region, so one partition costs Θ(n). All-equal input finishes in that pass: best Θ(n). Random distinct keys or randomized pivots give expected Θ(n log n); extreme splits allow worst Θ(n²). Stack is typically O(log n), worst O(n), or O(log n) with smaller-side recursion. The method is unstable because distant exchanges can reorder equal records.","why":"Duplicates leave further work immediately. With mostly different keys, the method retains quicksort’s dependence on pivot quality.","use":"Useful for categories, scores, and other repeated keys; also the foundation of character-based string partitioning.","details":"Do not advance i in the larger-than branch. Keep all equal records rather than replacing the group by one representative. An equal-value group need not preserve the original order of its record identities."},"sources":[{"title":"Princeton: Quick3way implementation","url":"https://algs4.cs.princeton.edu/23quicksort/Quick3way.java.html"},{"title":"Wild: Quicksort with many equal keys","url":"https://arxiv.org/abs/1608.04906"}],"visual":{"rows":[{"zh":"枢轴 3；检查 1","en":"Pivot 3; inspect 1","values":[3,1,3,2,3],"active":[0,1],"fixed":[],"moved":[]},{"zh":"1 小于 3，交换到左侧","en":"1 < 3; exchange to left","values":[1,3,3,2,3],"active":[1,3],"fixed":[],"moved":[0,1]},{"zh":"2 小于 3；中段三个 3 已完成","en":"2 < 3; equal middle is finished","values":[1,2,3,3,3],"active":[1,3],"fixed":[2,3,4],"moved":[1,3]},{"zh":"再排左侧 [1,2]，完成","en":"Sort left [1,2]; done","values":[1,2,3,3,3],"active":[],"fixed":[0,1,2,3,4],"moved":[]}]},"seq":36,"refnos":[69,70]},{"id":29,"group":"C","zh_title":"双枢轴快速排序","en_title":"Dual-pivot quicksort","kind":"variant","zh_alias":"双轴快排；Yaroslavskiy 风格双枢轴分区","en_alias":"Two-pivot quicksort; Yaroslavskiy-style dual-pivot partitioning","zh":{"foundation":["两个枢轴是两个保存的标准值 p≤q。它们把值分成“小于 p”“从 p 到 q”“大于 q”三段。","扫描区只是一段还没判断的格子；前后都可留已经分类的记录，不需要立刻让它们内部有序。","末尾换来一个新数时要重新判断，这一点和三路分区相同。","a 是这排数的名字，a[i] 就是编号 i 的格子里那项；方括号是在指定位置，不是做乘法。"],"idea":"把两个标准放在两端，扫描中间。很小的向左收集，很大的向右收集，其余留在中段。最后把两个标准放到各自边界，再分别排三段。本节展开一个简单可执行的教学分区；成熟 Yaroslavskiy 实现会用更精细的扫描和优化。","steps":["少于两项停止。比较两端，若左大右小就交换，保存左值 p、右值 q。设 lt=lo+1、gt=hi−1、i=lt；两端暂不参与扫描。","当 i≤gt，若 a[i]<p，和 a[lt] 交换，lt、i 各加一。若 p≤a[i]≤q，只让 i 加一，这项属中段。","若 a[i]>q，和 a[gt] 交换，再把 gt 减一。暂不移动 i，回头判断换来的项；它可能小于 p、位于中段或仍大于 q。","未知区空后，lt 减一、gt 加一。交换左端枢轴与 a[lt]，交换右端枢轴与 a[gt]。两个枢轴夹住已分类的三段。","分别处理 lo..lt−1、lt+1..gt−1、gt+1..hi，不再含这两项。若 p=q，中段全相等，可整段跳过。若 p≠q，中段只是落在两值之间，仍要排。单项和空段停止。"],"example":["[4,1,5,2,3] 先交换端点 4、3，成为 [3,1,5,2,4]，p=3、q=4；lt=i=1、gt=3。1<3，和自己交换，lt=i=2。","看到 5>4，交换位置 2 与 3，成为 [3,1,2,5,4]，gt=2。i 仍为 2，重新看到 2<3，和 lt 的自己交换，lt=i=3。i>gt，未知区空。","lt 减到 2，左枢轴 3 与位置 2 的 2 交换，得到 [2,1,3,5,4]。gt 加到 3，右枢轴 4 与位置 3 的 5 交换，得到 [2,1,3,4,5]。","枢轴 3、4 固定；左段 [2,1] 用端点比较换成 [1,2]，中段为空，右段 [5] 单项。完成 [1,2,3,4,5]。"],"cost":"设 n 是项数。一轮仍扫描当前范围，但一项可能先与 p 再与 q 比较，并有搬动。不同键、良好采样或随机输入通常期望 O(n log n)，最坏 O(n²)；把两端直接作枢轴没有普遍速度保证。本教学版若两标准相同就跳过中段，全等最好 Θ(n)。通常栈 O(log n)，未经控制最坏 O(n)。不稳定。各具体双枢轴实现的精确比较数不同，不能混成一个结论。","why":"一轮可留下三块待做范围，可能减少后续层数，却增加一轮内部判断和交换。是否更快还受采样、重复值、缓存和机器影响。","use":"适合研究多标准分区，以及了解一些语言库为什么采用双枢轴快排。","details":"千万不要因为中段在 p 与 q 之间就认为中段已经有序。例如 [2,7,3,8] 的中间两项仍可能要再排。这里的步骤不声称逐行复制某个语言运行库的实现。"},"en":{"foundation":["Two pivots are saved values p≤q. They define values below p, between p and q inclusive, and above q.","A classified region is not necessarily internally ordered. It only satisfies its value limits.","After exchanging with the unchecked right end, inspect the incoming item before moving on.","Notation a[i] means the item in slot i of the row named a. Brackets select a position; they do not mean multiplication."],"idea":"Place comparison values at both ends, classify the interior, then move the pivots to the group boundaries. Continue on the three remaining regions. This lesson uses a simple executable teaching partition; production Yaroslavskiy implementations refine its scans and pivot selection.","steps":["Stop for fewer than two items. Compare the endpoints and exchange them if needed. Save their values as p and q. Set lt=lo+1, gt=hi−1, and i=lt, leaving both endpoint pivots outside the scan.","While i≤gt, a value below p exchanges with a[lt]; advance lt and i. A value between p and q remains in the middle; advance i only.","A value above q exchanges with a[gt]; decrease gt but retain i. Inspect the incoming item again. It may belong to any of the three groups.","When no unchecked items remain, decrease lt and increase gt. Exchange the left pivot into lt and the right pivot into gt. Their two positions are now finished.","Sort lo..lt−1, lt+1..gt−1, and gt+1..hi separately. If p=q, the entire middle equals that value and can be skipped. If p differs from q, the middle still needs sorting. Empty ranges and singletons stop."],"example":["Use [4,1,5,2,3]. Exchange endpoints to get [3,1,5,2,4], so p=3 and q=4. Start lt=i=1 and gt=3. The 1 is small; a self-exchange advances lt and i to 2.","The 5 exceeds q. Exchange positions 2 and 3: [3,1,2,5,4], with gt=2. Keep i=2 and inspect incoming 2. It is below p, so its self-exchange advances lt and i to 3.","The scan ends. Decrease lt to 2 and exchange pivot 3 with value 2: [2,1,3,5,4]. Increase gt to 3 and exchange pivot 4 with value 5: [2,1,3,4,5].","The pivots are fixed. Sort left range [2,1] by exchanging its endpoints. The middle is empty and the right [5] stops. Result: [1,2,3,4,5]."],"cost":"Let n count records. Each partition scans its range, but an item may need both pivot comparisons and exchanges. Suitable sampling or random distinct input commonly gives expected O(n log n). Worst time is O(n²); endpoint pivots alone do not prevent bad splits. With the stated equal-pivot shortcut, all-equal input gives best Θ(n). Stack is typically O(log n), worst O(n) without control. The method is unstable. Different dual-pivot implementations have different exact comparison counts.","why":"Three subproblems can reduce later levels, but classification costs more within each level. Sampling, equal values, cache behavior, and hardware decide whether that trade pays.","use":"Useful for understanding multi-pivot partitioning and some standard-library sorting choices.","details":"The middle is range-limited, not ordered. Continue sorting it unless p=q. These teaching steps do not claim to reproduce a particular runtime library line for line."},"sources":[{"title":"Princeton: dual-pivot teaching implementation","url":"https://algs4.cs.princeton.edu/23quicksort/QuickDualPivot.java.html"},{"title":"Wild & Nebel: Yaroslavskiy analysis","url":"https://arxiv.org/abs/1310.7409"}],"seq":37,"refnos":[71,72]},{"id":32,"group":"C","zh_title":"样本排序","en_title":"Samplesort","kind":"family","zh_alias":"抽样排序；Sample sort；多路分区家族","en_alias":"Sample sort; multiway sampled partitioning family","zh":{"foundation":["桶是一组临时收集的记录；进桶不等于桶内有序。桶按数值范围排序，因此前桶所有值≤后桶所有值。","样本是从原输入选出少量值的副本，用来决定界限。原记录仍要正常分类，样本副本不能额外加到输出。","有多个升序界限时，可以比较中间界限、缩小候选范围，避免每次从第一个界限逐个试。"],"idea":"用小样本猜出几个能把数据分得较均匀的界限，把所有记录放进相应范围桶，分别排桶，再按桶次序接起来。它用值比较找桶，不要求键是能直接当编号的整数。","steps":["确定桶数 b，抽取比 b 多一些的样本。把样本排好，例如按插入动作把下一值插进已排前部。再从排好样本的约等间隔位置取 b−1 个界限；样本多一些通常更不易选偏，但没有一次必定均匀的承诺。","明确每个界限的归属，例如等于界限进左边桶。对每条记录用界限比较找到唯一桶。比较中间界限后，一次可以排除一半候选桶；最终得到范围编号。","最容易的教学实现给每桶一个列表，按输入先后把完整记录追加过去。也可先统计数量、计算起止位置，再通过交换放成原数组内的连续桶；后者边界管理更复杂。","每桶分别排：短桶拿住下一项、右移更大前项、插入；大桶可再取样划分。若所有值或界限都相等、或者整桶还全落入一个同样大子桶，就停止这条分桶路线，检测全等或换成有最坏保证的排序。例如反复二分小排、比较两排头输出，可保证继续缩小。","从最低范围桶开始，按各桶已经排好的次序输出。无需再跨桶比较，因为界限已确保前桶不会有超过后桶的值。"],"example":["输入 [7,2,5,1,6,3]，教学界限取 2、6，范围为 x≤2、2<x≤6、x>6。可从样本 [7,2,5,1,6] 排得 [1,2,5,6,7] 后，取其中 2、6；这些是副本，原 2、6 还在输入。","逐项分类：7>6 进第三桶；2≤6 且≤2 进第一桶；5≤6 且>2 进第二桶；1 进第一；6 进第二；3 进第二。桶为 [2,1]、[5,6,3]、[7]。","第一桶拿住 1、移 2，成 [1,2]。第二桶先 [5,6] 无需挪；拿住 3，依次移 6、5，再写 3，成 [3,5,6]。单项 [7] 保留。","顺次接桶，得 [1,2,3,5,6,7]。没有再加一次样本 2、6，没有漏掉输入项。"],"cost":"设 n 为项数、b 为桶数。用平衡界限树找桶约每项比较 log₂b 次，再移动一次；均衡后大桶不断缩小，良好随机采样通常给期望 O(n log n)。这是一家族，最好取决于桶数、基础方法和数据，不能统一写一个固定最好界。天真版可能 O(n²)，不缩小还可能不结束；检测失败并换有保证方法可给 O(n log n) 最坏。列表版额外 O(n+b) 空间。输入顺序追加且桶内稳定才整体稳定。","why":"一次分出多块，还可把不同桶分给不同工作者。但采样、界限比较、暂存都有成本；样本选偏会把大部分工作留在一个桶。","use":"经常用于并行和分布式排序；在顺序学习中能看清分桶与桶内排序是两件事。","details":"重复界限不能定义相互重叠的归属。全等桶要保留全部记录并直接结束。并行速度还要算工作者数量与传输，不能用这里的顺序工作量直接宣布实际秒数。"},"en":{"foundation":["A bucket collects records in a value range; collection alone does not order them. Ranges are arranged so every earlier-bucket key precedes every later-bucket key.","A sample copies a few input values to choose boundaries. Original records still participate once in normal classification; sample copies are not extra output.","Comparing with a middle boundary can eliminate half the candidate buckets."],"idea":"Use a small ordered sample to choose several boundaries, distribute all records into their value ranges, sort each bucket, then read buckets in range order. Bucket membership is determined by comparisons, rather than using integer keys directly as array positions.","steps":["Choose b buckets and a sample larger than b. Sort the sample, for example by holding each next value and inserting it after smaller predecessors. Select b−1 roughly evenly spaced sample values as splitters. Oversampling improves balance likelihood, not certainty.","Define where boundary-equal values belong, such as the bucket on the left. For each input record, compare with middle splitters to narrow the possible ranges until exactly one bucket remains.","A simple buffered version appends records to bucket lists in input order. An in-place variant counts bucket sizes, establishes contiguous ranges, and exchanges records into them; that requires additional boundary tracking.","Sort each bucket. For a tiny one, hold its next item, shift larger predecessors right, and fill the opening. Larger buckets may repeat sampling. Detect all-equal buckets and partitions that do not shrink. Finish equals immediately or switch to a guaranteed method, such as repeatedly splitting pieces and joining ordered fronts.","Output the ordered buckets from lowest range upward. No cross-bucket merge is needed because the boundaries already order their ranges."],"example":["Use [7,2,5,1,6,3] with teaching splitters 2 and 6. The ranges are x≤2, 2<x≤6, and x>6. A sample [7,2,5,1,6] sorts to [1,2,5,6,7], from which 2 and 6 can be chosen. Original 2 and 6 still occur in the input.","Classify in order: 7 goes third; 2 first; 5 second; 1 first; 6 second; 3 second. The buckets are [2,1], [5,6,3], and [7].","Insert 1 before 2 in the first bucket. In the second, 5 and 6 already precede one another; hold 3, shift 6 and 5, then write 3. The ordered buckets are [1,2], [3,5,6], [7].","Read them consecutively: [1,2,3,5,6,7]. Sample values are not appended again."],"cost":"Let n count records and b count buckets. Balanced splitter search takes about log₂b comparisons per item, plus movement. Good randomized samples and shrinking recursion give expected O(n log n). This family has no single best-case formula across all bucket policies and leaf sorters. Naive versions can take O(n²) or fail to shrink; guarded variants can guarantee O(n log n). Buffered lists commonly use O(n+b) extra space. Stability requires order-preserving distribution and stable bucket sorting.","why":"Many independent buckets reduce later problem sizes, but sampling and storage cost work. Skew can leave most items in one bucket.","use":"Common in parallel and distributed sorting, and useful for separating distribution from actual internal ordering.","details":"Give equal values one unambiguous bucket. All-equal detection must retain every record. Parallel elapsed time additionally needs worker and communication assumptions."},"sources":[{"title":"Frazer & McKellar: original samplesort paper","url":"https://research.ibm.com/publications/samplesort-a-sampling-approach-to-minimal-storage-tree-sorting"},{"title":"Axtmann et al.: in-place parallel superscalar samplesort","url":"https://arxiv.org/abs/1705.02257"}],"seq":38,"refnos":[73,74]},{"id":36,"group":"C","zh_title":"树排序与平衡树变体","en_title":"Tree sort and balanced-tree variants","kind":"family","zh_alias":"二叉搜索树排序；BST sort；平衡树排序是其变体","en_alias":"Binary-search-tree sort; BST sort; balanced-tree variants","zh":{"foundation":["树节点是存一条记录、以及“左边下一节点在哪里、右边下一节点在哪里”的小盒子。没有下一节点就记为空。第一盒叫根。","查找树约定：比当前节点小的放左分支，大的放右分支；这个约定对整个分支都成立，不只是紧邻孩子。","读树不能直接按创建盒子的次序。要先读左分支，再读当前盒，再读右分支；每个节点这样做，就按值从小到大输出。","旋转只改少量连接。例如右孩子提升到父上方时，旧父成它左孩子，提升者原来的左分支接到旧父右边；中间值仍在中间。"],"idea":"把记录逐条安放到查找树中，每遇一个节点就判断该向左还是向右，直到找到空连接。树保存了小与大的关系，最后按“左、当前、右”读出有序结果。若树变成一根很长的链，查找会很慢；平衡版本会转动局部连接，避免长期这样。","steps":["从空树开始，第一记录创建根。插下一条 x 时，从根比较。x 小则走左连接，大则走右连接；连接为空时建新节点填上去。新节点不需要比较所有旧记录，只沿这一条路径。","相等时不能覆盖旧节点。最容易稳定的做法在同键节点里追加原记录到队列，读节点时按队列到达次序全部输出；另一种是把原输入编号作为第二比较条件。","读出时，若节点为空就返回。否则先完成左分支，再输出当前节点队列，再完成右分支。调用栈记住“做完左边之后还要回来读谁”。也可自己用列表记住这些节点，避免函数层层调用。","普通树不改形状。AVL 版本给每节点存高度：空连接高度零，节点高度为一加左右较大高度。从新节点向根更新；某处左右高度差超过一，就检查较高一侧的孩子向哪边偏。","若父和孩子向同一边偏，做一次旋转；若拐了弯，先把孩子向另一方向转，再转父。左旋具体是：父 p 的右孩子 x 上升，x 原左分支接 p 的右边，p 成 x 的左孩子，旧上层连接改指 x。右旋对称，之后重新算受影响高度。","树全部建好后再读出。旋转保持“左边较小、右边较大”的关系，所以输出规则无需改。红黑树、B 树、Treap 也可用这个建结构再顺序读取的框架，但平衡动作各不一样。"],"example":["插 [4,1,3,2]：4 是根。1<4，接到 4 左边。3<4 向左，到 1；3>1，接 1 右边。2<4 向左，2>1 向右，到 3；2<3，接 3 左边。四项都在树里，但创建顺序没有排好。","从根 4 先走左节点 1。1 左边空，先输出 1；读其右节点 3，先读 3 左边的 2，输出 2；再输出 3；最后返回输出根 4。得到 [1,2,3,4]。","另看平衡动作，插 [1,2,3] 会成 1 的右孩子 2、2 的右孩子 3。AVL 发现根左右高度 0、2，相差二，且右孩子也向右偏。左旋 1：2 提升为根，1 接在它左边、3 留右边。","新树先读 1、再 2、再 3，仍得到 [1,2,3]。旋转改变的是路径长短，没改变数值顺序。若 2 原有左分支，其值介于 1、2 之间，转到 1 的右边正好。"],"cost":"设 n 为记录数、h 为树高。一次插入比较路径上 h 个节点左右；树矮时约 log₂n，长链时可能 n。普通不同键 BST 最好 Θ(n log n)，随机插入期望 Θ(n log n)，最坏 Θ(n²)。AVL、红黑等保证整体 O(n log n)，读出 Θ(n)。相等都存同节点时，全等可 Θ(n)。节点与队列额外 O(n)，读取等待空间 O(h)，普通树最坏 O(n)，平衡树 O(log n)。队列或原编号规则正确则稳定。","why":"树矮时一次比较排除一个大分支。顺序数据插入普通树反而容易长链，每次都走越来越远；平衡要多改连接，却给路径上限。","use":"本来就需要反复按值查找、插入、顺序遍历的资料，树结构很有用。只为一次数组排序时，分配节点和间接访问可能不划算。","details":"红黑树用颜色限制黑节点路径长度，通过换色和旋转控制高度；B 树一个节点容多个升序键，满节点分裂，中间键上移；Treap 用额外随机优先级，通过旋转让小优先级上升，平衡为概率保证。它们不是普通 BST 自动具有的性质。"},"en":{"foundation":["A tree node is a small container holding a record and two links, left and right. An absent link is empty. The first node is the root.","The search-tree rule places smaller keys throughout the left branch and larger keys throughout the right branch, not just in immediate children.","Ordered reading visits the left branch, then the current node, then the right branch. Apply that rule at every node.","Rotation reconnects a few links. Raising a right child puts the old parent on its left; the raised child’s old left branch becomes the old parent’s right branch."],"idea":"Insert records by following smaller-left and larger-right decisions until an empty link is found. The tree remembers key relationships. Reading left, node, right produces ordered output. A tall chain makes insertion slow; balanced variants change local connections to keep searches short.","steps":["Create an empty tree. The first record becomes root. For each later x, compare at root, follow left if smaller and right if larger, and repeat. At an empty link create its node. Only that path is searched.","Never replace an existing equal record. One stable policy keeps an arrival-order queue at each equal-key node, outputting every queued record. Another compares key followed by original position.","For output, an empty link returns immediately. Otherwise completely read the left branch, output the node’s records, and completely read the right branch. Suspended calls remember where to return after reading the left side; an explicit node stack can do the same.","An ordinary tree makes no shape adjustments. An AVL variant stores height: empty links have height zero, and a node has one plus its larger child height. Update heights toward root after insertion. If left and right differ by more than one, inspect the direction of the taller child’s taller branch.","Matching directions need one rotation; a turn needs two, first at the child, then at its parent. For a left rotation at p, raise right child x, transfer x’s old left branch to p’s right link, make p the left child of x, and reconnect the old upper link to x. Right rotation mirrors this. Recompute changed heights.","Once insertion finishes, read the tree in order. Rotations preserve key ranges, so reading rules remain unchanged. Red–black trees, B-trees, and treaps support the same sorting framework through different balance rules."],"example":["Insert [4,1,3,2]. Make 4 root. Put 1 left of 4. For 3, go left from 4, then right from 1. For 2, go left from 4, right from 1, then left from 3. All records exist, but creation order is not sorted output.","Read root 4’s left branch first. Node 1 has no left branch, so output 1. Its right node 3 first reads left child 2, producing 2, then outputs 3. Return to output 4: [1,2,3,4].","Separately, inserting [1,2,3] into a plain tree forms a right chain. AVL detects root child heights zero and two. Since the taller child also leans right, rotate left at 1. Root becomes 2, with 1 left and 3 right.","Reading still yields [1,2,3]. An old left branch of 2, if present, contains values between 1 and 2 and correctly transfers to 1’s right link."],"cost":"Let n count records and h be tree height. Insertion follows a path of up to h nodes. Ordinary distinct-key BST construction is best Θ(n log n), expected Θ(n log n) for random insertion, and worst Θ(n²). AVL and red–black variants guarantee O(n log n) construction plus Θ(n) output. Grouping equals can make all-equal input Θ(n). Nodes and queues use O(n) extra storage; reading uses O(h) stack, worst O(n) for a plain tree and O(log n) for a balanced one. Suitable equal-key queues or original-position ties make it stable.","why":"Short branches discard many possibilities per comparison. A chain searches progressively farther. Balancing adds link updates but limits path length.","use":"Useful when ordered searches and updates are already needed. For one array sort, node allocation and indirect access can be expensive.","details":"Red–black trees use color rules, recoloring, and rotations; B-trees split full multi-key nodes and promote a middle key; treaps rotate according to random priorities and have probabilistic balance. Plain BSTs do not inherit these guarantees."},"sources":[{"title":"Sedgewick & Wayne: binary search trees","url":"https://algs4.cs.princeton.edu/32bst/"},{"title":"Sedgewick & Wayne: balanced search trees","url":"https://algs4.cs.princeton.edu/33balanced/"}],"seq":39,"refnos":[75,76]},{"id":38,"group":"C","zh_title":"希尔排序与增量变体","en_title":"Shellsort and gap-sequence variants","kind":"algorithm","zh_alias":"缩小增量排序；Shell sort","en_alias":"Diminishing-increment sort; Shell sort","zh":{"foundation":["插入排序拿住下一项，向左找位置，把挡路的大项右移。本方法先把“一格”改成“隔 h 格”。","间隔 h=4 时，位置 0、4、8…是一小排，1、5、9…是另一小排。它们交错占同一个数组，不必复制出来。","某一间隔的小排都排好，叫 h 有序；相邻项仍可能颠倒，不是全排完成。","最后 h=1 时只有一小排，覆盖全数组，插入才保证全局升序。","a 是这排数的名字，a[i] 就是编号 i 的格子里那项；方括号是在指定位置，不是做乘法。"],"idea":"让远处的错位数先大步移动，再缩短步子，最后普通插入。先缓解长距离错位，可能让最后一格一格的插入省很多搬动。间隔选法决定速度，不能只给 Shellsort 一个通用复杂度。","steps":["选递减正整数间隔，必须以一结束。Knuth 从 1 开始反复算 3h+1，得到 1、4、13、40…，取适合数组的那些倒用；大于等于数组长度的间隔没有需比较的小排。","对某间隔 h，扫描 i 从 h 到 n−1。拿住 x=a[i]，令空位 j=i。只要 j≥h 且 a[j−h]>x，就把前项搬到 j，再让 j 减 h。","不能继续时把 x 写进 j。它插到这一交错小排的正确位置，其他小排不受这次动作影响。按 i 顺序做完，就将所有交错小排分别插入排序。","换较小 h，重新扫描。新小排关系不同，仍要比较；旧轮的作用是减少远距离混乱。","h=1 完成后结束。空、单项不用处理。每次拿住 x 必须写回；j<h 时没有前方同排项，要停，不能读负编号。"],"example":["[8,1,6,2,7,3,5,4] 用间隔 4、1。h=4，i=4 拿 7，比位置 0 的 8 小，移 8、写 7，得 [7,1,6,2,8,3,5,4]。i=5 的 3 在 1 后不移；i=6 拿 5，比位置 2 的 6 小，移 6、写 5，得 [7,1,5,2,8,3,6,4]；i=7 的 4 在 2 后不移。","换 h=1。插 1、移 7，得 [1,7,5,2,8,3,6,4]。插 5、移 7，得 [1,5,7,2,8,3,6,4]。","插 2、移 7 和 5，得 [1,2,5,7,8,3,6,4]。8 不动。插 3、移 8、7、5，得 [1,2,3,5,7,8,6,4]。","插 6、移 8 和 7，得 [1,2,3,5,6,7,8,4]。插 4、移 8、7、6、5，得 [1,2,3,4,5,6,7,8]。第一轮后的 [7,1,…] 还没全局有序。"],"cost":"设 n 为项数、h 为间隔。每轮至少检查约 n−h 项，还可能反复移项。Knuth 3h+1 最坏 O(n^(3/2))；有序输入仍扫约 log n 个间隔，最好约 Θ(n log n)。不假定普遍精确的随机公式。原始不断减半间隔最坏 Θ(n²)。Pratt 取小于 n 的全部 2^p3^q（p、q 为非负整数），最坏 O(n log² n)，轮数更多。额外 O(1) 空间，不稳定。","why":"单项先跨好几格，末尾的小数可更快到前面。但某些间隔将应比较的项一直分在不同小排，成本拖到最后才发生。","use":"中小数组、操作要简单且不分配副本时有用。间隔选择要参考可靠结论或测量，不能认为越多越好。","details":"Ciura 的经验间隔 1、4、10、23、57、132、301、701 有多种延伸策略，不能全用同一已证界。等值也能被间接越过：[2a,2b,1,3] 在 h=2 后可成 [1,2b,2a,3]，两个 2 的身份顺序改变。"},"en":{"foundation":["Insertion holds an item, shifts larger predecessors, and fills the opening. Shellsort first replaces a one-slot step by h slots.","For h=4, positions 0,4,8,... form one small row and 1,5,9,... another. These interleaved rows need no copies.","Ordering every small row makes the array h-sorted. Adjacent values can still be out of order.","At h=1 there is just the full row, so insertion guarantees complete order.","Notation a[i] means the item in slot i of the row named a. Brackets select a position; they do not mean multiplication."],"idea":"Let misplaced items travel long distances early, shorten the step, and finish with ordinary insertion. Early passes can save later one-slot shifts. The gap sequence determines the guarantee; Shellsort has no single universal time formula.","steps":["Choose decreasing positive gaps ending in one. Knuth starts at 1 and repeatedly uses 3h+1: 1,4,13,40,... . Use suitable gaps backward. A gap at least n has no multi-item row to process.","For gap h, scan i from h through n−1. Hold x=a[i] and set opening j=i. While j≥h and a[j−h]>x, move that predecessor into j and subtract h from j.","Write x into the final opening. This inserts it into its interleaved row without disturbing other rows. Completing the scan orders every row for h.","Use the next smaller gap and scan again. New relationships need comparisons; earlier passes reduce long-distance disorder rather than certify final positions.","Stop after gap one. Empty and singleton inputs need no work. Return every held item and stop looking backward when j<h."],"example":["Use [8,1,6,2,7,3,5,4] with gaps 4 and 1. At i=4, hold 7, shift 8 at position 0, and write 7: [7,1,6,2,8,3,5,4]. The 3 after 1 stays. Insert 5 before 6 across four slots: [7,1,5,2,8,3,6,4]. The 4 after 2 stays.","At gap one, insert 1 by shifting 7: [1,7,5,2,8,3,6,4]. Insert 5: [1,5,7,2,8,3,6,4].","Insert 2 by shifting 7 and 5: [1,2,5,7,8,3,6,4]. Leave 8. Insert 3 by shifting 8,7,5: [1,2,3,5,7,8,6,4].","Insert 6 by shifting 8 and 7: [1,2,3,5,6,7,8,4]. Insert 4 by shifting 8,7,6,5: [1,2,3,4,5,6,7,8]. The gap-four result was still globally unordered."],"cost":"Let n count items and h be the gap. Each pass checks roughly n−h items and may shift repeatedly. Knuth 3h+1 gaps give worst O(n^(3/2)); sorted input still scans about log n gaps, giving best about Θ(n log n). No universal exact random-input formula is assumed. Original halving gaps allow worst Θ(n²). Pratt uses all 2^p3^q below n, for nonnegative p and q, giving worst O(n log² n) with more passes. Extra space O(1); unstable.","why":"Long steps move distant wrong items quickly. Poor gaps can leave important relationships untouched until the final pass.","use":"Modest arrays requiring low memory and simple movements.","details":"Ciura gaps 1,4,10,23,57,132,301,701 have several extension policies, so one bound does not cover every continuation. Indirect equal crossing occurs: [2a,2b,1,3] at gap two becomes [1,2b,2a,3]."},"sources":[{"title":"Princeton: Shell implementation and Knuth bound","url":"https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/Shell.html"},{"title":"Sedgewick & Wayne: elementary sorts","url":"https://algs4.cs.princeton.edu/21elementary/"},{"title":"Poonen: Shellsort bounds and Pratt increments","url":"https://math.mit.edu/~poonen/papers/shell.pdf"}],"seq":40,"refnos":[77,31,78]},{"id":39,"group":"C","zh_title":"漏斗排序","en_title":"Funnelsort","kind":"algorithm","zh_alias":"Funnel sort；缓存无关排序的一种","en_alias":"Funnel sort; a cache-oblivious sorting algorithm","zh":{"foundation":["高速缓存是处理器附近的小块快存储，普通内存更大却较慢。读一个数时，机器常搬来附近整块；连续读取更容易利用已经搬来的数。","两排有序数通过比较两条未用头接排：输出较小者，只前进供给它的头。一边空后，取另一边剩余。","缓冲队列暂存已排好的一批数，先进先出。连续数组环形实现用读头 head、写尾 tail、现有数 count：读后 head 加一且 count 减一，写后 tail 加一且 count 加一；到容量边界绕回 0，不能覆盖未读项。","上游小合并器生产一批，下游消费这一批。暂时队列空，不等于原输入真的结束。","公式只给批量命名：√k 是平方根，k^(3/2)=k×√k。四路时 √4=2、一批为 4×2=8，中间队列容量为 2×8=16；输入少于一批就只生成真实剩余记录。"],"idea":"先排小段，再通过多层小接排器和中间队列接大段。小接排器集中反复处理局部数据，较容易留在缓存；下游需要更多时才叫它再产一批。“缓存无关”表示程序不用知道具体缓存容量，不是无视缓存。","steps":["将 n 项切成约 n^(1/3) 个连续段，各段约 n^(2/3) 项，再分别照同样步骤排。为使教学边界具体，可在 n≤2 时直接插入结束，其他取段数 ceil(n^(1/3))，ceil 表示向上取整；各段长度只差至多一。八项就分两条四项，四项分两条两项。插入时拿住下一项、移开更大前项、填空位。","用 k 路合并器接 k 条有序输入。二路时直接比较两个未用头，输出较小者并前进。较大 k 分成约 √k 组，每组一个 √k 路小合并器输出到中间队列；末级 √k 路再接这些队列。重复构造至常数路。","原始构造的一次 k 路调用最多产约 k³ 项。各中间队列容量约 2k^(3/2)，上游 √k 路一次产约 k^(3/2)，末级一次也至多消费这批量。运行末级前，检查队列；不到半满且源还有数，就让上游补一批。这种容量配合使一批消费不必逐项回头启动上游。","上游本身也按同样规则调用更小上游，逐项写入队尾并更新 count。真正源结束时设结束标记；结束的源仍可能有队列余项，先读完才能退出。不能因一次队列空就断定源结束。","末级比较可用队首，输出较小记录，推进它的 head、减 count。相等优先原输入较早那条流，各级必须相同。完成一批后再检查补货，直到产够请求的项数或所有输入结束。","各级只转交原记录，最终输出不能写同一条两次。接出的有序排写回当前范围，再供给更大任务，直到全排完成。"],"example":["完整小例 [7,1,6,2,8,3,5,4]，八项顶层分成两条四项。前条拆 [7,1]、[6,2]，小段插入后为 [1,7]、[2,6]，比较两头接为 [1,2,6,7]。后条同样得到 [3,4,5,8]。","最终
